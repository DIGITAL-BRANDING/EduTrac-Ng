<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Classes · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
    .cls-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .18s;}
    .cls-card:hover{box-shadow:var(--shadow);}
    .cls-name{font-size:1.05rem;font-weight:800;}
    .cls-meta{display:flex;gap:8px;flex-wrap:wrap;}
    .cls-chip{background:var(--surface-3);padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;color:var(--ink-2);}
    .cls-actions{display:flex;gap:6px;margin-top:4px;}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Add/Edit Class Modal -->
<div class="modal" id="classModal">
  <div class="modal__box" style="max-width:500px;">
    <div class="modal__header">
      <h2 class="modal__title" id="classModalTitle">Add Class</h2>
      <button class="modal__close" onclick="closeModal('classModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="classId">
      <div class="form-grid">
        <div class="form-group col-full">
          <label class="form-label">Class Name <span class="required">*</span></label>
          <input type="text" id="clsName" class="form-control" placeholder="e.g. JSS 1A, SS 2B">
        </div>
        <div class="form-group">
          <label class="form-label">Level</label>
          <select id="clsLevel" class="form-control">
            <option value="">— Select Level —</option>
            <!-- Populated from Programs & Levels tab -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Form Teacher</label>
          <select id="clsTeacher" class="form-control"><option value="">— None —</option></select>
        </div>
        <div class="form-group col-full">
          <label class="form-label">Capacity (optional)</label>
          <input type="number" id="clsCapacity" class="form-control" placeholder="e.g. 40" min="1">
        </div>
      </div>
      <div id="classFormErr" class="form-error" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('classModal')">Cancel</button>
      <button class="btn btn--primary" id="saveClassBtn" onclick="saveClass()">Save Class</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>

// ── School-type helpers (injected) ─────────────────────────────
function getSchoolType(){
  return (window._schoolCtx?.school_type) || (window._schoolType) || 'o_level';
}
function getPeriodLabel(){
  const t=getSchoolType();
  return (t==='tertiary'||t==='vocational') ? 'Semester' : 'Term';
}
function getSessionLabel(){
  const t=getSchoolType();
  return t==='tertiary' ? 'Academic Year' : 'Academic Session';
}
function buildTermOptions(terms, selectedId=''){
  return terms.map(t=>`<option value="${t.id}" ${t.id===selectedId?'selected':''}>${t.name}${t.session?' ('+t.session+')':''}</option>`).join('');
}

let levels=[], programs=[];
let currentUser, allClasses = [], teachers = [], currentTerm;

(async () => {
  currentUser = await initAdminLayout('classes', 'Classes');
  if (!currentUser) return;
  const sid = currentUser.school_id;

  const [{ data: trm }, { data: tch }] = await Promise.all([
    db.from('terms').select('*').eq('school_id', sid).eq('is_current', true).maybeSingle(),
    db.from('users').select('id,full_name').eq('school_id', sid).eq('role', 'teacher').eq('is_active', true).order('full_name'),
  ]);
  currentTerm = trm; teachers = tch || [];

  document.getElementById('clsTeacher').innerHTML = '<option value="">— None —</option>' +
    teachers.map(t => `<option value="${t.id}">${t.full_name}</option>`).join('');

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;">
      <div><h1 style="font-size:1.45rem;font-weight:800;margin:0;">Classes</h1><p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">${currentTerm ? currentTerm.name : 'No active term'}</p></div>
      <button class="btn btn--primary btn--sm" onclick="openAddClass()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Class</button>
    </div>
    <div class="cls-grid" id="classGrid"><div style="text-align:center;padding:48px;color:var(--ink-3);">Loading classes…</div></div>
  `;
  loadClasses();
})();

async function loadClasses() {
  const { data, error } = await db.from('classes')
    .select('id,name,level,level_id,program_id,capacity,teacher_id,users(full_name),enrollments(id,term_id)')
    .eq('school_id', currentUser.school_id).order('name');
  if (error) { showError('#classGrid', error.message); return; }
  allClasses = data || [];
  renderClasses();
}

function renderClasses() {
  const grid = document.getElementById('classGrid');
  if (!allClasses.length) {
    grid.innerHTML = `<div style="text-align:center;padding:48px;color:var(--ink-3);grid-column:1/-1;"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3;display:block;margin:0 auto 12px;"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><p style="font-weight:600;">No classes yet</p><p style="font-size:.8rem;"><button onclick="openAddClass()" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:.8rem;font-weight:600;text-decoration:underline;padding:0;">Create your first class</button></p></div>`;
    return;
  }
  grid.innerHTML = allClasses.map(c => {
    const enrolled = currentTerm ? (c.enrollments||[]).filter(e=>e.term_id===currentTerm.id).length : (c.enrollments||[]).length;
    return `
      <div class="cls-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;">
          <div class="cls-name">${c.name}</div>
          <span style="background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:700;">${enrolled} students</span>
        </div>
        <div class="cls-meta">
          ${(()=>{ const l=levels.find(x=>x.id===c.level_id); return (l?l.name:c.level)?`<span class="cls-chip">${l?l.name:c.level}</span>`:''; })()}
          ${c.capacity ? `<span class="cls-chip">Cap. ${c.capacity}</span>` : ''}
          ${c.users?.full_name ? `<span class="cls-chip">Form: ${c.users.full_name.split(' ')[0]}</span>` : ''}
        </div>
        <div class="cls-actions">
          <button class="btn btn--secondary btn--sm" style="flex:1;" onclick="editClass('${c.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Edit</button>
          <button class="btn btn--ghost btn--sm" style="color:var(--danger);" onclick="deleteClass('${c.id}','${c.name.replace(/'/g,"\\'")}')"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Delete</button>
        </div>
      </div>`;
  }).join('');
}

function openAddClass() {
  document.getElementById('classModalTitle').textContent = 'Add Class';
  document.getElementById('classId').value = '';
  ['clsName','clsLevel','clsCapacity'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('clsTeacher').value = '';
  document.getElementById('classFormErr').style.display = 'none';
  openModal('classModal');
}

function editClass(id) {
  const c = allClasses.find(x => x.id === id);
  if (!c) return;
  document.getElementById('classModalTitle').textContent = 'Edit Class';
  document.getElementById('classId').value = c.id;
  document.getElementById('clsName').value = c.name || '';
  document.getElementById('clsLevel').value = c.level || '';
  document.getElementById('clsCapacity').value = c.capacity || '';
  document.getElementById('clsTeacher').value = c.teacher_id || '';
  document.getElementById('classFormErr').style.display = 'none';
  openModal('classModal');
}

async function saveClass() {
  const btn = document.getElementById('saveClassBtn');
  const errEl = document.getElementById('classFormErr');
  const name = document.getElementById('clsName').value.trim();
  if (!name) { errEl.textContent = 'Class name is required.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = {
    school_id: currentUser.school_id, name,
    level_id: (()=>{ const v=document.getElementById('clsLevel').value; return (v&&v!=='__custom__')?v:null; })(),
    level: (()=>{ const sel=document.getElementById('clsLevel'); const opt=sel.options[sel.selectedIndex]; return opt&&opt.dataset.name?opt.dataset.name:null; })(),
    capacity: parseInt(document.getElementById('clsCapacity').value) || null,
    teacher_id: document.getElementById('clsTeacher').value || null,
  };
  const id = document.getElementById('classId').value;
  const { error } = id
    ? await db.from('classes').update(payload).eq('id', id)
    : await db.from('classes').insert(payload);
  btn.disabled = false; btn.textContent = 'Save Class';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('classModal'); toast(id ? 'Class updated.' : 'Class added.', 'success'); loadClasses();
}

async function deleteClass(id, name) {
  if (!confirm(`Delete class "${name}"? Enrollments in this class will also be removed.`)) return;
  const { error } = await db.from('classes').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Class deleted.', 'success'); loadClasses();
}
</script>
<script src="/js/pwa-v2.1.js"></script>

<script src="../js/assistant.js"></script>
</body>
</html>
