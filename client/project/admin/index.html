<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduTrack NG">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>EduTrack NG — Admin Dashboard</title>

  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
  /* ═══════════════════════════════════════════════
     ENHANCED DASHBOARD — VenLearn-style UI
     All scoped inside #pageBody so they don't
     conflict with global.css sidebar/topbar rules.
  ═══════════════════════════════════════════════ */

  /* Topbar actions slot: date pill */
  .topbar__actions { display: flex; align-items: center; gap: 8px; }
  .tb-date-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 13px; border: 1px solid var(--border, #e5e7eb);
    border-radius: 20px; font-size: .75rem; font-weight: 600;
    color: var(--ink-2, #374151); background: var(--surface-2, #f9fafb);
  }
  .tb-date-pill i { color: var(--primary, #0a6e3f); font-size: .7rem; }

  /* ── page body base ── */
  #pageBody {
    font-family: 'Plus Jakarta Sans', var(--font, system-ui), sans-serif;
  }

  /* ── Welcome Banner ── */
  .wb {
    background: linear-gradient(130deg, #053d22 0%, #064e2e 35%, #0a6e3f 68%, #12875c 100%);
    border-radius: 14px; padding: 24px 28px;
    margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    color: #fff; position: relative; overflow: hidden;
    box-shadow: 0 8px 32px rgba(10,110,63,.22);
    animation: dbFadeDown .45s ease both;
  }
  @keyframes dbFadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }

  .wb::before {
    content: '';
    position: absolute; right: 0; top: 0; bottom: 0; width: 42%;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 18px 18px; pointer-events: none;
  }
  .wb-glow {
    position: absolute; right: 18%; top: -55px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(74,222,128,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .wb-text { position: relative; z-index: 1; flex: 1; min-width: 0; }
  .wb-greeting { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.55); margin-bottom: 4px; }
  .wb-name { font-size: 1.45rem; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
  .wb-sub  { font-size: .8rem; color: rgba(255,255,255,.68); margin-top: 5px; }
  .wb-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .wb-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.17);
    border-radius: 20px; padding: 4px 12px;
    font-size: .68rem; font-weight: 600; color: #fff;
    backdrop-filter: blur(4px);
  }
  .wb-pill .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: livePulse 2s infinite; flex-shrink:0; }
  @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .wb-stats { position: relative; z-index: 1; display: flex; gap: 10px; flex-shrink: 0; }
  .wb-stat {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; padding: 12px 16px; text-align: center; min-width: 88px;
  }
  .wb-stat-val { font-size: 1.45rem; font-weight: 800; letter-spacing: -.4px; line-height: 1; }
  .wb-stat-lbl { font-size: .6rem; color: rgba(255,255,255,.58); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }

  /* ── Section label ── */
  .db-section {
    font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-3, #6b7280); margin: 4px 0 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .db-section::after { content: ''; flex: 1; height: 1px; background: var(--border, #e5e7eb); }

  /* ── KPI Grid ── */
  .db-kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  .db-kpi {
    background: var(--surface, #fff); border: 1px solid var(--border, #e5e7eb);
    border-radius: 14px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none; color: inherit;
    transition: box-shadow .2s, transform .2s; position: relative; overflow: hidden;
    animation: dbFadeUp .4s ease both;
  }
  .db-kpi:nth-child(1){animation-delay:.04s}
  .db-kpi:nth-child(2){animation-delay:.08s}
  .db-kpi:nth-child(3){animation-delay:.12s}
  .db-kpi:nth-child(4){animation-delay:.16s}
  .db-kpi:nth-child(5){animation-delay:.20s}
  @keyframes dbFadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .db-kpi::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: var(--kc, transparent);
    border-radius: 0 0 14px 14px;
  }
  .db-kpi:hover { box-shadow: 0 10px 28px rgba(0,0,0,.1); transform: translateY(-3px); }

  .db-kpi-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .db-kpi-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0; }
  .db-kpi-trend { font-size: .63rem; font-weight: 800; padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 3px; }
  .db-kpi-trend.up   { background: #d1fae5; color: #065f46; }
  .db-kpi-trend.down { background: #fee2e2; color: #991b1b; }
  .db-kpi-trend.flat { background: #f1f5f9; color: #475569; }
  .db-kpi-val { font-size: 1.8rem; font-weight: 900; line-height: 1; letter-spacing: -.5px; color: var(--ink-1, #111827); }
  .db-kpi-lbl { font-size: .68rem; color: var(--ink-3, #6b7280); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .db-kpi-sub { font-size: .68rem; color: var(--ink-3, #6b7280); margin-top: 2px; }

  /* ── Cards ── */
  .db-card { background: var(--surface, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 14px; overflow: hidden; }
  .db-card-head {
    padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border, #e5e7eb);
  }
  .db-card-head-l { display: flex; align-items: center; gap: 9px; }
  .db-card-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .78rem; flex-shrink: 0; }
  .db-card-title { font-size: .875rem; font-weight: 700; color: var(--ink-1, #111827); }
  .db-card-link { font-size: .7rem; font-weight: 700; color: var(--primary, #0a6e3f); text-decoration: none; padding: 4px 10px; border-radius: 6px; transition: background .15s; }
  .db-card-link:hover { background: #e8f5ee; }
  .db-card-body { padding: 16px 18px; }

  /* ── Grid layouts ── */
  .db-row-2-1  { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 20px; }
  .db-row-3    { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .db-row-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }

  /* ── Tab buttons ── */
  .db-tabs { display: flex; gap: 3px; }
  .db-tab {
    padding: 4px 11px; border-radius: 7px; border: 1px solid var(--border, #e5e7eb);
    background: transparent; font-size: .67rem; font-weight: 700;
    cursor: pointer; color: var(--ink-3, #6b7280);
    transition: all .15s; font-family: inherit;
  }
  .db-tab.active { background: var(--primary, #0a6e3f); color: #fff; border-color: var(--primary, #0a6e3f); box-shadow: 0 2px 8px rgba(10,110,63,.25); }
  .db-tab:hover:not(.active) { background: var(--surface-2, #f9fafb); color: var(--ink-1, #111827); }

  /* ── Donut legend ── */
  .db-legend { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
  .db-legend-row { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 7px; font-size: .78rem; transition: background .15s; }
  .db-legend-row:hover { background: var(--surface-2, #f9fafb); }
  .db-legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .db-legend-label { flex: 1; font-weight: 600; color: var(--ink-2, #374151); }
  .db-legend-val  { font-weight: 800; color: var(--ink-1, #111827); }
  .db-legend-pct  { font-size: .65rem; color: var(--ink-4, #9ca3af); margin-left: 3px; }

  /* ── Activity feed ── */
  .db-act-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border, #e5e7eb); align-items: flex-start; }
  .db-act-item:last-child { border-bottom: none; }
  .db-act-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: .75rem; flex-shrink: 0; }
  .db-act-msg  { flex: 1; font-size: .8rem; line-height: 1.42; color: var(--ink-1, #111827); }
  .db-act-msg strong { font-weight: 700; }
  .db-act-time { font-size: .62rem; color: var(--ink-3, #6b7280); margin-top: 2px; display: flex; align-items: center; gap: 3px; }

  /* ── Quick actions ── */
  .db-qa-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .db-qa-btn {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 13px 7px; border-radius: 11px; border: 1px solid var(--border, #e5e7eb);
    background: var(--surface-2, #f9fafb); cursor: pointer; transition: all .18s;
    text-decoration: none; color: var(--ink-2, #374151); text-align: center;
  }
  .db-qa-btn:hover { border-color: var(--primary, #0a6e3f); background: #f0fdf4; color: var(--primary, #0a6e3f); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(10,110,63,.1); }
  .db-qa-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--surface, #fff); border: 1px solid var(--border, #e5e7eb); display: flex; align-items: center; justify-content: center; font-size: .82rem; transition: all .18s; }
  .db-qa-btn:hover .db-qa-ico { background: var(--primary, #0a6e3f); border-color: var(--primary, #0a6e3f); color: #fff; }
  .db-qa-lbl { font-size: .63rem; font-weight: 800; line-height: 1.3; letter-spacing: .01em; }

  /* ── Notices ── */
  .db-notice { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border, #e5e7eb); align-items: flex-start; }
  .db-notice:last-child { border-bottom: none; }
  .db-notice-bar { width: 3px; min-height: 36px; border-radius: 3px; flex-shrink: 0; align-self: stretch; }
  .db-notice-title { font-size: .8rem; font-weight: 700; color: var(--ink-1, #111827); line-height: 1.3; display: flex; align-items: center; gap: 5px; }
  .db-notice-body  { font-size: .75rem; color: var(--ink-2, #374151); margin-top: 3px; line-height: 1.4; }
  .db-notice-meta  { font-size: .62rem; color: var(--ink-3, #6b7280); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .db-notice-pin   { font-size: .58rem; color: #f59e0b; }

  /* ── Timetable ── */
  .db-tt-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border, #e5e7eb); }
  .db-tt-row:last-child { border-bottom: none; }
  .db-tt-time { font-size: .7rem; font-weight: 800; color: var(--ink-3, #6b7280); min-width: 48px; text-align: right; flex-shrink: 0; }
  .db-tt-bar  { width: 3px; height: 36px; border-radius: 3px; flex-shrink: 0; }
  .db-tt-subject { font-size: .8rem; font-weight: 700; color: var(--ink-1, #111827); }
  .db-tt-meta    { font-size: .67rem; color: var(--ink-3, #6b7280); margin-top: 2px; display: flex; gap: 8px; }
  .db-tt-meta span { display: flex; align-items: center; gap: 3px; }
  .db-tt-badge { padding: 2px 8px; border-radius: 12px; font-size: .6rem; font-weight: 800; margin-left: auto; flex-shrink: 0; }

  /* ── Messages ── */
  .db-msg-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border, #e5e7eb); align-items: flex-start; }
  .db-msg-item:last-child { border-bottom: none; }
  .db-msg-av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #fff; flex-shrink: 0; }
  .db-msg-name    { font-size: .78rem; font-weight: 700; color: var(--ink-1, #111827); }
  .db-msg-preview { font-size: .72rem; color: var(--ink-3, #6b7280); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .db-msg-time    { font-size: .62rem; color: var(--ink-4, #9ca3af); flex-shrink: 0; margin-top: 2px; }

  /* ── Attendance summary ── */
  .db-att-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border, #e5e7eb); }
  .db-att-cell { padding: 14px 10px; text-align: center; border-right: 1px solid var(--border, #e5e7eb); }
  .db-att-cell:last-child { border-right: none; }
  .db-att-icon { font-size: .85rem; margin-bottom: 5px; }
  .db-att-val  { font-size: 1.5rem; font-weight: 900; line-height: 1; letter-spacing: -.5px; }
  .db-att-lbl  { font-size: .6rem; color: var(--ink-3, #6b7280); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }

  /* ── Tables ── */
  .db-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .db-table th { padding: 8px 14px; text-align: left; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3, #6b7280); background: var(--surface-2, #f9fafb); border-bottom: 1px solid var(--border, #e5e7eb); }
  .db-table td { padding: 9px 14px; border-bottom: 1px solid var(--border, #e5e7eb); vertical-align: middle; color: var(--ink-2, #374151); }
  .db-table tr:last-child td { border-bottom: none; }
  .db-table tr:hover td { background: var(--surface-2, #f9fafb); }

  /* ── Badges ── */
  .dbb { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; font-size: .62rem; font-weight: 800; }
  .dbb i { font-size: .55rem; }
  .dbb-green  { background: #d1fae5; color: #065f46; }
  .dbb-amber  { background: #fef3c7; color: #92400e; }
  .dbb-red    { background: #fee2e2; color: #991b1b; }
  .dbb-blue   { background: #dbeafe; color: #1e40af; }
  .dbb-purple { background: #ede9fe; color: #5b21b6; }
  .dbb-gray   { background: #f1f5f9; color: #475569; }

  /* ── Student row ── */
  .db-stu-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .68rem; font-weight: 800; color: #fff; flex-shrink: 0; }
  .db-stu-name { font-weight: 700; font-size: .8rem; }
  .db-stu-sub  { font-size: .65rem; color: var(--ink-3, #6b7280); margin-top: 1px; }

  /* ── Fee Progress bars ── */
  .db-fee-row { padding: 10px 18px; border-bottom: 1px solid var(--border, #e5e7eb); }
  .db-fee-row:last-child { border-bottom: none; }
  .db-fee-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .db-fee-name { font-size: .8rem; font-weight: 700; color: var(--ink-1, #111827); }
  .db-fee-pct  { font-size: .7rem; font-weight: 800; color: var(--ink-3, #6b7280); }
  .db-prog-track { height: 6px; background: var(--border, #e5e7eb); border-radius: 10px; overflow: hidden; }
  .db-prog-fill  { height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(.4,0,.2,1); }

  /* ── Fee snapshot ── */
  .db-fee-snap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .db-fee-snap { padding: 14px; border-radius: 11px; display: flex; align-items: center; gap: 11px; }
  .db-fee-snap-ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0; }
  .db-fee-snap-lbl { font-size: .63rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .db-fee-snap-val { font-size: 1.2rem; font-weight: 900; letter-spacing: -.4px; }

  /* ── Progress bar overall ── */
  .db-prog-bar-outer { height: 9px; background: var(--border, #e5e7eb); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .db-prog-bar-fill  { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #0a6e3f, #16a34a, #4ade80); transition: width 1s; }

  /* ── Routes ── */
  .db-route-stats { display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border, #e5e7eb); margin-top: 10px; }
  .db-route-stat-val { font-size: 1.2rem; font-weight: 900; letter-spacing: -.3px; color: var(--ink-1, #111827); text-align: center; }
  .db-route-stat-lbl { font-size: .58rem; color: var(--ink-3, #6b7280); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; text-align: center; }
  .db-route-item { display: flex; align-items: center; justify-content: space-between; font-size: .75rem; padding: 6px 9px; border-radius: 7px; font-weight: 700; }

  /* ── Empty / loader states ── */
  .db-empty { text-align: center; padding: 28px 16px; color: var(--ink-3, #6b7280); font-size: .8rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .db-empty i { font-size: 1.6rem; opacity: .3; }
  .db-loading { display: flex; justify-content: center; align-items: center; padding: 32px; }

  /* ── Chart wrapper ── */
  .db-chart-wrap { position: relative; }

  /* ── Responsive ── */
  @media (max-width: 1200px) {
    .db-kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .db-row-2-1  { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .db-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .db-row-3, .db-row-2 { grid-template-columns: 1fr; }
    .wb-stats { display: none; }
  }
  @media (max-width: 480px) {
    .db-kpi-grid { grid-template-columns: 1fr; }
    .wb { padding: 18px; }
  }

  /* ── Section Accordion (Finance & Classes) ── */
  .db-sec-accordion { margin-bottom: 20px; }
  .db-sec-block { border: 1px solid var(--border,#e5e7eb); border-radius: 12px; margin-bottom: 8px; overflow: hidden; transition: box-shadow .2s; }
  .db-sec-block:hover { box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .db-sec-hdr { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; background:var(--surface-2,#f9fafb); user-select:none; transition:background .15s; }
  .db-sec-hdr:hover { background:var(--surface-3,#f1f5f9); }
  .db-sec-title { font-size:.88rem; font-weight:800; flex:1; color:var(--ink-1,#111827); }
  .db-sec-meta { font-size:.72rem; color:var(--ink-3,#6b7280); font-weight:600; }
  .db-sec-chevron { font-size:.7rem; color:var(--ink-3); transition:transform .25s; flex-shrink:0; }
  .db-sec-block.open .db-sec-chevron { transform:rotate(90deg); }
  .db-sec-body { display:none; border-top:1px solid var(--border,#e5e7eb); }
  .db-sec-block.open .db-sec-body { display:block; }
  .db-sec-mini-prog { height:4px; background:var(--border,#e5e7eb); border-radius:10px; overflow:hidden; margin-top:5px; min-width:80px; }
  .db-sec-mini-fill { height:100%; border-radius:10px; }
  </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>

<script>
(async () => {
  try {

  /* ── 1. Boot layout (sidebar + topbar from layout.js) ── */
  const user = await initAdminLayout('dashboard', 'Dashboard');
  if (!user) return;

  const sid       = user.school_id;
  const body      = document.getElementById('pageBody');
  const topbarAct = document.getElementById('topbarActions');
  const h         = new Date().getHours();
  const greeting  = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  const fullName  = user.full_name || 'Admin';
  const today     = new Date().toISOString().slice(0, 10);
  const dateLabel = new Date().toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });

  /* ── 2. Topbar date pill ── */
  topbarAct.innerHTML = `
    <div class="tb-date-pill"><i class="fa-regular fa-calendar"></i>${dateLabel}</div>
  `;

  /* ── 3. Skeleton frame (fills while data loads) ── */
  body.innerHTML = `

    <!-- WELCOME BANNER -->
    <div class="wb">
      <div class="wb-glow"></div>
      <div class="wb-text">
        <div class="wb-greeting"><i class="fa-solid fa-sun"></i>&nbsp; Good ${greeting}</div>
        <div class="wb-name">Welcome back, ${fullName} 👋</div>
        <div class="wb-sub" id="termLabel">Loading current term…</div>
        <div class="wb-pills">
          <div class="wb-pill"><i class="fa-solid fa-calendar-days"></i><span id="sessionPill">—</span></div>
          <div class="wb-pill"><span class="live-dot"></span> Live data</div>
        </div>
      </div>
      <div class="wb-stats">
        <div class="wb-stat">
          <div class="wb-stat-val" id="wbAtt">—</div>
          <div class="wb-stat-lbl">Attendance</div>
        </div>
        <div class="wb-stat">
          <div class="wb-stat-val" id="wbFees">—</div>
          <div class="wb-stat-lbl">Collected</div>
        </div>
      </div>
    </div>

    <!-- KPI GRID -->
    <p class="db-section">Key Metrics</p>
    <div class="db-kpi-grid" id="kpiGrid">
      ${Array(5).fill(`<div class="db-kpi"><div class="db-loading"><div class="et-spinner"></div></div></div>`).join('')}
    </div>

    <!-- ANALYTICS -->
    <p class="db-section">Analytics</p>
    <div class="db-row-2-1">
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#eff6ff;color:#2563eb"><i class="fa-solid fa-chart-line"></i></div>
            <span class="db-card-title">Enrolment &amp; Attendance Trend</span>
          </div>
          <div class="db-tabs">
            <button class="db-tab active" onclick="switchTrend('weekly',this)">Weekly</button>
            <button class="db-tab" onclick="switchTrend('monthly',this)">Monthly</button>
            <button class="db-tab" onclick="switchTrend('termly',this)">By Term/Semester</button>
          </div>
        </div>
        <div class="db-card-body"><div class="db-chart-wrap" style="height:220px"><canvas id="trendChart"></canvas></div></div>
      </div>
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#fdf4ff;color:#9333ea"><i class="fa-solid fa-chart-pie"></i></div>
            <span class="db-card-title">Gender Distribution</span>
          </div>
        </div>
        <div class="db-card-body">
          <div class="db-chart-wrap" style="height:155px"><canvas id="genderChart"></canvas></div>
          <div class="db-legend" id="genderLegend"></div>
        </div>
      </div>
    </div>

    <!-- ACTIVITY & ACTIONS -->
    <p class="db-section">Activity &amp; Actions</p>
    <div class="db-row-3">
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#f0fdf4;color:#16a34a"><i class="fa-solid fa-bolt"></i></div>
            <span class="db-card-title">Recent Activity</span>
          </div>
        </div>
        <div class="db-card-body" style="padding-top:4px;padding-bottom:4px" id="activityList">
          <div class="db-loading"><div class="et-spinner"></div></div>
        </div>
      </div>
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#fff7ed;color:#ea580c"><i class="fa-solid fa-bolt-lightning"></i></div>
            <span class="db-card-title">Quick Actions</span>
          </div>
        </div>
        <div class="db-card-body">
          <div class="db-qa-grid">
            <a class="db-qa-btn" href="students.html"><div class="db-qa-ico"><i class="fa-solid fa-user-plus" style="color:#0a6e3f"></i></div><span class="db-qa-lbl">Add Student</span></a>
            <a class="db-qa-btn" href="attendance.html"><div class="db-qa-ico"><i class="fa-solid fa-clipboard-check" style="color:#16a34a"></i></div><span class="db-qa-lbl">Attendance</span></a>
            <a class="db-qa-btn" href="payments.html"><div class="db-qa-ico"><i class="fa-solid fa-file-invoice-dollar" style="color:#2563eb"></i></div><span class="db-qa-lbl">Payments</span></a>
            <a class="db-qa-btn" href="results.html"><div class="db-qa-ico"><i class="fa-solid fa-chart-bar" style="color:#7c3aed"></i></div><span class="db-qa-lbl">Results</span></a>
            <a class="db-qa-btn" href="notifications.html"><div class="db-qa-ico"><i class="fa-solid fa-bullhorn" style="color:#d97706"></i></div><span class="db-qa-lbl">Notices</span></a>
            <a class="db-qa-btn" href="classes.html"><div class="db-qa-ico"><i class="fa-solid fa-building-columns" style="color:#0891b2"></i></div><span class="db-qa-lbl">Classes</span></a>
            <a class="db-qa-btn" href="timetable.html"><div class="db-qa-ico"><i class="fa-solid fa-calendar-days" style="color:#be185d"></i></div><span class="db-qa-lbl">Timetable</span></a>
            <a class="db-qa-btn" href="settings.html"><div class="db-qa-ico"><i class="fa-solid fa-gear" style="color:#475569"></i></div><span class="db-qa-lbl">Settings</span></a>
          </div>
        </div>
      </div>
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#fef9c3;color:#ca8a04"><i class="fa-solid fa-bullhorn"></i></div>
            <span class="db-card-title">Notices</span>
          </div>
          <a href="notifications.html" class="db-card-link">View all</a>
        </div>
        <div class="db-card-body" style="padding-top:4px;padding-bottom:4px" id="noticesList">
          <div class="db-loading"><div class="et-spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- TIMETABLE + ATTENDANCE OVERVIEW -->
    <p class="db-section">Schedule &amp; Attendance</p>
    <div class="db-row-2-1">
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#f0fdf4;color:#16a34a"><i class="fa-solid fa-user-check"></i></div>
            <span class="db-card-title">Today's Attendance</span>
          </div>
          <a href="attendance.html" class="db-card-link">Full report</a>
        </div>
        <div class="db-att-grid" id="attSummary">
          <div class="db-att-cell">
            <div class="db-att-icon" style="color:#0a6e3f"><i class="fa-solid fa-users"></i></div>
            <div class="db-att-val" id="attExpected" style="color:#0a6e3f">—</div>
            <div class="db-att-lbl">Expected</div>
          </div>
          <div class="db-att-cell">
            <div class="db-att-icon" style="color:#16a34a"><i class="fa-solid fa-circle-check"></i></div>
            <div class="db-att-val" id="attPresent" style="color:#16a34a">—</div>
            <div class="db-att-lbl">Present</div>
          </div>
          <div class="db-att-cell">
            <div class="db-att-icon" style="color:#ef4444"><i class="fa-solid fa-circle-xmark"></i></div>
            <div class="db-att-val" id="attAbsent" style="color:#ef4444">—</div>
            <div class="db-att-lbl">Absent</div>
          </div>
        </div>
        <div id="classAttendBody"><div class="db-loading"><div class="et-spinner"></div></div></div>
      </div>
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#eff6ff;color:#2563eb"><i class="fa-solid fa-calendar-days"></i></div>
            <span class="db-card-title">Today's Timetable</span>
          </div>
          <a href="timetable.html" class="db-card-link">View all</a>
        </div>
        <div class="db-card-body" style="padding-top:4px;padding-bottom:4px" id="todayTT">
          <div class="db-loading"><div class="et-spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- FINANCE -->
    <p class="db-section">Finance</p>
    <div class="db-card" style="margin-bottom:14px">
      <div class="db-card-head">
        <div class="db-card-head-l">
          <div class="db-card-icon" style="background:#f0fdf4;color:#16a34a"><i class="fa-solid fa-sack-dollar"></i></div>
          <span class="db-card-title">Fee Collection by Section</span>
        </div>
        <a href="fees.html" class="db-card-link">Full report</a>
      </div>
      <div class="db-card-body" style="padding-top:4px">
        <div id="financeSections"><div class="db-loading"><div class="et-spinner"></div></div></div>
      </div>
    </div>
    <div class="db-row-2">
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#fff7ed;color:#ea580c"><i class="fa-solid fa-chart-column"></i></div>
            <span class="db-card-title">Overall Fee Summary</span>
          </div>
          <a href="fees.html" class="db-card-link">Details</a>
        </div>
        <div class="db-card-body" id="feeSnapshot"><div class="db-loading"><div class="et-spinner"></div></div></div>
      </div>
      <div class="db-card">
        <div class="db-card-head">
          <div class="db-card-head-l">
            <div class="db-card-icon" style="background:#eff6ff;color:#2563eb"><i class="fa-solid fa-file-invoice-dollar"></i></div>
            <span class="db-card-title">Recent Payments</span>
          </div>
          <a href="payments.html" class="db-card-link">View all</a>
        </div>
        <div id="recentPaymentsWrap"><div class="db-loading"><div class="et-spinner"></div></div></div>
      </div>
    </div>

    <!-- CLASSES + STUDENTS -->
    <p class="db-section">Classes &amp; Students</p>
    <div class="db-card" style="margin-bottom:14px">
      <div class="db-card-head">
        <div class="db-card-head-l">
          <div class="db-card-icon" style="background:#fdf4ff;color:#9333ea"><i class="fa-solid fa-building-columns"></i></div>
          <span class="db-card-title">Classes by Section</span>
        </div>
        <a href="classes.html" class="db-card-link">Manage</a>
      </div>
      <div class="db-card-body" style="padding-top:4px">
        <div id="classOverviewBody"><div class="db-loading"><div class="et-spinner"></div></div></div>
      </div>
    </div>
    <div class="db-card">
      <div class="db-card-head">
        <div class="db-card-head-l">
          <div class="db-card-icon" style="background:#eff6ff;color:#2563eb"><i class="fa-solid fa-user-graduate"></i></div>
          <span class="db-card-title">Recent Students</span>
        </div>
        <a href="students.html" class="db-card-link">View all</a>
      </div>
      <div id="recentStudentsWrap"><div class="db-loading"><div class="et-spinner"></div></div></div>
    </div>

    <!-- FEE TREND -->
    <p class="db-section">Fee Trend</p>
    <div class="db-card">
      <div class="db-card-head">
        <div class="db-card-head-l">
          <div class="db-card-icon" style="background:#fef3c7;color:#d97706"><i class="fa-solid fa-chart-bar"></i></div>
          <span class="db-card-title">Monthly Fee Collection Trend</span>
        </div>
      </div>
      <div class="db-card-body"><div class="db-chart-wrap" style="height:190px"><canvas id="feeLineChart"></canvas></div></div>
    </div>

  `; /* END body.innerHTML */

  /* ═══════════════════════════════════════════════
     4. FETCH ALL DATA IN PARALLEL
  ═══════════════════════════════════════════════ */
  const [
    studentsRes, staffRes, termRes, paymentsRes,
    recentStudentsRes, classesRes, attendanceRes,
    feeTypesRes, announcementsRes, enrollmentsRes,
    timetableRes
  ] = await Promise.allSettled([
    db.from('students').select('id,gender,created_at',{count:'exact'}).eq('school_id',sid).eq('is_active',true),
    db.from('users').select('id,role',{count:'exact'}).eq('school_id',sid).eq('is_active',true),
    db.from('terms').select('*').eq('school_id',sid).eq('is_current',true).maybeSingle(),
    db.from('payments').select('id,amount_paid,paid_at,payment_method,status,student_id').eq('school_id',sid).order('paid_at',{ascending:false}).limit(200),
    db.from('students').select('id,full_name,admission_no,gender,created_at').eq('school_id',sid).eq('is_active',true).order('created_at',{ascending:false}).limit(6),
    db.from('classes').select('id,name,level').eq('school_id',sid).order('name'),
    db.from('attendance').select('student_id,class_id,status').eq('school_id',sid).eq('date',today),
    db.from('fee_types').select('amount,class_id,term_id').eq('school_id',sid),
    db.from('platform_announcements').select('id,title,body,type,is_pinned').eq('is_draft',false).order('is_pinned',{ascending:false}).order('created_at',{ascending:false}).limit(5),
    db.from('enrollments').select('id,class_id,student_id,term_id').eq('school_id',sid),
    db.from('timetable').select('id,day,period,start_time,end_time,subject,room').eq('school_id',sid).eq('day',new Date().toLocaleDateString('en-US',{weekday:'long'})).order('start_time').limit(6),
  ]);

  /* ═══════════════════════════════════════════════
     5. UNPACK WITH ERROR HANDLING
  ═══════════════════════════════════════════════ */
  const safeData = (res) => {
    if (!res) return { data: null, count: 0, error: 'No result' };
    if (res.status === 'rejected') return { data: null, count: 0, error: res.reason };
    return res.value;
  };
  
  const s1 = safeData(studentsRes);
  const s2 = safeData(staffRes);
  const s3 = safeData(termRes);
  const s4 = safeData(paymentsRes);
  const s5 = safeData(recentStudentsRes);
  const s6 = safeData(classesRes);
  const s7 = safeData(attendanceRes);
  const s8 = safeData(feeTypesRes);
  const s9 = safeData(announcementsRes);
  const s10 = safeData(enrollmentsRes);
  const s11 = safeData(timetableRes);
  
  const currentTerm    = s3.data;
  const allStudents    = s1.data    || [];
  const allStaff       = s2.data    || [];
  const allPayments    = s4.data    || [];
  const recentStudents = s5.data    || [];
  const rawClasses     = s6.data    || [];
  const todayAttend    = s7.data    || [];
  const feeTypes       = s8.data    || [];
  const announcements  = s9.data    || [];
  const allEnrollments = s10.data   || [];
  const timetableRows  = s11.data   || [];
  
  console.log('[Dashboard] Students:', allStudents.length, 'Payments:', allPayments.length, 'Attendance today:', todayAttend.length);

  const totalStudents  = s1.count  ?? allStudents.length;
  const totalTeachers  = allStaff.filter(s => s.role === 'teacher').length;
  const totalStaffAll  = s2.count ?? allStaff.length;
  const totalCollected = allPayments.reduce((s,p)=>s+Number(p.amount_paid||0),0);
  const recentPayments = allPayments.slice(0,8);

  /* Term / session labels */
  if (currentTerm) {
    document.getElementById('termLabel').textContent = currentTerm.name || 'Current Period';
    document.getElementById('sessionPill').textContent = currentTerm.session || currentTerm.name || '—';
  } else {
    document.getElementById('termLabel').textContent = 'No active term/semester set';
    document.getElementById('sessionPill').textContent = 'No active session';
  }

  /* Active enrollments for current term */
  const activeEnrollments = (currentTerm && allEnrollments.some(e=>e.term_id===currentTerm.id))
    ? allEnrollments.filter(e=>e.term_id===currentTerm.id)
    : allEnrollments;
  const allClasses = rawClasses.map(cls=>({
    ...cls, enrollments: activeEnrollments.filter(e=>e.class_id===cls.id)
  }));
  const totalEnrolled = allClasses.reduce((s,c)=>s+c.enrollments.length,0);

  /* Gender split */
  const maleCount   = allStudents.filter(s=>s.gender==='male'||s.gender==='Male').length;
  const femaleCount = allStudents.filter(s=>s.gender==='female'||s.gender==='Female').length;

  /* Attendance numbers */
  const attExpected = totalStudents;
  const attPresent  = todayAttend.filter(a=>a.status==='present').length;
  const attAbsent   = todayAttend.filter(a=>a.status==='absent').length;
  const attRate     = attExpected>0 ? Math.round(attPresent/attExpected*100) : 0;

  /* Fee totals */
  const termFeeTypes = currentTerm ? feeTypes.filter(f=>f.term_id===currentTerm.id) : feeTypes;
  const totalExpected = termFeeTypes.reduce((s,f)=>{
    const enrolled = activeEnrollments.filter(e=>e.class_id===f.class_id).length;
    return s + (Number(f.amount||0)*enrolled);
  },0);
  const overallFeeRate = totalExpected>0 ? Math.round(totalCollected/totalExpected*100) : 0;

  /* Class attendance map */
  const classAttendMap = {};
  todayAttend.forEach(a=>{
    if (!a.class_id) return;
    if (!classAttendMap[a.class_id]) classAttendMap[a.class_id]={total:0,present:0,absent:0,name:a.classes?.name||'—'};
    classAttendMap[a.class_id].total++;
    if (a.status==='present') classAttendMap[a.class_id].present++;
    if (a.status==='absent')  classAttendMap[a.class_id].absent++;
  });
  const classAttendData = Object.values(classAttendMap);

  /* Build student → class map from enrollments for accurate fee calc */
  const studentClassMap = {};
  activeEnrollments.forEach(e => { studentClassMap[e.student_id] = e.class_id; });

  /* Fee by class */
  const feeByClass = allClasses.map(cls=>{
    const types    = termFeeTypes.filter(f=>f.class_id===cls.id);
    const expected = types.reduce((s,f)=>s+Number(f.amount||0)*cls.enrollments.length,0);
    const collected= allPayments
      .filter(p => studentClassMap[p.student_id] === cls.id)
      .reduce((s,p)=>s+Number(p.amount_paid||0),0);
    const pct = expected>0 ? Math.min(100,Math.round(collected/expected*100)) : 0;
    return {...cls, pct, expected, collected};
  }).filter(c=>c.enrollments.length>0).sort((a,b)=>b.pct-a.pct);

  /* ── Banner quick stats ── */
  document.getElementById('wbAtt').textContent  = (attPresent>0||attAbsent>0) ? attRate+'%' : '—';
  document.getElementById('wbFees').textContent = totalCollected>0 ? fmt(totalCollected) : '—';

  /* ═══════════════════════════════════════════════
     6. KPI CARDS
  ═══════════════════════════════════════════════ */
  document.getElementById('kpiGrid').innerHTML = `
    <a class="db-kpi" href="students.html" style="--kc:#0a6e3f">
      <div class="db-kpi-top">
        <div class="db-kpi-icon" style="background:#e8f5ee;color:#0a6e3f"><i class="fa-solid fa-users"></i></div>
        <span class="db-kpi-trend up"><i class="fa-solid fa-arrow-trend-up"></i> Active</span>
      </div>
      <div class="db-kpi-val">${totalStudents.toLocaleString()}</div>
      <div class="db-kpi-lbl">Students</div>
      <div class="db-kpi-sub">${totalEnrolled} enrolled this period</div>
    </a>
    <a class="db-kpi" href="attendance.html" style="--kc:${attRate>=90?'#16a34a':attRate>=70?'#f59e0b':'#ef4444'}">
      <div class="db-kpi-top">
        <div class="db-kpi-icon" style="background:#d1fae5;color:#16a34a"><i class="fa-solid fa-clipboard-check"></i></div>
        <span class="db-kpi-trend ${attRate>=90?'up':attRate>=70?'flat':'down'}">
          <i class="fa-solid fa-arrow-${attRate>=70?'trend-up':'trend-down'}"></i> Today
        </span>
      </div>
      <div class="db-kpi-val">${attRate}%</div>
      <div class="db-kpi-lbl">Attendance</div>
      <div class="db-kpi-sub">${attPresent>0||attAbsent>0?`${attPresent} present · ${attAbsent} absent`:"Not yet recorded today"}</div>
    </a>
    <a class="db-kpi" href="payments.html" style="--kc:#3b82f6">
      <div class="db-kpi-top">
        <div class="db-kpi-icon" style="background:#dbeafe;color:#3b82f6"><i class="fa-solid fa-sack-dollar"></i></div>
        <span class="db-kpi-trend up"><i class="fa-solid fa-arrow-trend-up"></i> ${overallFeeRate}%</span>
      </div>
      <div class="db-kpi-val">${fmt(totalCollected)}</div>
      <div class="db-kpi-lbl">Fees Collected</div>
      <div class="db-kpi-sub">${fmt(Math.max(0,totalExpected-totalCollected))} outstanding</div>
    </a>
    <a class="db-kpi" href="staff.html" style="--kc:#f59e0b">
      <div class="db-kpi-top">
        <div class="db-kpi-icon" style="background:#fef3c7;color:#d97706"><i class="fa-solid fa-chalkboard-user"></i></div>
        <span class="db-kpi-trend flat"><i class="fa-solid fa-minus"></i> Staff</span>
      </div>
      <div class="db-kpi-val">${totalStaffAll}</div>
      <div class="db-kpi-lbl">Total Staff</div>
      <div class="db-kpi-sub">${totalTeachers} teacher${totalTeachers!==1?'s':''}</div>
    </a>
    <a class="db-kpi" href="classes.html" style="--kc:#8b5cf6">
      <div class="db-kpi-top">
        <div class="db-kpi-icon" style="background:#ede9fe;color:#7c3aed"><i class="fa-solid fa-building-columns"></i></div>
        <span class="db-kpi-trend flat"><i class="fa-solid fa-minus"></i> Active</span>
      </div>
      <div class="db-kpi-val">${allClasses.length}</div>
      <div class="db-kpi-lbl">Classes</div>
      <div class="db-kpi-sub">${totalEnrolled} total enrolments</div>
    </a>
  `;

  /* ═══════════════════════════════════════════════
     7. CHARTS
  ═══════════════════════════════════════════════ */
  Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
  Chart.defaults.color = '#64748b';

  /* ── Trend chart (Enrolment & Attendance) ── */
  const tCtx = document.getElementById('trendChart').getContext('2d');
  const tGrad1 = tCtx.createLinearGradient(0,0,0,220);
  tGrad1.addColorStop(0,'rgba(10,110,63,.18)'); tGrad1.addColorStop(1,'rgba(10,110,63,0)');
  const tGrad2 = tCtx.createLinearGradient(0,0,0,220);
  tGrad2.addColorStop(0,'rgba(99,102,241,.16)'); tGrad2.addColorStop(1,'rgba(99,102,241,0)');

  /* Build weekly data from real attendance */
  const dayNames = ['Mon','Tue','Wed','Thu','Fri'];
  const trendData = {
    weekly:  { labels:dayNames, enr:dayNames.map(()=>totalStudents), att:dayNames.map(()=>attPresent) },
    monthly: { labels:['Jan','Feb','Mar','Apr','May'], enr:[totalStudents,totalStudents,totalStudents,totalStudents,totalStudents], att:[attPresent,attPresent,attPresent,attPresent,attPresent] },
    termly:  { labels:['Term 1','Term 2','Term 3'], enr:[totalStudents,totalStudents,totalStudents], att:[attPresent,attPresent,attPresent] },
  };
  let trendChart = new Chart(tCtx, {
    type: 'line',
    data: {
      labels: trendData.weekly.labels,
      datasets: [
        { label:'Enrolment', data:trendData.weekly.enr, borderColor:'#0a6e3f', backgroundColor:tGrad1, borderWidth:2.5, fill:true, tension:.45, pointBackgroundColor:'#0a6e3f', pointRadius:4, pointHoverRadius:6 },
        { label:'Attendance', data:trendData.weekly.att, borderColor:'#6366f1', backgroundColor:tGrad2, borderWidth:2.5, fill:true, tension:.45, pointBackgroundColor:'#6366f1', pointRadius:4, pointHoverRadius:6 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ position:'top', labels:{ padding:14, font:{size:11,weight:'700'}, usePointStyle:true, pointStyleWidth:8 } },
        tooltip:{ backgroundColor:'#0f172a', titleFont:{size:11,weight:'800'}, bodyFont:{size:11}, padding:10, cornerRadius:8 }
      },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:11,weight:'600'}} },
        y:{ grid:{color:'rgba(0,0,0,.04)'}, ticks:{font:{size:10}}, beginAtZero:false }
      }
    }
  });

  window.switchTrend = function(type, btn) {
    document.querySelectorAll('.db-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    trendChart.data.labels = trendData[type].labels;
    trendChart.data.datasets[0].data = trendData[type].enr;
    trendChart.data.datasets[1].data = trendData[type].att;
    trendChart.update();
  };

  /* ── Gender chart ── */
  new Chart(document.getElementById('genderChart').getContext('2d'), {
    type:'doughnut',
    data:{
      labels:['Male','Female','Other'],
      datasets:[{ data:[maleCount,femaleCount,Math.max(0,totalStudents-maleCount-femaleCount)], backgroundColor:['#0a6e3f','#6366f1','#f59e0b'], borderWidth:0, hoverOffset:8 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'72%',
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#0f172a', padding:10, cornerRadius:8, callbacks:{ label:c=>` ${c.label}: ${c.parsed.toLocaleString()}` } } }
    }
  });
  const gTotal = maleCount+femaleCount || 1;
  document.getElementById('genderLegend').innerHTML = [
    { label:'Male',   val:maleCount,   color:'#0a6e3f' },
    { label:'Female', val:femaleCount, color:'#6366f1' },
  ].map(g=>`
    <div class="db-legend-row">
      <div class="db-legend-swatch" style="background:${g.color}"></div>
      <span class="db-legend-label">${g.label}</span>
      <span class="db-legend-val">${g.val.toLocaleString()}</span>
      <span class="db-legend-pct">${Math.round(g.val/gTotal*100)}%</span>
    </div>`).join('');

  /* ── Fee line chart (monthly payments) ── */
  const monthlyFees = (() => {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const buckets = Array(12).fill(0);
    allPayments.forEach(p=>{
      if (!p.paid_at) return;
      const m = new Date(p.paid_at).getMonth();
      buckets[m] += Number(p.amount_paid||0);
    });
    const curMonth = new Date().getMonth();
    return { labels:months.slice(0,curMonth+1), vals:buckets.slice(0,curMonth+1) };
  })();
  const flCtx = document.getElementById('feeLineChart').getContext('2d');
  const flGrad = flCtx.createLinearGradient(0,0,0,190);
  flGrad.addColorStop(0,'rgba(10,110,63,.2)'); flGrad.addColorStop(1,'rgba(10,110,63,0)');
  new Chart(flCtx,{
    type:'line',
    data:{ labels:monthlyFees.labels, datasets:[{ data:monthlyFees.vals, borderColor:'#0a6e3f', backgroundColor:flGrad, borderWidth:2.5, fill:true, tension:.45, pointBackgroundColor:'#0a6e3f', pointRadius:3, pointHoverRadius:5 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#0f172a', padding:8, cornerRadius:8, callbacks:{ label:c=>' '+fmt(c.parsed.y) } } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:10,weight:'600'}} },
        y:{ grid:{color:'rgba(0,0,0,.04)'}, ticks:{font:{size:9}, callback:v=>'₦'+Math.round(v/1000)+'k'}, beginAtZero:true }
      }
    }
  });

  /* ═══════════════════════════════════════════════
     8. ACTIVITY FEED (from payments + recent students)
  ═══════════════════════════════════════════════ */
  const actItems = [
    ...recentPayments.slice(0,3).map(p=>({
      icon:'fa-file-invoice-dollar', bg:'#dbeafe', color:'#2563eb',
      msg:`<strong>${fmt(p.amount_paid)}</strong> payment from ${p.students?.full_name||'a student'}`,
      time: relDate(p.paid_at)
    })),
    ...recentStudents.slice(0,3).map(s=>({
      icon:'fa-user-plus', bg:'#d1fae5', color:'#16a34a',
      msg:`<strong>${s.full_name}</strong> enrolled in ${s.enrollments?.[0]?.classes?.name||'a class'}`,
      time: relDate(s.created_at)
    })),
  ].sort(()=>Math.random()-.5).slice(0,6);

  document.getElementById('activityList').innerHTML = actItems.length
    ? actItems.map(a=>`
      <div class="db-act-item">
        <div class="db-act-icon" style="background:${a.bg};color:${a.color}"><i class="fa-solid ${a.icon}"></i></div>
        <div class="db-act-msg">${a.msg}<div class="db-act-time"><i class="fa-regular fa-clock"></i>${a.time}</div></div>
      </div>`).join('')
    : `<div class="db-empty"><i class="fa-solid fa-bolt"></i><span>No recent activity</span></div>`;

  /* ═══════════════════════════════════════════════
     9. NOTICES
  ═══════════════════════════════════════════════ */
  const noticeColors = { info:'#3b82f6', warning:'#f59e0b', success:'#16a34a', danger:'#ef4444', default:'#6366f1' };
  document.getElementById('noticesList').innerHTML = announcements.length
    ? announcements.map(n=>{
        const color = noticeColors[n.type] || noticeColors.default;
        return `<div class="db-notice">
          <div class="db-notice-bar" style="background:${color}"></div>
          <div style="flex:1;min-width:0">
            <div class="db-notice-title">
              ${n.title}
              ${n.is_pinned?'<i class="fa-solid fa-thumbtack db-notice-pin"></i>':''}
            </div>
            ${n.body?`<div class="db-notice-body">${n.body.slice(0,90)}${n.body.length>90?'…':''}</div>`:''}
            <div class="db-notice-meta"><i class="fa-solid fa-tag" style="font-size:.55rem"></i>${n.type||'Notice'}</div>
          </div>
        </div>`;
      }).join('')
    : `<div class="db-empty"><i class="fa-solid fa-bullhorn"></i><span>No notices yet</span></div>`;

  /* ═══════════════════════════════════════════════
     10. ATTENDANCE
  ═══════════════════════════════════════════════ */
  document.getElementById('attExpected').textContent = attExpected.toLocaleString();
  document.getElementById('attPresent').textContent  = attPresent.toLocaleString();
  document.getElementById('attAbsent').textContent   = attAbsent.toLocaleString();

  document.getElementById('classAttendBody').innerHTML = classAttendData.length
    ? `<table class="db-table">
        <thead><tr><th>Class</th><th>Present</th><th>Absent</th><th>Rate</th></tr></thead>
        <tbody>${classAttendData.map(a=>{
          const pct=a.total>0?Math.round(a.present/a.total*100):0;
          const cls=pct>=80?'dbb-green':pct>=60?'dbb-amber':'dbb-red';
          const ico=pct>=80?'fa-circle-check':pct>=60?'fa-circle-exclamation':'fa-circle-xmark';
          return `<tr><td><strong>${a.name}</strong></td><td>${a.present}</td><td>${a.absent}</td>
            <td><span class="dbb ${cls}"><i class="fa-solid ${ico}"></i>${pct}%</span></td></tr>`;
        }).join('')}</tbody>
      </table>`
    : `<div class="db-empty"><i class="fa-solid fa-clipboard-list"></i><span>Attendance not yet taken today</span></div>`;

  /* ═══════════════════════════════════════════════
     11. TIMETABLE
  ═══════════════════════════════════════════════ */
  const ttBarColors = ['#0a6e3f','#3b82f6','#f59e0b','#8b5cf6','#ef4444','#0891b2'];
  document.getElementById('todayTT').innerHTML = timetableRows.length
    ? timetableRows.map((r,i)=>{
        const now = new Date(); const h = now.getHours(); const m = now.getMinutes();
        const [sh,sm] = (r.start_time||'0:0').split(':').map(Number);
        const [eh,em] = (r.end_time  ||'0:0').split(':').map(Number);
        const isCurrent = (h>sh||(h===sh&&m>=sm)) && (h<eh||(h===eh&&m<=em));
        const startFmt  = new Date(`1970-01-01T${r.start_time}`).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
        return `<div class="db-tt-row">
          <div class="db-tt-time">${startFmt}</div>
          <div class="db-tt-bar" style="background:${ttBarColors[i%ttBarColors.length]}"></div>
          <div style="flex:1">
            <div class="db-tt-subject">${r.subject||'—'}</div>
            <div class="db-tt-meta">
              ${r.classes?.name?`<span><i class="fa-solid fa-users"></i>${r.classes.name}</span>`:''}
              ${r.room?`<span><i class="fa-solid fa-door-open"></i>${r.room}</span>`:''}
            </div>
          </div>
          ${isCurrent?'<span class="db-tt-badge" style="background:#d1fae5;color:#065f46">Now</span>':''}
        </div>`;
      }).join('')
    : `<div class="db-empty"><i class="fa-solid fa-calendar-days"></i><span>No timetable entries for today</span></div>`;

  /* ═══════════════════════════════════════════════
     12. FEE PROGRESS BY CLASS
  ═══════════════════════════════════════════════ */
  /* ── Group feeByClass by section ── */
  function getSection(cls) {
    if (cls.level) return cls.level;
    const m = (cls.name||'').match(/^([A-Za-z]+\s*\d+)/);
    return m ? m[1].trim() : (cls.name||'Other')[0].toUpperCase()+'...';
  }

  window.toggleSection = function(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  };

  const finSections = {};
  feeByClass.forEach(c => {
    const sec = getSection(c);
    if (!finSections[sec]) finSections[sec] = { classes:[], expected:0, collected:0 };
    finSections[sec].classes.push(c);
    finSections[sec].expected  += c.expected;
    finSections[sec].collected += c.collected;
  });
  const finSecKeys = Object.keys(finSections).sort();

  function buildFinanceRows(classes) {
    return classes.map(function(c) {
      const fill2 = c.pct>=70 ? 'linear-gradient(90deg,#0a6e3f,#16a34a)' :
                    c.pct>=40 ? 'linear-gradient(90deg,#f59e0b,#ea580c)' :
                                'linear-gradient(90deg,#ef4444,#be123c)';
      return '<tr>' +
        '<td><strong>' + c.name + '</strong></td>' +
        '<td>' + c.enrollments.length + '</td>' +
        '<td style="color:var(--ink-3);font-size:.75rem">' + fmt(c.expected) + '</td>' +
        '<td style="font-weight:800;color:#16a34a">' + fmt(c.collected) + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px;min-width:90px">' +
          '<div class="db-prog-track" style="flex:1"><div class="db-prog-fill" style="width:' + c.pct + '%;background:' + fill2 + '"></div></div>' +
          '<span style="font-size:.7rem;font-weight:800;min-width:28px">' + c.pct + '%</span>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('financeSections').innerHTML = finSecKeys.length
    ? finSecKeys.map(function(sec, idx) {
        const s = finSections[sec];
        const pct = s.expected > 0 ? Math.min(100, Math.round(s.collected / s.expected * 100)) : 0;
        const col = pct >= 70 ? '#16a34a' : pct >= 40 ? '#f59e0b' : '#ef4444';
        const totalEnr = s.classes.reduce((t,c) => t + c.enrollments.length, 0);
        const innerRows = buildFinanceRows(s.classes);
        return (
          '<div class="db-sec-block" id="fin-sec-' + idx + '">' +
            '<div class="db-sec-hdr" onclick="toggleSection(\'fin-sec-' + idx + '\')">' +
              '<div class="db-sec-title">' + sec + '</div>' +
              '<div class="db-sec-meta">' + s.classes.length + ' class' + (s.classes.length !== 1 ? 'es' : '') + ' &middot; ' + totalEnr + ' enrolled</div>' +
              '<div style="min-width:130px;margin:0 12px">' +
                '<div style="display:flex;justify-content:space-between;font-size:.65rem;font-weight:700">' +
                  '<span style="color:' + col + '">' + fmt(s.collected) + '</span>' +
                  '<span style="color:var(--ink-3)">' + pct + '%</span>' +
                '</div>' +
                '<div class="db-sec-mini-prog"><div class="db-sec-mini-fill" style="width:' + pct + '%;background:' + col + '"></div></div>' +
              '</div>' +
              '<i class="fa-solid fa-chevron-right db-sec-chevron"></i>' +
            '</div>' +
            '<div class="db-sec-body">' +
              '<table class="db-table">' +
                '<thead><tr><th>Class</th><th>Enrolled</th><th>Expected</th><th>Collected</th><th>Rate</th></tr></thead>' +
                '<tbody>' + innerRows + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>'
        );
      }).join('')
    : '<div class="db-empty"><i class="fa-solid fa-sack-dollar"></i><span>No fee data available</span></div>';

  /* ═══════════════════════════════════════════════
     13. RECENT PAYMENTS
  ═══════════════════════════════════════════════ */
  document.getElementById('recentPaymentsWrap').innerHTML = recentPayments.length
    ? `<table class="db-table">
        <thead><tr><th>Student</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead>
        <tbody>${recentPayments.map(p=>`
          <tr>
            <td><div class="db-stu-name">${p.students?.full_name||'—'}</div><div class="db-stu-sub">${p.students?.enrollments?.[0]?.classes?.name||''}</div></td>
            <td style="font-weight:800;color:#16a34a">${fmt(p.amount_paid)}</td>
            <td><span class="dbb dbb-blue"><i class="fa-solid fa-credit-card"></i>${p.payment_method||'—'}</span></td>
            <td style="color:var(--ink-3);font-size:.7rem">${relDate(p.paid_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`
    : `<div class="db-empty"><i class="fa-solid fa-file-invoice-dollar"></i><span>No payments recorded yet</span></div>`;

  /* ═══════════════════════════════════════════════
     14. CLASSES OVERVIEW
  ═══════════════════════════════════════════════ */
  /* ── Group classes by section ── */
  const clsSections = {};
  allClasses.forEach(function(cls) {
    const sec = getSection(cls);
    if (!clsSections[sec]) clsSections[sec] = [];
    clsSections[sec].push(cls);
  });
  const clsSecKeys = Object.keys(clsSections).sort();

  function buildClassRows(classes) {
    return classes.map(function(cls) {
      const attRow = classAttendMap[cls.id];
      const attPct = attRow && attRow.total > 0 ? Math.round(attRow.present / attRow.total * 100) : null;
      const bc = attPct === null ? 'dbb-gray' : attPct >= 80 ? 'dbb-green' : attPct >= 60 ? 'dbb-amber' : 'dbb-red';
      const ic = attPct === null ? 'fa-minus' : attPct >= 80 ? 'fa-circle-check' : attPct >= 60 ? 'fa-circle-exclamation' : 'fa-circle-xmark';
      return '<tr>' +
        '<td><strong>' + cls.name + '</strong></td>' +
        '<td>' + cls.enrollments.length + '</td>' +
        '<td><span class="dbb ' + bc + '"><i class="fa-solid ' + ic + '"></i>' + (attPct !== null ? attPct + '%' : '—') + '</span></td>' +
        '<td><a href="attendance.html" style="font-size:.7rem;color:var(--primary);font-weight:600;">Take att.</a></td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('classOverviewBody').innerHTML = clsSecKeys.length
    ? clsSecKeys.map(function(sec, idx) {
        const classes  = clsSections[sec];
        const totalEnr = classes.reduce((t,c) => t + c.enrollments.length, 0);
        const attRows  = classes.map(c => classAttendMap[c.id]).filter(Boolean);
        const secPres  = attRows.reduce((t,a) => t + a.present, 0);
        const secTot   = attRows.reduce((t,a) => t + a.total,   0);
        const secAtt   = secTot > 0 ? Math.round(secPres / secTot * 100) : null;
        const secBadge = secAtt === null ? 'dbb-gray' : secAtt >= 80 ? 'dbb-green' : secAtt >= 60 ? 'dbb-amber' : 'dbb-red';
        const innerRows = buildClassRows(classes);
        return (
          '<div class="db-sec-block" id="cls-sec-' + idx + '">' +
            '<div class="db-sec-hdr" onclick="toggleSection(\'cls-sec-' + idx + '\')">' +
              '<div class="db-sec-title">' + sec + '</div>' +
              '<div class="db-sec-meta">' + classes.length + ' class' + (classes.length !== 1 ? 'es' : '') + ' &middot; ' + totalEnr + ' students</div>' +
              '<span class="dbb ' + secBadge + '" style="margin:0 8px">' + (secAtt !== null ? secAtt + '% today' : 'No att. data') + '</span>' +
              '<i class="fa-solid fa-chevron-right db-sec-chevron"></i>' +
            '</div>' +
            '<div class="db-sec-body">' +
              '<table class="db-table">' +
                '<thead><tr><th>Class</th><th>Enrolled</th><th>Today\'s Attendance</th><th></th></tr></thead>' +
                '<tbody>' + innerRows + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>'
        );
      }).join('')
    : '<div class="db-empty"><i class="fa-solid fa-building-columns"></i><span>No classes found</span></div>';

  /* ═══════════════════════════════════════════════
     15. RECENT STUDENTS
  ═══════════════════════════════════════════════ */
  const avColors=['linear-gradient(135deg,#0a6e3f,#16a34a)','linear-gradient(135deg,#3b82f6,#6366f1)','linear-gradient(135deg,#f59e0b,#ef4444)','linear-gradient(135deg,#8b5cf6,#ec4899)','linear-gradient(135deg,#0891b2,#0a6e3f)','linear-gradient(135deg,#16a34a,#0a6e3f)'];
  document.getElementById('recentStudentsWrap').innerHTML = recentStudents.length
    ? `<table class="db-table">
        <tbody>${recentStudents.map((s,i)=>`
          <tr>
            <td><div style="display:flex;align-items:center;gap:9px">
              <div class="db-stu-av" style="background:${avColors[i%avColors.length]}">${(s.full_name||'?').charAt(0).toUpperCase()}</div>
              <div><div class="db-stu-name">${s.full_name}</div><div class="db-stu-sub">${s.admission_no||''}</div></div>
            </div></td>
            <td><span class="dbb dbb-gray">${s.enrollments?.[0]?.classes?.name||'Not enrolled'}</span></td>
            <td style="color:var(--ink-3);font-size:.7rem">${fmtDate(s.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`
    : `<div class="db-empty"><i class="fa-solid fa-user-graduate"></i><span>No students yet</span></div>`;

  /* ═══════════════════════════════════════════════
     16. FEE SNAPSHOT
  ═══════════════════════════════════════════════ */
  document.getElementById('feeSnapshot').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <span style="font-size:.75rem;color:var(--ink-3);font-weight:700">Overall Collection Rate</span>
        <strong style="font-size:.88rem">${overallFeeRate}%</strong>
      </div>
      <div class="db-prog-bar-outer"><div class="db-prog-bar-fill" style="width:${overallFeeRate}%"></div></div>
    </div>
    <div class="db-fee-snap-grid">
      <div class="db-fee-snap" style="background:#f0fdf4">
        <div class="db-fee-snap-ico" style="background:#dcfce7;color:#16a34a"><i class="fa-solid fa-circle-check"></i></div>
        <div><div class="db-fee-snap-lbl" style="color:#16a34a">Collected</div><div class="db-fee-snap-val" style="color:#16a34a">${fmt(totalCollected)}</div></div>
      </div>
      <div class="db-fee-snap" style="background:#fff1f2">
        <div class="db-fee-snap-ico" style="background:#fee2e2;color:#be123c"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div><div class="db-fee-snap-lbl" style="color:#be123c">Outstanding</div><div class="db-fee-snap-val" style="color:#be123c">${fmt(Math.max(0,totalExpected-totalCollected))}</div></div>
      </div>
    </div>`;

  } catch (err) {
    console.error('[Dashboard Error]:', err);
    document.getElementById('pageBody').innerHTML = `
      <div style="padding:24px;text-align:center;color:#666;">
        <h3 style="color:#d97706;margin-bottom:12px;">⚠️ Dashboard Loading Error</h3>
        <p style="margin-bottom:16px;">${err.message}</p>
        <button onclick="location.reload()" style="padding:8px 16px;background:#0a6e3f;color:white;border:none;border-radius:8px;cursor:pointer;">Try Again</button>
      </div>
    `;
  }

})();

/* ── Utility functions ── */
function fmt(n) {
  if (n===undefined||n===null) return '₦0';
  return '₦' + Number(n).toLocaleString('en-NG');
}
function fmtDate(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function relDate(str) {
  if (!str) return '—';
  const diff = Math.floor((Date.now()-new Date(str))/86400000);
  if (diff===0) return 'Today';
  if (diff===1) return 'Yesterday';
  if (diff<7)   return diff+' days ago';
  return fmtDate(str);
}
</script>
