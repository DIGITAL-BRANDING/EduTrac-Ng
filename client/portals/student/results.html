<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>EduTrack NG — My Report Card</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    /* ── Gate wrappers ─────────────────────────────────────── */
    .gate-wrap {
      max-width: 480px; margin: 24px auto; padding: 0 16px;
    }
    .gate-card {
      background: white; border-radius: 16px; padding: 28px 24px;
      border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,.09);
    }
    .gate-card h2 {
      font-size: 17px; font-weight: 800; margin: 0 0 6px; color: var(--ink);
    }
    .gate-card p.sub {
      font-size: 13px; color: var(--ink-3); margin: 0 0 20px; line-height: 1.6;
    }

    /* ── Period badge (shows selected period above PIN step) ── */
    .period-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #e6f4ed;
      border: 1px solid var(--primary); border-radius: 10px; margin-bottom: 16px;
    }
    .period-badge__icon  { font-size: 20px; flex-shrink: 0; }
    .period-badge__label { font-size: 11px; color: var(--primary); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; display: block; }
    .period-badge__name  { font-size: 14px; font-weight: 800; color: var(--ink); display: block; }
    .period-badge__change { font-size: 11px; color: var(--primary); background: none;
      border: none; cursor: pointer; font-weight: 600; margin-left: auto; padding: 0; }

    /* ── Step progress bar ──────────────────────────────────── */
    .step-bar {
      display: flex; align-items: center; gap: 6px;
      margin-top: 14px; padding: 0 2px;
    }
    .step-dot {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
    }
    .step-dot.done     { background: #d1fae5; color: #065f46; }
    .step-dot.active   { background: var(--primary); color: white; }
    .step-dot.inactive { background: var(--border); color: var(--ink-3); }
    .step-line         { flex: 1; height: 2px; border-radius: 1px; }
    .step-line.done    { background: var(--primary); }
    .step-line.pending { background: var(--border); }
    .step-label        { font-size: 11px; color: var(--ink-4); }

    /* ── PIN input ──────────────────────────────────────────── */
    .pin-input {
      font-family: var(--mono, monospace);
      font-size: 24px; font-weight: 700;
      letter-spacing: 6px; text-align: center;
    }

    /* ── Report card shell ──────────────────────────────────── */
    .rc-student-shell  { max-width: 820px; margin: 0 auto; padding: 16px; }
    .rc-action-bar     { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .usage-ok  {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px;
      padding: 10px 16px; margin-bottom: 16px; font-size: 13px; color: #166534;
    }
    .usage-exp {
      background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px;
      padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #991b1b;
    }

    @media print {
      .no-print         { display: none !important; }
      .gate-wrap        { display: none !important; }
      .rc-student-shell { padding: 0 !important; }
      .rc-action-bar    { display: none !important; }
      .usage-ok,
      .usage-exp        { display: none !important; }
      body              { background: white !important; padding: 0 !important; }
    }
  </style>
</head>
<body>

<!-- Layout shell injected by layout.js -->
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;
              min-height:100vh;flex-direction:column;gap:14px;
              font-family:sans-serif;color:#666;">
    <div style="width:36px;height:36px;border:4px solid #e5e7eb;
                border-top-color:#0a6e3f;border-radius:50%;
                animation:rcSpin .8s linear infinite;"></div>
    <p style="margin:0;font-size:14px;">Loading your portal…</p>
  </div>
</div>
<style>@keyframes rcSpin{to{transform:rotate(360deg)}}</style>

<!-- Load auth + layout FIRST, then engine, then page logic -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../../js/config.js"></script>
<script src="../../js/supabase.js"></script>
<script src="layout.js"></script>
<script src="../../js/report-card-engine.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────────── */
let ctx         = null;
let allTerms    = [];
let periodWord  = 'Term';   // dynamically set to Term / Semester / Quarter …

/* ─────────────────────────────────────────────────────────────
   PERIOD LABEL DETECTION  (same logic as result-checker)
───────────────────────────────────────────────────────────── */
function detectPeriodWord(terms) {
  if (!terms?.length) return 'Term';
  const s = terms.map(t => (t.name || '').toLowerCase()).join(' ');
  if (/semester/i.test(s)) return 'Semester';
  if (/quarter/i.test(s))  return 'Quarter';
  if (/session/i.test(s))  return 'Session';
  if (/module/i.test(s))   return 'Module';
  if (/period/i.test(s))   return 'Period';
  return 'Term';
}

/* ─────────────────────────────────────────────────────────────
   INIT — runs after layout is ready
───────────────────────────────────────────────────────────── */
(async () => {
  try {
    // initStudentLayout handles auth — if session missing it redirects to login
    ctx = await initStudentLayout('results', 'My Report Card');
    if (!ctx) return;   // already redirected

    const { data: termsData } = await db
      .from('terms')
      .select('id,name,is_current,academic_years(label)')
      .eq('school_id', ctx.session.school_id)
      .order('created_at', { ascending: false });

    allTerms   = termsData || [];
    periodWord = detectPeriodWord(allTerms);

    const current = allTerms.find(t => t.is_current) || allTerms[0] || null;

    /* Build the page UI */
    document.getElementById('pageBody').innerHTML = buildPageHTML(current);

    /* Keyboard shortcut: Enter on PIN step submits */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const pinStep = document.getElementById('stepPin');
        if (pinStep && pinStep.style.display !== 'none') viewReportCard();
      }
    });

  } catch (err) {
    /* Show error inside the layout shell — don't redirect unnecessarily */
    const body = document.getElementById('pageBody') || document.getElementById('app');
    if (body) body.innerHTML = `
      <div style="max-width:460px;margin:40px auto;padding:28px;background:white;
                  border-radius:12px;border:1px solid var(--border);font-family:sans-serif;">
        <p style="color:#b91c1c;font-weight:700;margin:0 0 8px;">⚠️ Could not load Results</p>
        <p style="font-size:13px;color:#555;margin:0 0 16px;">${err?.message || 'Unknown error'}</p>
        <a href="login.html" class="btn btn--primary">Log in again</a>
      </div>`;
    console.error('[EduTrack] results.html init error:', err);
  }
})();

/* ─────────────────────────────────────────────────────────────
   HTML BUILDER
───────────────────────────────────────────────────────────── */
function buildPageHTML(currentTerm) {
  const termOptions = allTerms.map(t => {
    const sess = t.academic_years?.label ? ` — ${t.academic_years.label}` : '';
    const cur  = t.is_current ? ' ★' : '';
    return `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>
              ${t.name}${sess}${cur}
            </option>`;
  }).join('');

  const noTerms = !allTerms.length
    ? `<p style="color:#b45309;font-size:13px;margin-top:8px;">
         No ${periodWord.toLowerCase()}s found. Contact your school admin.
       </p>` : '';

  return `
  <!-- ══ STEP 1: Select Period ════════════════════════════ -->
  <div id="stepTerm" class="gate-wrap">
    <div class="gate-card">
      <h2>📅 Select ${periodWord}</h2>
      <p class="sub">
        Choose which ${periodWord.toLowerCase()} you want to view your report card for.
        Your scratch card PIN will be locked to this ${periodWord.toLowerCase()} once used.
      </p>

      <div class="form-group">
        <label class="form-label">${periodWord} <span class="required">*</span></label>
        <select id="gateTermSel" class="form-control" style="font-size:15px;font-weight:600;">
          ${termOptions || `<option value="">— No ${periodWord.toLowerCase()}s available —</option>`}
        </select>
        ${noTerms}
        <div class="form-hint" style="margin-top:6px;">
          ⚠️ PIN locks to 1 student &amp; 1 ${periodWord.toLowerCase()} only.
        </div>
      </div>

      <button class="btn btn--primary btn--full" onclick="goToPin()">
        Continue →
      </button>
    </div>

    <div class="step-bar">
      <div class="step-dot active">1</div>
      <div class="step-line pending"></div>
      <div class="step-dot inactive">2</div>
      <span class="step-label">Select ${periodWord} → Enter PIN</span>
    </div>
  </div>

  <!-- ══ STEP 2: Enter PIN ═════════════════════════════════ -->
  <div id="stepPin" class="gate-wrap" style="display:none;">
    <div class="period-badge">
      <span class="period-badge__icon">📅</span>
      <div style="flex:1;">
        <span class="period-badge__label">Viewing Report Card For</span>
        <span id="pinPeriodName" class="period-badge__name">—</span>
      </div>
      <button class="period-badge__change" onclick="backToTerm()">Change</button>
    </div>

    <div class="gate-card" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:8px;">🎓</div>
      <h2>Enter Scratch Card PIN</h2>
      <p class="sub">
        Enter the 12-digit PIN from your school-issued scratch card to generate your full report card.
      </p>

      <div class="form-group" style="text-align:left;">
        <label class="form-label">Serial Number</label>
        <input type="text" id="serialNo" class="form-control"
          placeholder="e.g. SN-001234" autocomplete="off"
          style="text-transform:uppercase;">
        <div class="form-hint">Printed on your scratch card envelope.</div>
      </div>
      <div class="form-group" style="text-align:left;">
        <label class="form-label">Scratch Card PIN</label>
        <input type="text" id="pinInput" class="form-control pin-input"
          maxlength="15" placeholder="0000-0000-0000"
          inputmode="numeric" autocomplete="off"
          oninput="fmtPin(this)">
        <div class="form-hint">
          Format: XXXX-XXXX-XXXX &nbsp;·&nbsp; Up to 5 checks per card &nbsp;·&nbsp;
          Locked to this ${periodWord.toLowerCase()}
        </div>
      </div>

      <div id="pinErr" class="form-error" style="display:none;margin-bottom:12px;"></div>

      <button class="btn btn--primary btn--full" id="viewBtn" onclick="viewReportCard()">
        🎓 View My Report Card
      </button>

      <p style="font-size:11px;color:var(--ink-4);margin-top:14px;line-height:1.7;">
        Scratch cards are available from your school's admin office.
      </p>
    </div>

    <div class="step-bar">
      <div class="step-dot done">✓</div>
      <div class="step-line done"></div>
      <div class="step-dot active">2</div>
      <span class="step-label">Select ${periodWord} → Enter PIN</span>
    </div>
  </div>

  <!-- ══ REPORT CARD OUTPUT ════════════════════════════════ -->
  <div id="reportOutput" style="display:none;">
    <div class="rc-student-shell">
      <div class="rc-action-bar no-print">
        <button class="btn btn--primary" onclick="window.print()">🖨 Print Report Card</button>
        <button class="btn btn--secondary" onclick="resetGate()">← Check Another ${periodWord}</button>
      </div>
      <div id="usageBanner"></div>
      <div id="cardContent"></div>
    </div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────
   STEP NAVIGATION
───────────────────────────────────────────────────────────── */
function goToPin() {
  const sel = document.getElementById('gateTermSel');
  if (!sel?.value) {
    alert(`Please select a ${periodWord.toLowerCase()} first.`);
    return;
  }
  window._chosenTermId = sel.value;
  document.getElementById('pinPeriodName').textContent =
    sel.options[sel.selectedIndex].text.trim();
  document.getElementById('stepTerm').style.display = 'none';
  document.getElementById('stepPin').style.display  = 'block';
  setTimeout(() => document.getElementById('pinInput')?.focus(), 120);
}

function backToTerm() {
  document.getElementById('stepPin').style.display  = 'none';
  document.getElementById('stepTerm').style.display = 'block';
  document.getElementById('pinInput').value         = '';
  document.getElementById('pinErr').style.display   = 'none';
}

function resetGate() {
  document.getElementById('reportOutput').style.display = 'none';
  document.getElementById('stepPin').style.display      = 'none';
  document.getElementById('stepTerm').style.display     = 'block';
  document.getElementById('pinInput').value             = '';
  document.getElementById('pinErr').style.display       = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─────────────────────────────────────────────────────────────
   PIN AUTO-FORMAT
───────────────────────────────────────────────────────────── */
function fmtPin(inp) {
  let v = inp.value.replace(/\D/g, '');
  if (v.length > 4)  v = v.slice(0, 4)  + '-' + v.slice(4);
  if (v.length > 9)  v = v.slice(0, 9)  + '-' + v.slice(9);
  if (v.length > 14) v = v.slice(0, 14) + '-' + v.slice(14);
  inp.value = v.slice(0, 15);
}

/* ─────────────────────────────────────────────────────────────
   MAIN: Verify PIN → Build & Show Report Card
───────────────────────────────────────────────────────────── */
async function viewReportCard() {
  const rawPin = (document.getElementById('pinInput')?.value || '').replace(/\D/g, '');
  const termId = window._chosenTermId;
  const errEl  = document.getElementById('pinErr');
  const btn    = document.getElementById('viewBtn');
  errEl.style.display = 'none';

  /* Validate */
  if (!rawPin || rawPin.length !== 12) {
    errEl.textContent = 'PIN must be exactly 12 digits (XXXX-XXXX-XXXX).';
    errEl.style.display = 'block'; return;
  }
  if (!termId) {
    errEl.textContent = `Please go back and select a ${periodWord.toLowerCase()} first.`;
    errEl.style.display = 'block'; return;
  }

  btn.disabled    = true;
  btn.textContent = '⏳ Generating Report Card…';

  try {
    /* 1 ── Validate scratch card via RPC */
    const serialNo = (document.getElementById('serialNo')?.value || '').trim().toUpperCase();
    const { data: useResult, error: useErr } = await db.rpc('use_scratch_card', {
      p_pin:        rawPin,
      p_serial_no:  serialNo || null,
      p_school_id:  ctx.session.school_id,
      p_card_type:  'result',
      p_student_id: ctx.session.id,
      p_term_id:    termId,
    });
    if (useErr) throw new Error(useErr.message);
    if (useResult?.error) throw new Error(useResult.error);

    const finalTermId = useResult.term_id || termId;
    const maxUses     = useResult.max_uses;
    const usesLeft    = useResult.uses_left;
    const expired     = useResult.now_expired;

    const schoolId  = ctx.session.school_id;
    const studentId = ctx.session.id;

    /* 2 ── Parallel data fetch */
    const [schoolData, scaleData, examsData, termRow, enrData, studentData] =
      await Promise.all([
        db.from('schools')
          .select(`name, logo_url, address, state, lga, phone, email,
                   affiliation_no, school_type,
                   vp_signature_url, exam_officer_signature_url,
                   principal_signature_url, class_teacher_signature_url`)
          .eq('id', schoolId).single().then(r => r.data),

        db.from('grading_scales')
          .select('*').eq('school_id', schoolId)
          .order('min_score', { ascending: false })
          .then(r => r.data || []),

        db.from('exams')
          .select('*').eq('school_id', schoolId).eq('term_id', finalTermId)
          .order('name').then(r => r.data || []),

        db.from('terms')
          .select('*, academic_years(label)')
          .eq('id', finalTermId).single().then(r => r.data),

        db.from('enrollments')
          .select('class_id, classes(id, name, level, section, school_id)')
          .eq('student_id', studentId).eq('term_id', finalTermId)
          .maybeSingle().then(r => r.data),

        db.from('students')
          .select(`id, full_name, admission_no, roll_no, mother_name,
                   father_name, guardian_name, scholar_no,
                   dob, date_of_birth, photo_url, passport_url, avatar_url, school_id`)
          .eq('id', studentId).single().then(r => r.data),
      ]);

    /* 3 ── Hydrate engine state */
    _school        = schoolData;
    _scale         = scaleData;
    _exams         = examsData;
    _term          = termRow;
    _classRow      = enrData?.classes || null;
    _classSubjects = null;
    _bulkResults   = null;
    _bulkAtt       = null;
    _bulkAffective = null;

    /* 4 ── Build card (same function as VP / Exam Officer view) */
    const student  = studentData || {
      id:           studentId,
      full_name:    ctx.session.full_name   || '—',
      admission_no: ctx.session.admission_no || '—',
    };

    const cardHtml = await buildCard(student, finalTermId);
    if (!cardHtml) throw new Error(
      `No results found for this ${periodWord.toLowerCase()}. Please contact your school admin.`
    );

    /* 5 ── Usage banner */
    const pLabel = termRow?.name || periodWord;
    document.getElementById('usageBanner').innerHTML = expired
      ? `<div class="usage-exp no-print">
           ⚠️ <strong>This scratch card has expired.</strong>
           All ${maxUses} permitted checks have been used.
           Please obtain a new card from your school's admin office.
         </div>`
      : `<div class="usage-ok no-print">
           ✅ <strong>Check ${maxUses - usesLeft} of ${maxUses}.</strong>
           You have <strong>${usesLeft}</strong> check${usesLeft !== 1 ? 's' : ''} remaining.
           This card is locked to <strong>${pLabel}</strong>.
         </div>`;

    /* 6 ── Show card */
    document.getElementById('cardContent').innerHTML    = cardHtml;
    document.getElementById('stepPin').style.display    = 'none';
    document.getElementById('reportOutput').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch (err) {
    errEl.textContent   = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = '🎓 View My Report Card';
  }
}
</script>

<script src="/js/pwa-v2.1.js"></script>
<script src="../../js/assistant.js"></script>
</body>
</html>
