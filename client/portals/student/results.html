<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>EduTrack NG — My Report Card</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    /* ── Gate card shell ── */
    .gate-wrap {
      max-width: 460px; margin: 32px auto; padding: 0 16px;
    }
    .gate-card {
      background: white; border-radius: 16px; padding: 28px;
      border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,.09);
    }
    .gate-card h2 { font-size: 17px; font-weight: 800; margin-bottom: 4px; color: var(--ink); }
    .gate-card p.sub { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; line-height: 1.5; }

    /* ── Term badge ── */
    .term-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #e6f4ed;
      border: 1px solid var(--primary); border-radius: 10px; margin-bottom: 16px;
    }
    .term-badge__label { font-size: 11px; color: var(--primary); font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; }
    .term-badge__name  { font-size: 14px; font-weight: 800; color: var(--ink); }
    .term-badge__change { font-size: 11px; color: var(--primary); background: none;
      border: none; cursor: pointer; font-weight: 600; margin-left: auto; }

    /* ── Step indicators ── */
    .step-bar { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding: 0 4px; }
    .step-dot {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }
    .step-dot.active   { background: var(--primary); color: white; }
    .step-dot.done     { background: #d1fae5; color: #065f46; }
    .step-dot.inactive { background: var(--border); color: var(--ink-3); }
    .step-line         { flex: 1; height: 2px; }
    .step-line.done    { background: var(--primary); }
    .step-line.pending { background: var(--border); }
    .step-label        { font-size: 11px; color: var(--ink-3); margin-left: 4px; }

    /* ── Report card shell ── */
    .rc-student-shell { max-width: 820px; margin: 0 auto; padding: 16px; }
    .rc-action-bar    { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

    /* Usage banners */
    .usage-ok  { background:#f0fdf4; border:1px solid #86efac; border-radius:8px;
      padding:10px 16px; margin-bottom:16px; font-size:13px; color:#166534; }
    .usage-exp { background:#fef2f2; border:1px solid #fca5a5; border-radius:8px;
      padding:12px 16px; margin-bottom:16px; font-size:13px; color:#991b1b; }

    @media print {
      .no-print  { display: none !important; }
      .gate-wrap { display: none !important; }
      body       { background: white !important; padding: 0 !important; }
      .rc-student-shell { padding: 0 !important; }
      .rc-action-bar { display: none !important; }
      .usage-ok, .usage-exp { display: none !important; }
    }
  </style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;font-family:sans-serif;color:#666;">
    <div style="width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#0a6e3f;border-radius:50%;animation:spin .8s linear infinite;"></div>
    <p style="margin:0;font-size:14px;">Loading…</p>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../../js/config.js"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/report-card-engine.js"></script>
<script src="layout.js"></script>
<script>
let ctx, allTerms = [];

(async () => {
  try {
    ctx = await initStudentLayout('results', 'My Report Card');
    if (!ctx) return;

    const { data: termsData } = await db.from('terms')
      .select('id,name,is_current,academic_years(label)')
      .eq('school_id', ctx.session.school_id)
      .order('created_at', { ascending: false });
    allTerms = termsData || [];

    const currentTerm = allTerms.find(t => t.is_current) || allTerms[0] || null;

    document.getElementById('pageBody').innerHTML = `
      <!-- ── STEP 1: Select Term ───────────────────────────────── -->
      <div id="stepTerm" class="gate-wrap">
        <div class="gate-card">
          <h2>📅 Select Term</h2>
          <p class="sub">Choose the academic term you want to view your report card for.</p>
          <div class="form-group">
            <label class="form-label">Academic Term</label>
            <select id="gateTermSel" class="form-control" style="font-size:15px;font-weight:600;">
              ${allTerms.map(t => {
                const sess = t.academic_years?.label ? ` — ${t.academic_years.label}` : '';
                return `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>${t.name}${sess}${t.is_current ? ' ★' : ''}</option>`;
              }).join('')}
            </select>
            <div class="form-hint" style="margin-top:6px;">
              ⚠️ Your scratch card PIN will be <strong>locked to this term</strong> once used.
            </div>
          </div>
          <button class="btn btn--primary btn--full" onclick="goToPin()">Continue →</button>
        </div>
        <div class="step-bar">
          <div class="step-dot active">1</div>
          <div class="step-line pending"></div>
          <div class="step-dot inactive">2</div>
          <div class="step-label">Select Term → Enter PIN</div>
        </div>
      </div>

      <!-- ── STEP 2: Enter PIN ─────────────────────────────────── -->
      <div id="stepPin" class="gate-wrap" style="display:none;">
        <div class="term-badge">
          <span style="font-size:18px;">📅</span>
          <div style="flex:1;">
            <div class="term-badge__label">Checking Report Card For</div>
            <div id="pinTermName" class="term-badge__name"></div>
          </div>
          <button class="term-badge__change" onclick="backToTerm()">Change</button>
        </div>
        <div class="gate-card" style="text-align:center;">
          <div style="font-size:48px;margin-bottom:10px;">🎓</div>
          <h2>Enter Scratch Card PIN</h2>
          <p class="sub">Enter your school-issued scratch card to generate your full report card.</p>
          <div class="form-group" style="text-align:left;">
            <label class="form-label">Scratch Card PIN</label>
            <input type="text" id="pinInput" class="form-control"
              style="font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:5px;text-align:center;"
              maxlength="15" placeholder="0000-0000-0000" autofocus oninput="fmtPin(this)">
            <div class="form-hint">Format: XXXX-XXXX-XXXX · Each card allows up to 5 checks · Locked to one term</div>
          </div>
          <div id="pinErr" class="form-error" style="display:none;margin-bottom:12px;"></div>
          <button class="btn btn--primary btn--full" id="viewBtn" onclick="viewReportCard()">
            🎓 View My Report Card
          </button>
        </div>
        <div class="step-bar">
          <div class="step-dot done">✓</div>
          <div class="step-line done"></div>
          <div class="step-dot active">2</div>
          <div class="step-label">Select Term → Enter PIN</div>
        </div>
      </div>

      <!-- ── REPORT CARD OUTPUT ────────────────────────────────── -->
      <div id="reportOutput" style="display:none;">
        <div class="rc-student-shell">
          <div class="rc-action-bar no-print">
            <button class="btn btn--primary" onclick="window.print()">🖨 Print Report Card</button>
            <button class="btn btn--secondary" onclick="resetToGate()">← Check Another Term</button>
          </div>
          <div id="usageBanner"></div>
          <div id="cardContent"></div>
        </div>
      </div>
    `;

    // Pre-select current term
    if (currentTerm) document.getElementById('gateTermSel').value = currentTerm.id;

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('stepPin').style.display !== 'none')
        viewReportCard();
    });

  } catch (err) {
    const el = document.getElementById('pageBody') || document.getElementById('app');
    if (el) el.innerHTML = `<div style="padding:2rem;color:red;font-family:sans-serif;">
      ⚠️ Failed to load. <a href="login.html">Log in again</a>.
      <br><small>${err?.message || ''}</small></div>`;
    console.error('[EduTrack] results.html error:', err);
  }
})();

// ── Step navigation ───────────────────────────────────────────
function goToPin() {
  const sel = document.getElementById('gateTermSel');
  if (!sel?.value) { alert('Please select a term first.'); return; }
  window._chosenTermId = sel.value;
  document.getElementById('pinTermName').textContent = sel.options[sel.selectedIndex].text;
  document.getElementById('stepTerm').style.display = 'none';
  document.getElementById('stepPin').style.display  = 'block';
  setTimeout(() => document.getElementById('pinInput')?.focus(), 100);
}

function backToTerm() {
  document.getElementById('stepPin').style.display  = 'none';
  document.getElementById('stepTerm').style.display = 'block';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinErr').style.display = 'none';
}

function resetToGate() {
  document.getElementById('reportOutput').style.display = 'none';
  document.getElementById('stepTerm').style.display     = 'block';
  document.getElementById('stepPin').style.display      = 'none';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinErr').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function fmtPin(inp) {
  let v = inp.value.replace(/\D/g, '');
  if (v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
  if (v.length > 9) v = v.slice(0,9) + '-' + v.slice(9);
  if (v.length > 14) v = v.slice(0,14) + '-' + v.slice(14);
  inp.value = v.slice(0, 15);
}

// ── Main: verify PIN → build report card ─────────────────────
async function viewReportCard() {
  const rawPin   = (document.getElementById('pinInput')?.value || '').replace(/\D/g, '');
  const termId   = window._chosenTermId;
  const errEl    = document.getElementById('pinErr');
  const btn      = document.getElementById('viewBtn');
  errEl.style.display = 'none';

  if (!rawPin || rawPin.length < 12) {
    errEl.textContent = 'PIN must be 12 digits (XXXX-XXXX-XXXX).';
    errEl.style.display = 'block'; return;
  }
  if (!termId) {
    errEl.textContent = 'Please go back and select a term first.';
    errEl.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = '⏳ Generating Report Card…';

  try {
    // 1. Validate scratch card
    const { data: useResult, error: useErr } = await db.rpc('use_scratch_card', {
      p_pin:        rawPin,
      p_school_id:  ctx.session.school_id,
      p_card_type:  'result',
      p_student_id: ctx.session.id,
      p_term_id:    termId
    });
    if (useErr) throw new Error(useErr.message);
    if (useResult?.error) throw new Error(useResult.error);

    const finalTermId = useResult.term_id || termId;
    const maxUses  = useResult.max_uses;
    const usesLeft = useResult.uses_left;
    const expired  = useResult.now_expired;

    // 2. Load all data needed by the engine
    const schoolId  = ctx.session.school_id;
    const studentId = ctx.session.id;

    const [schoolData, scaleData, examsData, termRow, enrData] = await Promise.all([
      db.from('schools')
        .select('name,logo_url,address,state,lga,phone,email,affiliation_no,school_type,vp_signature_url,exam_officer_signature_url,principal_signature_url,class_teacher_signature_url')
        .eq('id', schoolId).single().then(r => r.data),
      db.from('grading_scales')
        .select('*').eq('school_id', schoolId).order('min_score', { ascending: false })
        .then(r => r.data || []),
      db.from('exams')
        .select('*').eq('school_id', schoolId).eq('term_id', finalTermId).order('name')
        .then(r => r.data || []),
      db.from('terms')
        .select('*,academic_years(label)').eq('id', finalTermId).single()
        .then(r => r.data),
      db.from('enrollments')
        .select('class_id,classes(id,name,level,section,school_id)')
        .eq('student_id', studentId).eq('term_id', finalTermId).maybeSingle()
        .then(r => r.data),
    ]);

    // 3. Load student record (engine needs full fields)
    const { data: studentData } = await db.from('students')
      .select('id,full_name,admission_no,roll_no,mother_name,father_name,guardian_name,scholar_no,dob,date_of_birth,photo_url,passport_url,avatar_url,school_id')
      .eq('id', studentId).single();

    // 4. Hydrate shared engine state
    _school        = schoolData;
    _scale         = scaleData;
    _exams         = examsData;
    _term          = termRow;
    _classRow      = enrData?.classes || null;
    _classSubjects = null;
    _bulkResults   = null;
    _bulkAtt       = null;
    _bulkAffective = null;

    // 5. Build the card via the shared engine
    const cardHtml = await buildCard(studentData || { id: studentId, full_name: ctx.session.full_name, admission_no: ctx.session.admission_no || '' }, finalTermId);
    if (!cardHtml) throw new Error('No results found for this term. Please contact your school admin.');

    // 6. Usage banner
    const banner = expired
      ? `<div class="usage-exp no-print">⚠️ <strong>This scratch card has expired.</strong> All ${maxUses} permitted checks have been used. Please get a new card from your school admin.</div>`
      : `<div class="usage-ok no-print">✅ <strong>Check ${maxUses - usesLeft} of ${maxUses}.</strong> You have <strong>${usesLeft}</strong> check${usesLeft !== 1 ? 's' : ''} remaining on this card. Card is locked to <strong>${termRow?.name || 'this term'}</strong>.</div>`;

    document.getElementById('usageBanner').innerHTML = banner;
    document.getElementById('cardContent').innerHTML = cardHtml;

    // 7. Show report card, hide gate
    document.getElementById('stepPin').style.display    = 'none';
    document.getElementById('reportOutput').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '🎓 View My Report Card';
  }
}
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../../js/assistant.js"></script>
</body>
</html>
