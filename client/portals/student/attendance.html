<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0a6e3f">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EduTrack NG">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>EduTrack NG — My Attendance</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;font-family:sans-serif;color:#666;">
    <div style="width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#0a6e3f;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="margin:0;font-size:14px;">Loading attendance…</p>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../../js/config.js"></script>
<script src="../../js/supabase.js"></script>
<script src="layout.js"></script>
<script>
let allTerms = [], allAttendance = [], session;

function statusInfo(s) {
  const map = {
    'P': { label:'Present',  bg:'#dcfce7', color:'#16a34a' },
    'present': { label:'Present',  bg:'#dcfce7', color:'#16a34a' },
    'A': { label:'Absent',   bg:'#fee2e2', color:'#dc2626' },
    'absent': { label:'Absent',   bg:'#fee2e2', color:'#dc2626' },
    'L': { label:'Late',     bg:'#fef3c7', color:'#b45309' },
    'late': { label:'Late',     bg:'#fef3c7', color:'#b45309' },
    'E': { label:'Excused',  bg:'#dbeafe', color:'#1d4ed8' },
    'excused': { label:'Excused',  bg:'#dbeafe', color:'#1d4ed8' },
  };
  return map[s] || { label: s || '—', bg: 'var(--surface-3)', color: 'var(--ink-3)' };
}

function renderAttendance(termId) {
  const recs = termId
    ? allAttendance.filter(a => a.term_id === termId || !a.term_id)
    : allAttendance;

  const total   = recs.length;
  const present = recs.filter(a => a.status==='P'||a.status==='present').length;
  const late    = recs.filter(a => a.status==='L'||a.status==='late').length;
  const absent  = recs.filter(a => a.status==='A'||a.status==='absent').length;
  const excused = recs.filter(a => a.status==='E'||a.status==='excused').length;
  const attPct  = total > 0 ? Math.round((present + late) / total * 100) : null;
  const barColor = attPct === null ? '#94a3b8' : attPct >= 75 ? '#22c55e' : attPct >= 50 ? '#f59e0b' : '#ef4444';

  document.getElementById('attContent').innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
        ${[
          { label:'Present', val:present, bg:'#dcfce7', color:'#16a34a' },
          { label:'Absent',  val:absent,  bg:'#fee2e2', color:'#dc2626' },
          { label:'Late',    val:late,    bg:'#fef3c7', color:'#b45309' },
          { label:'Excused', val:excused, bg:'#dbeafe', color:'#1d4ed8' },
        ].map(s => `<div style="text-align:center;padding:12px 6px;background:${s.bg};border-radius:10px;">
          <div style="font-size:1.5rem;font-weight:900;color:${s.color};">${s.val}</div>
          <div style="font-size:.65rem;color:${s.color};font-weight:700;text-transform:uppercase;">${s.label}</div>
        </div>`).join('')}
      </div>
      ${attPct !== null ? `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:.8rem;font-weight:600;">Attendance Rate</span>
        <strong style="color:${barColor};">${attPct}%</strong>
      </div>
      <div style="height:10px;background:var(--surface-3);border-radius:100px;overflow:hidden;">
        <div style="height:100%;width:${attPct}%;background:${barColor};border-radius:100px;"></div>
      </div>
      ${attPct < 75 ? '<div style="font-size:.72rem;color:var(--danger,#dc2626);margin-top:6px;font-weight:600;">⚠️ Attendance below 75% minimum requirement</div>' : ''}
      ` : ''}
    </div>

    ${total > 0 ? `
    <div class="card" style="padding:0;">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:.875rem;">Daily Records (${total} days)</div>
      <div style="max-height:400px;overflow-y:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.845rem;">
          <thead style="position:sticky;top:0;z-index:1;">
            <tr>${['Date','Class','Status'].map(h=>`<th style="padding:8px 14px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--border);">${h}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${recs.map(a => {
              const info = statusInfo(a.status);
              const d = a.date ? new Date(a.date).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}) : '—';
              return `<tr style="border-bottom:1px solid var(--border);">
                <td style="padding:10px 14px;font-weight:600;">${d}</td>
                <td style="padding:10px 14px;font-size:.78rem;color:var(--ink-3);">${a.classes?.name || '—'}</td>
                <td style="padding:10px 14px;">
                  <span style="background:${info.bg};color:${info.color};padding:2px 8px;border-radius:100px;font-size:.72rem;font-weight:700;">${info.label}</span>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>` : '<div class="card" style="padding:24px;text-align:center;color:var(--ink-3);">No attendance records for this term.</div>'}
  `;
}

(async () => {
  try {
    const ctx = await initStudentLayout('attendance', 'My Attendance');
    if (!ctx) return;
    session = ctx.session;

    const [termsData, attendData] = await Promise.all([
      studentCachedQuery(session, 'attendance_terms', async function() {
        const res = await db.from('terms').select('id,name,is_current').eq('school_id', session.school_id).order('created_at', { ascending: false });
        if (res.error) throw res.error;
        return res.data || [];
      }, []),
      studentCachedQuery(session, 'attendance_records', async function() {
        const res = await db.from('attendance').select('date,status,term_id,class_id,classes(name)').eq('student_id', session.id).eq('school_id', session.school_id).order('date', { ascending: false });
        if (res.error) throw res.error;
        return res.data || [];
      }, []),
    ]);

    allTerms = termsData || [];
    allAttendance = attendData || [];
    const currentTerm = ctx.term || allTerms.find(t => t.is_current) || allTerms[0];
    const defaultTermId = currentTerm?.id || '';

    document.getElementById('pageBody').innerHTML = `
      <div class="page-header"><h1>My Attendance</h1></div>
      <div style="margin-bottom:16px;">
        <select class="form-control" id="termSel" style="max-width:240px;" onchange="renderAttendance(this.value)">
          <option value="">All Terms</option>
          ${allTerms.map(t => `<option value="${t.id}" ${t.id===defaultTermId?'selected':''}>${t.name}${t.is_current?' (Current)':''}</option>`).join('')}
        </select>
      </div>
      <div id="attContent"></div>`;

    renderAttendance(defaultTermId);
  } catch (err) {
    console.error(err);
    document.getElementById('pageBody').innerHTML =
      '<div style="padding:2rem;color:red;"><strong>Error:</strong> ' + (err?.message || err) + '</div>';
  }
})();
</script>
<script src="../../js/assistant.js"></script>
<script src="/js/pwa-v2.1.js"></script>
</body>
</html>
