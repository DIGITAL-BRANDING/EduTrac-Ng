<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduTrack NG">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>EduTrack NG — Student Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;font-family:sans-serif;color:#666;">
    <div style="width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#0a6e3f;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="margin:0;font-size:14px;">Loading dashboard…</p>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../../js/config.js"></script>
<script src="../../js/supabase.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  try {
    const ctx = await initStudentLayout('dashboard', 'Dashboard');
    if (!ctx) return;

    const { session, student, school, dashSettings, term, currentEnrollment, classId } = ctx;

    // ── Class name from enrollment ──────────────────────────────
    const className = currentEnrollment?.classes?.name
                   || student?.class_name
                   || '—';

    // ── Subjects count from already-loaded subject maps ─────────
    const subjectMaps = window._stuSubjectMaps || {};
    const comboId = currentEnrollment?.classes?.combination_id || student?.class_combo_id;
    let subjectsCount = 0;
    if (comboId && subjectMaps.comboSubjectMap?.[comboId]) {
      subjectsCount = subjectMaps.comboSubjectMap[comboId].length;
    } else if (classId && subjectMaps.classSubjectMap?.[classId]) {
      subjectsCount = subjectMaps.classSubjectMap[classId].length;
    }

    // ── Fetch attendance + fees in parallel ────────────────────
    const [attRes, feeTypesRes, paymentsRes] = await Promise.all([
      db.from('attendance')
        .select('status')
        .eq('student_id', session.id)
        .eq('school_id', session.school_id),
      db.from('fee_types')
        .select('amount,term_id')
        .eq('school_id', session.school_id),
      db.from('payments')
        .select('amount_paid,term_id')
        .eq('student_id', session.id)
        .eq('school_id', session.school_id),
    ]);

    // Attendance %
    const attRecs = attRes.data || [];
    const totalDays = attRecs.length;
    const presentDays = attRecs.filter(a => a.status === 'P' || a.status === 'present').length;
    const lateDays    = attRecs.filter(a => a.status === 'L' || a.status === 'late').length;
    const attendancePct = totalDays > 0 ? Math.round((presentDays + lateDays) / totalDays * 100) : null;

    // Fee balance (current term if available, else all-term)
    const termId = term?.id;
    const relevantFees = (feeTypesRes.data || []).filter(f => !termId || !f.term_id || f.term_id === termId);
    const relevantPays = (paymentsRes.data || []).filter(p => !termId || !p.term_id || p.term_id === termId);
    const totalExpected = relevantFees.reduce((s, f) => s + Number(f.amount || 0), 0);
    const totalPaid     = relevantPays.reduce((s, p) => s + Number(p.amount_paid || 0), 0);
    const feeBalance    = Math.max(0, totalExpected - totalPaid);
    const feePct        = totalExpected > 0 ? Math.round(totalPaid / totalExpected * 100) : null;

    // ── Quick-link visibility from dashSettings ────────────────
    const seeFees       = dashSettings?.student_see_fees !== false;
    const seeAttendance = dashSettings?.student_see_attendance !== false;
    const seeResults    = dashSettings?.student_see_results !== false;

    document.getElementById('pageBody').innerHTML = `
      <div style="margin-bottom:20px;">
        <h1 style="font-size:1.3rem;font-weight:800;margin:0 0 2px;">Welcome, ${(session.full_name||'Student').split(' ')[0]}! 👋</h1>
        <p style="color:var(--ink-3);font-size:.875rem;margin:0;">${term?.name || 'Current Term'} · ${school?.name || ''}</p>
      </div>

      <!-- Profile card -->
      <div class="card" style="margin-bottom:16px;padding:18px;display:flex;align-items:center;gap:16px;">
        <div style="width:54px;height:54px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;flex-shrink:0;">
          ${(session.full_name || 'S').charAt(0).toUpperCase()}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${session.full_name}</div>
          <div style="font-size:.8rem;color:var(--ink-3);margin-top:2px;">${className}</div>
          <div style="font-size:.78rem;color:var(--ink-3);">Adm. No: <strong>${session.admission_no || '—'}</strong></div>
        </div>
        <a href="profile.html" style="font-size:.75rem;color:var(--primary);font-weight:600;text-decoration:none;white-space:nowrap;">Profile →</a>
      </div>

      <!-- Stats grid -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
        <div style="background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:14px 10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.6rem;font-weight:900;line-height:1;">${subjectsCount || '—'}</div>
          <div style="font-size:.68rem;opacity:.9;margin-top:4px;font-weight:600;">SUBJECTS</div>
        </div>
        <div style="background:linear-gradient(135deg,${attendancePct === null ? '#94a3b8,#64748b' : attendancePct >= 75 ? '#22c55e,#16a34a' : attendancePct >= 50 ? '#f59e0b,#d97706' : '#ef4444,#dc2626'});color:white;padding:14px 10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.6rem;font-weight:900;line-height:1;">${attendancePct !== null ? attendancePct + '%' : '—'}</div>
          <div style="font-size:.68rem;opacity:.9;margin-top:4px;font-weight:600;">ATTENDANCE</div>
        </div>
        <div style="background:linear-gradient(135deg,${feeBalance === 0 ? '#22c55e,#16a34a' : '#ef4444,#dc2626'});color:white;padding:14px 10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.6rem;font-weight:900;line-height:1;">₦${feeBalance >= 1000 ? (feeBalance/1000).toFixed(0)+'K' : feeBalance}</div>
          <div style="font-size:.68rem;opacity:.9;margin-top:4px;font-weight:600;">FEE BALANCE</div>
        </div>
      </div>

      ${(totalExpected > 0) ? `
      <!-- Fee progress bar -->
      <div class="card" style="margin-bottom:16px;padding:14px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:.8rem;font-weight:700;color:var(--ink-2);">Fee Payment</span>
          <span style="font-size:.8rem;font-weight:800;color:${feeBalance === 0 ? 'var(--success)' : 'var(--ink)'};">${feePct !== null ? feePct + '%' : '—'} paid</span>
        </div>
        <div style="height:8px;background:var(--surface-3);border-radius:100px;overflow:hidden;">
          <div style="height:100%;width:${feePct ?? 0}%;background:${feeBalance === 0 ? '#22c55e' : feePct >= 50 ? '#f59e0b' : '#ef4444'};border-radius:100px;transition:width .4s;"></div>
        </div>
        ${feeBalance === 0 ? '<div style="font-size:.72rem;color:var(--success);font-weight:700;margin-top:6px;">✓ All fees cleared!</div>' : `<div style="font-size:.72rem;color:var(--ink-3);margin-top:6px;">Balance: ₦${feeBalance.toLocaleString()}</div>`}
      </div>` : ''}

      <!-- Quick links -->
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
        ${seeResults ? `<a href="results.html" class="card" style="text-decoration:none;color:inherit;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <span style="font-size:2rem;">📊</span>
          <span style="font-weight:700;font-size:.875rem;">My Results</span>
        </a>` : ''}
        ${seeAttendance ? `<a href="attendance.html" class="card" style="text-decoration:none;color:inherit;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <span style="font-size:2rem;">📋</span>
          <span style="font-weight:700;font-size:.875rem;">Attendance</span>
        </a>` : ''}
        ${seeFees ? `<a href="fees.html" class="card" style="text-decoration:none;color:inherit;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <span style="font-size:2rem;">💰</span>
          <span style="font-weight:700;font-size:.875rem;">My Fees</span>
        </a>` : ''}
        <a href="notifications.html" class="card" style="text-decoration:none;color:inherit;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <span style="font-size:2rem;">🔔</span>
          <span style="font-weight:700;font-size:.875rem;">Notifications</span>
        </a>
        <a href="profile.html" class="card" style="text-decoration:none;color:inherit;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <span style="font-size:2rem;">👤</span>
          <span style="font-weight:700;font-size:.875rem;">My Profile</span>
        </a>
      </div>
    `;
  } catch (ex) {
    console.error('Dashboard error:', ex);
    document.getElementById('pageBody').innerHTML =
      '<div style="padding:2rem;text-align:center;"><p style="color:#ef4444;font-weight:600;">Failed to load dashboard.</p><p style="font-size:.8rem;color:#999;">' + (ex?.message || ex) + '</p><a href="login.html" style="color:var(--primary);font-weight:600;">Log in again</a></div>';
  }
})();
</script>
<script src="../../js/assistant.js"></script>
</body>
</html>
