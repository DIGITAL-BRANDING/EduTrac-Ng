<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <title>Generate Documents · EduTrack NG</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px;}
    .doc-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .18s,border-color .18s;}
    .doc-card.is-available:hover{box-shadow:var(--shadow);border-color:var(--primary);cursor:pointer;}
    .doc-card.is-disabled{opacity:.55;background:var(--surface-3);}
    .doc-ico{width:42px;height:42px;border-radius:11px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;}
    .doc-card.is-disabled .doc-ico{background:var(--surface-2);color:var(--ink-3);}
    .doc-title{font-size:1.02rem;font-weight:800;color:var(--ink);}
    .doc-desc{font-size:.82rem;color:var(--ink-3);line-height:1.55;flex:1;}
    .doc-reason{font-size:.76rem;color:var(--warning);background:var(--accent-light);border-radius:8px;padding:8px 10px;line-height:1.5;}
    .doc-btn{margin-top:auto;}
    .picker-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end;}
    .picker-row .form-group{flex:1;min-width:180px;margin-bottom:0;}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../../js/config.js"></script>
<script src="../../api/database.js"></script>
<script src="../../api/auth.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script>
let currentUser, schoolType, vocab, docs;
let classes = [], terms = [], selectedClassId = '', selectedStudentId = '';

(async () => {
  currentUser = await initPage(['exam_officer', 'vp_academic', 'admin'], 'Generate Documents', 'documents');
  if (!currentUser) return;

  schoolType = getSchoolCtxType(currentUser);
  vocab = getInstitutionLabelsFor(schoolType);
  docs = getAvailableDocumentsFor(schoolType);

  document.getElementById('pageBody').innerHTML = `
    <div style="margin-bottom:14px;">
      <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Generate Documents</h1>
      <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Pick a ${vocab.learner.toLowerCase()} below, then choose which document to generate for them.</p>
    </div>
    <div class="card">
      <div class="picker-row">
        <div class="form-group">
          <label class="form-label">${vocab.class}</label>
          <select id="docClassSel" class="form-control" onchange="onClassChange()">
            <option value="">— Select ${vocab.class.toLowerCase()} —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">${vocab.learner}</label>
          <select id="docStudentSel" class="form-control" onchange="selectedStudentId=this.value">
            <option value="">— Select ${vocab.class.toLowerCase()} first —</option>
          </select>
        </div>
      </div>
      <p style="font-size:.78rem;color:var(--ink-3);margin:0;">Tip: you can also open any document generator directly from a ${vocab.learner.toLowerCase()}'s profile page.</p>
    </div>
    <div class="doc-grid" id="docGrid"></div>
  `;

  renderDocGrid();
  await loadClasses();
})();

function renderDocGrid() {
  const grid = document.getElementById('docGrid');
  grid.innerHTML = docs.map(d => `
    <div class="doc-card ${d.available ? 'is-available' : 'is-disabled'}" ${d.available ? `onclick="goToDoc('${d.key}')"` : ''}>
      <div class="doc-ico">${docIcon(d.key)}</div>
      <div class="doc-title">${d.label}</div>
      <div class="doc-desc">${docDescription(d.key)}</div>
      ${d.available
        ? `<button class="btn btn--primary btn--sm doc-btn" onclick="event.stopPropagation();goToDoc('${d.key}')">Generate →</button>`
        : `<div class="doc-reason">${d.reason}</div>`}
    </div>`).join('');
}

function docIcon(key) {
  const icons = {
    report_card: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
    statement: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
    transcript: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>`,
    certificate: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/></svg>`,
    testimonial: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`,
  };
  return icons[key] || '';
}
function docDescription(key) {
  const desc = {
    report_card: `Per-${vocab.period.toLowerCase()} academic results with grades and remarks.`,
    statement: `Current ${vocab.period.toLowerCase()}'s result with GPA — issued before the full transcript is ready.`,
    transcript: `Complete academic record across every ${vocab.period.toLowerCase()}, with running CGPA and classification.`,
    certificate: `Final credential confirming successful completion.`,
    testimonial: `Character and conduct reference for a ${vocab.learner.toLowerCase()} leaving the institution.`,
  };
  return desc[key] || '';
}

async function loadClasses() {
  const { data } = await db.from('classes').select('id,name,level,section').eq('school_id', currentUser.school_id).order('name');
  classes = data || [];
  const sel = document.getElementById('docClassSel');
  sel.innerHTML = `<option value="">— Select ${vocab.class.toLowerCase()} —</option>` +
    classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

async function onClassChange() {
  selectedClassId = document.getElementById('docClassSel').value;
  selectedStudentId = '';
  const sel = document.getElementById('docStudentSel');
  if (!selectedClassId) { sel.innerHTML = `<option value="">— Select ${vocab.class.toLowerCase()} first —</option>`; return; }
  sel.innerHTML = `<option>Loading…</option>`;
  const { data: enr } = await db.from('enrollments').select('student_id').eq('class_id', selectedClassId);
  if (!enr?.length) { sel.innerHTML = `<option value="">No ${vocab.learner.toLowerCase()}s enrolled</option>`; return; }
  const ids = enr.map(e => e.student_id);
  const { data: studs } = await db.from('students').select('id,full_name,admission_no').in('id', ids).order('full_name');
  sel.innerHTML = `<option value="">— Select ${vocab.learner.toLowerCase()} —</option>` +
    (studs || []).map(s => `<option value="${s.id}">${s.full_name}${s.admission_no ? ' (' + s.admission_no + ')' : ''}</option>`).join('');
}

function goToDoc(key) {
  if (!selectedStudentId) { toast(`Please select a ${vocab.class.toLowerCase()} and ${vocab.learner.toLowerCase()} first.`, 'error'); return; }
  const doc = docs.find(d => d.key === key);
  if (!doc) return;
  const base = '../../' + doc.href;
  const sep = base.includes('?') ? '&' : '?';
  window.location.href = `${base}${sep}student_id=${selectedStudentId}`;
}
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../../js/assistant.js"></script>
</body>
</html>
