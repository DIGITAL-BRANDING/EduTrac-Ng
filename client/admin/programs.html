<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Academic Structure · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .tab-bar{display:flex;gap:4px;padding:4px;background:var(--surface-3);border-radius:10px;width:fit-content;margin-bottom:20px;overflow-x:auto;max-width:100%;}
    .tab-btn{padding:8px 18px;border-radius:7px;border:none;background:transparent;font:600 .875rem var(--font);color:var(--ink-3);cursor:pointer;transition:var(--transition);white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .tab-btn.active{background:var(--surface);color:var(--primary);font-weight:700;box-shadow:var(--shadow-sm);}
    .tab-btn svg{flex-shrink:0;}

    .intro-banner{background:var(--info-light,#eff6ff);border:1.5px solid var(--info,#3b82f6);border-radius:var(--radius);padding:13px 16px;margin-bottom:20px;font-size:13px;color:var(--info-dark,#1e3a5f);}
    .intro-banner strong{font-weight:700;}

    .prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
    .prog-summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .18s;}
    .prog-summary-card:hover{box-shadow:var(--shadow);}
    .prog-name{font-size:1.05rem;font-weight:800;color:var(--ink);}
    .prog-desc{font-size:.82rem;color:var(--ink-3);line-height:1.5;flex:1;}
    .prog-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:700;}
    .prog-badge.levels{background:var(--primary-light);color:var(--primary);}
    .prog-badge.combos{background:var(--accent-light);color:var(--warning);}
    .prog-badge.classes{background:var(--info-light,#eff6ff);color:var(--info,#3b82f6);}
    .prog-actions{display:flex;gap:6px;margin-top:4px;}

    .prog-card{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .prog-card__head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-3);cursor:pointer;gap:8px;}
    .prog-card__head:hover{background:var(--primary-light);}
    .prog-card__body{padding:12px 14px;border-top:1px solid var(--border);display:none;}
    .prog-card__body.open{display:block;}
    .level-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;margin-bottom:4px;background:var(--surface-3);}
    .level-row:hover{background:var(--primary-light);}
    .class-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600;background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);margin:2px;}

    .combo-card{border:2px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:var(--transition);margin-bottom:10px;}
    .combo-card:hover{border-color:var(--primary);}
    .combo-card.selected{background:var(--primary-light);}
    .combo-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
    .subject-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:600;margin:3px;border:1.5px solid var(--border);cursor:pointer;transition:var(--transition);user-select:none;}
    .subject-chip.core{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
    .subject-chip.elective{background:var(--info-light,#eff6ff);border-color:var(--info,#3b82f6);color:var(--info,#3b82f6);}
    .subject-chip.unassigned{background:var(--surface-3);color:var(--ink-3);border-color:var(--border);}

    .lvl-table{width:100%;border-collapse:collapse;font-size:.875rem;}
    .lvl-table th{background:var(--surface-3);padding:10px 14px;text-align:left;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-bottom:1px solid var(--border);}
    .lvl-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .lvl-table tr:last-child td{border-bottom:none;}
    .lvl-table tr:hover td{background:var(--surface-2);}
    .empty-state{text-align:center;padding:48px;color:var(--ink-3);grid-column:1/-1;}
    .empty-state svg{opacity:.3;display:block;margin:0 auto 12px;}

    .edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:center;justify-content:center;}
    .edit-overlay.active{display:flex;}
    .edit-box{background:var(--surface,#fff);border-radius:14px;padding:24px;width:min(480px,94vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .edit-box h3{margin:0 0 16px;font-size:16px;}

    .chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--ink-2);}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Edit overlay (used for Classes/Subjects/Combinations quick-edit) -->
<div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="edit-box" id="editBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser;
let activeTab = 'programs'; // programs | levels | classes | subjects | combinations
let programs=[], levels=[], classes=[], subjects=[], combinations=[], teachers=[];
let activeComboId=null;

// ── School-type helpers ─────────────────────────────────────────
function getSchoolType(){ return currentUser?.schools?.school_type || window._schoolType || 'o_level'; }
function getPeriodLabel(){ const t=getSchoolType(); return (t==='tertiary'||t==='vocational')?'Semester':'Term'; }

const LEVEL_PRESETS = {
  o_level:    ['Pre-Primary','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3'],
  vocational: ['Basic Tech 1','Basic Tech 2','Vocational Level 1','Vocational Level 2','Vocational Level 3'],
  islamic:    ['Nursery','Primary 1','Primary 2','Primary 3','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3','Tahfiz Year 1','Tahfiz Year 2','Tahfiz Year 3'],
  tertiary:   ['Pre-ND','ND I','ND II','HND I','HND II','Year 1','Year 2','Year 3','Year 4','Year 5','Postgraduate'],
};
function getLevelsForType(){ return LEVEL_PRESETS[getSchoolType()] || LEVEL_PRESETS.o_level; }

function openEdit(html){ document.getElementById('editBox').innerHTML=html; document.getElementById('editOverlay').classList.add('active'); }
function closeEdit(){ document.getElementById('editOverlay').classList.remove('active'); }
function trashIcon(){ return `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`; }
function editIcon(){ return `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`; }
function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function friendlyError(error, context='') {
  const msg = error?.message || '';
  if (/duplicate key|unique constraint/i.test(msg)) {
    if (context==='program') return 'A programme with this name already exists for your school.';
    if (context==='level')   return 'A level with this name already exists under that programme.';
    if (context==='class')   return 'A class with this name already exists for your school.';
    if (context==='subject') return 'A subject with this name already exists for your school.';
    if (context==='combo')   return 'A combination with this name already exists for your school.';
    return 'A record with this name already exists. Please use a different name.';
  }
  if (/foreign key|violates foreign key/i.test(msg)) return 'This record is linked to other data and cannot be removed. Remove the linked records first.';
  if (/not.null|null value/i.test(msg))              return 'A required field is missing. Please fill in all required fields.';
  if (/permission denied|rls|policy/i.test(msg))    return 'Permission denied. You may not have access to perform this action.';
  if (/schema cache|column.*not found|does not exist/i.test(msg)) return 'A database column is missing. Please run the latest SQL migration in Supabase and reload the schema cache.';
  return msg || 'An unexpected error occurred. Please try again.';
}

(async () => {
  currentUser = await initAdminLayout('programs', 'Academic Structure');
  if (!currentUser) return;

  // Support deep links like programs.html?tab=classes (e.g. from the old classes.html redirect)
  const qsTab = new URLSearchParams(window.location.search).get('tab');
  if (qsTab && ['programs','levels','classes','subjects','combinations'].includes(qsTab)) {
    activeTab = qsTab;
  }

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
      <div>
        <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Academic Structure</h1>
        <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Everything to do with how your school is organised — programmes, levels, classes, subjects and combinations — all in one place.</p>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn" id="tab-programs" onclick="switchTab('programs')">${tabIcon('programs')} Programmes</button>
      <button class="tab-btn" id="tab-levels" onclick="switchTab('levels')">${tabIcon('levels')} Levels</button>
      <button class="tab-btn" id="tab-classes" onclick="switchTab('classes')">${tabIcon('classes')} Classes</button>
      <button class="tab-btn" id="tab-subjects" onclick="switchTab('subjects')">${tabIcon('subjects')} Subjects</button>
      <button class="tab-btn" id="tab-combinations" onclick="switchTab('combinations')">${tabIcon('combinations')} Combinations</button>
    </div>
    <div id="tabContent"><div style="text-align:center;padding:48px;color:var(--ink-3);">Loading…</div></div>
  `;
  document.getElementById('tab-'+activeTab).classList.add('active');

  await loadAll();
  renderTab();
})();

function tabIcon(id){
  const icons={
    programs:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
    levels:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    classes:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>`,
    subjects:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
    combinations:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>`,
  };
  return icons[id]||'';
}

async function loadAll() {
  const sid = currentUser.school_id;
  const [pRes, lRes, cRes, sRes, comboRes, tRes] = await Promise.all([
    db.from('programs').select('id,name,description,duration').eq('school_id', sid).order('name'),
    db.from('levels').select('id,name,program_id,sort_order').eq('school_id', sid).order('sort_order,name'),
    db.from('classes').select('id,name,level,level_id,program_id,combination_id,capacity,teacher_id,users(full_name)').eq('school_id', sid).order('name'),
    db.from('subjects').select('id,name,code').eq('school_id', sid).order('name'),
    db.from('subject_combinations').select('*').eq('school_id', sid).order('name'),
    db.from('users').select('id,full_name').eq('school_id', sid).eq('role','teacher').eq('is_active',true).order('full_name'),
  ]);
  if (pRes.error) console.error('programs:', pRes.error.message);
  if (lRes.error) console.error('levels:', lRes.error.message);
  if (cRes.error) console.error('classes:', cRes.error.message);
  if (sRes.error) console.error('subjects:', sRes.error.message);
  if (comboRes.error) console.error('combinations:', comboRes.error.message);
  programs     = pRes.data || [];
  levels       = lRes.data || [];
  classes      = cRes.data || [];
  subjects     = sRes.data || [];
  combinations = comboRes.data || [];
  teachers     = tRes.data || [];
}

function switchTab(tab) {
  activeTab = tab;
  ['programs','levels','classes','subjects','combinations'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.classList.toggle('active', t === tab);
  });
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tabContent');
  if (activeTab === 'programs')      renderPrograms(el);
  else if (activeTab === 'levels')   renderLevels(el);
  else if (activeTab === 'classes')  renderClasses(el);
  else if (activeTab === 'subjects') renderSubjects(el);
  else                                renderCombinations(el);
}

// ═══════════════════════════════════════════════════════════════
//  TAB 1 — PROGRAMMES (with nested level + class preview)
// ═══════════════════════════════════════════════════════════════
function renderPrograms(el) {
  el.innerHTML = `
    <div class="intro-banner">
      <strong>How this works:</strong> Create <strong>Programmes</strong> (e.g. "Science Track", "ND Electrical Engineering"), then add <strong>Levels</strong> to each programme (e.g. Year 1, ND I). Go to <strong>Classes</strong> to assign each class to a level, <strong>Subjects</strong> to manage your subject list, and <strong>Combinations</strong> to group subjects into Science/Art/Commercial tracks.
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn--primary btn--sm" onclick="openAddProgram()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Programme
      </button>
    </div>
    <div id="progListWrap"></div>
  `;
  renderProgramsList();
}

function renderProgramsList() {
  const wrap = document.getElementById('progListWrap');
  if (!wrap) return;
  if (!programs.length) {
    wrap.innerHTML = `<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><p style="font-weight:700;font-size:1rem;">No programmes yet</p><p style="font-size:.85rem;margin:4px 0 16px;">Programmes group students by study path (e.g. Science, Arts, ND Accounting).</p><button class="btn btn--primary btn--sm" onclick="openAddProgram()">Add First Programme</button></div>`;
    return;
  }
  wrap.innerHTML = programs.map(p => {
    const pLevels  = levels.filter(l => l.program_id === p.id);
    const pClasses = classes.filter(c => c.program_id === p.id || pLevels.some(l => l.id === c.level_id));
    const pCombos  = combinations.filter(c => c.program_id === p.id);
    return `
      <div class="prog-card">
        <div class="prog-card__head" onclick="toggleProgCard('pc-${p.id}')">
          <div>
            <div style="font-weight:700;font-size:14px;">${esc(p.name)}</div>
            <div style="font-size:11px;color:var(--ink-3);">${esc(p.description||'')} ${p.description?'&nbsp;·&nbsp;':''}${pLevels.length} level${pLevels.length!==1?'s':''} · ${pClasses.length} class${pClasses.length!==1?'es':''} · ${pCombos.length} combo${pCombos.length!==1?'s':''}</div>
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0;">
            <button class="btn btn--ghost btn--sm" onclick="event.stopPropagation();editProgram('${p.id}')" title="Edit">${editIcon()}</button>
            <button class="btn btn--ghost btn--sm" onclick="event.stopPropagation();deleteProgram('${p.id}','${esc(p.name).replace(/'/g,"\\'")}')" title="Delete">${trashIcon()}</button>
          </div>
        </div>
        <div class="prog-card__body" id="pc-${p.id}">
          ${pLevels.length===0
            ? `<p style="font-size:12px;color:var(--ink-3);">No levels yet for this programme. <a href="#" onclick="event.preventDefault();switchTab('levels');openAddLevel('${p.id}')" style="color:var(--primary);font-weight:600;">Add one →</a></p>`
            : pLevels.map(l=>{
                const lClasses = classes.filter(c => c.level_id === l.id);
                return `<div class="level-row">
                  <div>
                    <div style="font-weight:600;font-size:13px;">${esc(l.name)}</div>
                    <div style="margin-top:3px;">${lClasses.map(c=>`<span class="class-tag">${esc(c.name)}</span>`).join('')||'<span style="font-size:11px;color:var(--ink-3);">No classes assigned</span>'}</div>
                  </div>
                </div>`;
              }).join('')}
          <button class="btn btn--secondary btn--sm" style="margin-top:8px;" onclick="switchTab('levels');openAddLevel('${p.id}')">+ Add Level to ${esc(p.name)}</button>
        </div>
      </div>`;
  }).join('');
}

function toggleProgCard(id){
  const elx = document.getElementById(id);
  if (elx) elx.classList.toggle('open');
}

function openAddProgram(){
  openEdit(`
    <h3>New Programme</h3>
    <div class="form-group"><label class="form-label">Programme Name <span class="required">*</span></label>
      <input id="ep-name" class="form-control" placeholder="e.g. Science Track, ND Electrical Engineering"></div>
    <div class="form-group"><label class="form-label">Description</label>
      <input id="ep-desc" class="form-control" placeholder="Optional short description"></div>
    <div class="form-group"><label class="form-label">Duration</label>
      <input id="ep-duration" class="form-control" placeholder="e.g. 3 Years, 2 Semesters"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn--primary" onclick="saveProgram(null)">Save Programme</button>
      <button class="btn btn--ghost" onclick="closeEdit()">Cancel</button>
    </div>`);
}
function editProgram(id){
  const p = programs.find(x => x.id === id); if (!p) return;
  openEdit(`
    <h3>Edit Programme</h3>
    <div class="form-group"><label class="form-label">Programme Name <span class="required">*</span></label>
      <input id="ep-name" class="form-control" value="${esc(p.name)}"></div>
    <div class="form-group"><label class="form-label">Description</label>
      <input id="ep-desc" class="form-control" value="${esc(p.description||'')}"></div>
    <div class="form-group"><label class="form-label">Duration</label>
      <input id="ep-duration" class="form-control" value="${esc(p.duration||'')}"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn--primary" onclick="saveProgram('${id}')">Update</button>
      <button class="btn btn--ghost" onclick="closeEdit()">Cancel</button>
    </div>`);
}
async function saveProgram(id){
  const name = document.getElementById('ep-name').value.trim();
  if (!name) { toast('Enter a programme name.','error'); return; }
  const payload = {
    name,
    description: document.getElementById('ep-desc').value.trim() || null,
    duration: document.getElementById('ep-duration').value.trim() || null,
  };
  const { error } = id
    ? await db.from('programs').update(payload).eq('id', id)
    : await db.from('programs').insert({ school_id: currentUser.school_id, ...payload });
  if (error) { toast(friendlyError(error,'program'),'error'); return; }
  closeEdit(); await loadAll(); renderTab(); toast(id?'Programme updated!':'Programme added!','success');
}
async function deleteProgram(id, name){
  if (!confirm(`Delete programme "${name}"? Levels inside it will become standalone.`)) return;
  const { error } = await db.from('programs').delete().eq('id', id);
  if (error) { toast('Error: '+error.message,'error'); return; }
  await loadAll(); renderTab(); toast('Programme deleted.','success');
}

// ═══════════════════════════════════════════════════════════════
//  TAB 2 — LEVELS
// ═══════════════════════════════════════════════════════════════
function renderLevels(el) {
  const presetLevels = getLevelsForType();
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="card">
        <div class="card__header">
          <span class="card__title">All Levels (${levels.length})</span>
          <button class="btn btn--primary btn--sm" onclick="openAddLevel(null)">+ New Level</button>
        </div>
        <p style="font-size:12px;color:var(--ink-3);margin-bottom:10px;">Levels can belong to a programme or stand alone. Classes are assigned to levels.</p>
        <div id="levelListWrap" style="max-height:420px;overflow-y:auto;"></div>
      </div>
      <div class="card" style="background:var(--surface-3);align-self:flex-start;">
        <div class="card__header"><span class="card__title">Quick Load Levels</span></div>
        <p style="font-size:12px;color:var(--ink-3);margin-bottom:10px;">Load the standard levels for your school type (<strong>${esc(getSchoolType().replace('_',' '))}</strong>) in one click.</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">

async function saveLevel(id){
  const name = document.getElementById('el-name').value.trim();
  if (!name) { toast('Enter a level name.','error'); return; }
  const payload = {
    name,
    program_id: document.getElementById('el-prog').value || null,
    sort_order: parseInt(document.getElementById('el-sort').value) || 1,
  };
  const { error } = id
    ? await db.from('levels').update(payload).eq('id', id)
    : await db.from('levels').insert({ school_id: currentUser.school_id, ...payload });
  if (error) { toast(friendlyError(error,'level'),'error'); return; }
  closeEdit(); await loadAll(); renderTab(); toast(id?'Level updated!':'Level added!','success');
}
async function deleteLevel(id, name){
  if (!confirm(`Delete level "${name}"? Classes assigned to it will lose their level.`)) return;
  const { error } = await db.from('levels').delete().eq('id', id);
  if (error) { toast('Error: '+error.message,'error'); return; }
  await loadAll(); renderTab(); toast('Level deleted.','success');
}
async function loadPresetLevels(){
  const names = getLevelsForType();
  if (!confirm(`Load ${names.length} preset levels for your school type? Duplicates will be skipped.`)) return;
  const rows = names.map((name,i)=>({ school_id: currentUser.school_id, name, sort_order: i+1 }));
  const { error } = await db.from('levels').upsert(rows, { onConflict: 'school_id,name' });
  if (error) { toast('Error: '+error.message,'error'); return; }
  await loadAll(); renderTab(); toast(`${names.length} levels loaded!`,'success');
}

  const name = document.getElementById('newClassName').value.trim();
  if (!name) { toast('Enter a class name.','error'); return; }
  const levelSel = document.getElementById('newClassLevel');
  let levelId = levelSel.value || null, levelName = null;
  if (levelId === '__custom__') { levelId = null; levelName = document.getElementById('newClassLevelCustom').value.trim() || null; }
  else if (levelId) { levelName = levels.find(l => l.id === levelId)?.name || null; }

    school_id: currentUser.school_id, name,
    level_id: levelId, level: levelName,
    combination_id: document.getElementById('newClassCombo').value || null,
    teacher_id: document.getElementById('newClassTeacher').value || null,
    capacity: parseInt(document.getElementById('newClassCapacity').value) || null,

  const wrap = document.getElementById('comboBodyWrap');
  if (!wrap) return;
  if (!combinations.length) {
    wrap.innerHTML = `<div class="card" style="text-align:center;padding:32px;color:var(--ink-3);"><p>No combinations yet.<br>Click "Load Nigerian Standard" to get started.</p></div>`;
    return;
  }
  wrap.innerHTML = `<div style="display:grid;grid-template-columns:260px 1fr;gap:20px;">
    <div id="comboList">
      ${combinations.map(c=>`
        <div class="combo-card ${activeComboId===c.id?'selected':''}" onclick="selectCombo('${c.id}')" style="border-color:${activeComboId===c.id?c.color:'var(--border)'};">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span class="combo-dot" style="background:${c.color||'#374151'};"></span>
            <strong>${esc(c.name)}</strong>
          </div>
          <div style="font-size:12px;color:var(--ink-3);margin-bottom:8px;">${esc(c.description||'')}</div>
          <div style="display:flex;gap:4px;">
            <button class="btn btn--ghost btn--sm" onclick="event.stopPropagation();editComboModal('${c.id}')">${editIcon()}</button>
            <button class="btn btn--ghost btn--sm" onclick="event.stopPropagation();deleteCombo('${c.id}','${esc(c.name).replace(/'/g,"\\'")}')">${trashIcon()} Delete</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="card" id="comboSubjects">
      <div style="text-align:center;padding:32px;color:var(--ink-3);">
        <p>Select a combination to assign subjects.</p>
      </div>
    </div>
  </div>`;
}

function toggleAddCombo(){ const c=document.getElementById('addComboCard'); c.style.display=c.style.display==='none'?'':'none'; }
async function saveNewCombo(){
  const name = document.getElementById('comboName').value.trim();
  if (!name) { toast('Enter name.','error'); return; }
  const { error } = await db.from('subject_combinations').insert({
    school_id: currentUser.school_id, name,
    color: document.getElementById('comboColor').value,
    description: document.getElementById('comboDesc').value.trim() || null,
  });
  if (error) { toast(friendlyError(error,'combo'),'error'); return; }
  toggleAddCombo(); await loadAll(); renderTab(); toast('Combination added!','success');
}
function editComboModal(id){
  const c = combinations.find(x => x.id === id); if (!c) return;
  openEdit(`
    <h3>Edit Combination</h3>
    <div class="form-group"><label class="form-label">Name <span class="required">*</span></label>
      <input id="ec2-name" class="form-control" value="${esc(c.name)}"></div>
    <div class="form-group"><label class="form-label">Color</label>
      <input type="color" id="ec2-color" class="form-control" value="${c.color||'#2563eb'}" style="height:42px;padding:4px;"></div>
    <div class="form-group"><label class="form-label">Description</label>
      <input id="ec2-desc" class="form-control" value="${esc(c.description||'')}"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn--primary" onclick="updateCombo('${id}')">Update</button>
      <button class="btn btn--ghost" onclick="closeEdit()">Cancel</button>
    </div>`);
}
async function updateCombo(id){
  const name = document.getElementById('ec2-name').value.trim();
  if (!name) { toast('Enter name.','error'); return; }
  const { error } = await db.from('subject_combinations').update({
    name,
    color: document.getElementById('ec2-color').value,
    description: document.getElementById('ec2-desc').value.trim() || null,
  }).eq('id', id);
  if (error) { toast(friendlyError(error,'combo'),'error'); return; }
  closeEdit(); await loadAll(); renderTab(); toast('Combination updated!','success');
}
async function selectCombo(id){
  activeComboId = id;
  const combo = combinations.find(c => c.id === id); if (!combo) return;
  const { data: assigned } = await db.from('combination_subjects').select('subject_id,is_compulsory').eq('combination_id', id);
  const aMap = {}; (assigned||[]).forEach(a => aMap[a.subject_id] = a.is_compulsory);
  document.getElementById('comboSubjects').innerHTML = `
    <div class="card__header">
      <div>
        <span class="card__title"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${combo.color};margin-right:6px;"></span>${esc(combo.name)} Subjects</span>
        <div style="font-size:12px;color:var(--ink-3);">${esc(combo.description||'')}</div>
      </div>
      <button class="btn btn--primary btn--sm" onclick="saveComboSubjects('${id}')">Save</button>
    </div>
    <div style="margin-bottom:10px;font-size:13px;color:var(--ink-3);">
      Tap once = <span style="background:var(--primary-light);color:var(--primary);padding:1px 6px;border-radius:3px;font-weight:700;">Core</span> &nbsp;
      Tap again = <span style="background:var(--info-light,#eff6ff);color:var(--info,#3b82f6);padding:1px 6px;border-radius:3px;font-weight:700;">Elective</span> &nbsp;
      Tap again = Remove
    </div>
    ${!subjects.length
      ? `<p style="color:var(--ink-3);font-size:13px;">No subjects yet. <a href="#" onclick="event.preventDefault();switchTab('subjects')" style="color:var(--primary);font-weight:600;">Add subjects first →</a></p>`
      : `<div id="chipArea" style="display:flex;flex-wrap:wrap;">
          ${subjects.map(s=>{ const state=s.id in aMap?(aMap[s.id]?'core':'elective'):'unassigned';
            return `<div class="subject-chip ${state}" id="chip-${s.id}" data-state="${state}" onclick="cycleChip('${s.id}','${esc(s.name).replace(/'/g,"\\'")}','${esc(s.code||'')}')">
              ${esc(s.code||s.name.substring(0,4))}
              <span style="font-size:10px;">${state==='core'?'★':state==='elective'?'◆':''}</span>
            </div>`}).join('')}
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--ink-3);">
          <span id="coreCount">${Object.values(aMap).filter(v=>v).length}</span> core ·
          <span id="electiveCount">${Object.values(aMap).filter(v=>!v).length}</span> elective
        </div>`}
  `;
  document.querySelectorAll('.combo-card').forEach(c=>{
    const isActive = c.onclick?.toString().includes(`'${id}'`);
    c.classList.toggle('selected', isActive);
    c.style.borderColor = isActive ? combo.color : 'var(--border)';
  });
}
function cycleChip(subjectId, name, code){
  const chip = document.getElementById(`chip-${subjectId}`);
  const state = chip.dataset.state; const display = code || name.substring(0,4);
  if (state==='unassigned') { chip.dataset.state='core'; chip.className='subject-chip core'; chip.innerHTML=`${esc(display)} <span style="font-size:10px;">★</span>`; }
  else if (state==='core') { chip.dataset.state='elective'; chip.className='subject-chip elective'; chip.innerHTML=`${esc(display)} <span style="font-size:10px;">◆</span>`; }
  else { chip.dataset.state='unassigned'; chip.className='subject-chip unassigned'; chip.innerHTML=`${esc(display)} <span style="font-size:10px;"></span>`; }
  const chips=[...document.querySelectorAll('#chipArea .subject-chip')];
  const cc=document.getElementById('coreCount'); if (cc) cc.textContent = chips.filter(c=>c.dataset.state==='core').length;
  const ec=document.getElementById('electiveCount'); if (ec) ec.textContent = chips.filter(c=>c.dataset.state==='elective').length;
}
async function saveComboSubjects(comboId){
  const chips = [...document.querySelectorAll('#chipArea .subject-chip')];
  const rows = chips.filter(c=>c.dataset.state!=='unassigned').map(c=>({
    combination_id: comboId,
    subject_id: c.id.replace('chip-',''),
    school_id: currentUser.school_id,
    is_compulsory: c.dataset.state==='core',
  }));
  const { error: delErr } = await db.from('combination_subjects').delete().eq('combination_id', comboId);
  if (delErr) { toast('Save failed: '+delErr.message,'error'); return; }
  if (rows.length) {
    const { error } = await db.from('combination_subjects').insert(rows);
    if (error) { toast('Save failed: '+error.message,'error'); return; }
  }
  toast(`${rows.length} subjects saved!`,'success');
}
async function deleteCombo(id, name){
  if (!confirm(`Delete combination "${name}"?`)) return;
  if (activeComboId === id) activeComboId = null;
  const { error } = await db.from('subject_combinations').delete().eq('id', id);
  if (error) { toast('Error: '+error.message,'error'); return; }
  await loadAll(); renderTab(); toast('Combination deleted.','success');
}
async function loadNigerianCombinations(){
  const presets = [
    { name:'Science',     color:'#2563eb', description:'Physics, Chemistry, Biology, Further Maths' },
    { name:'Art',          color:'#db2777', description:'Literature, Government, History, CRS/IRS' },
    { name:'Commercial',  color:'#16a34a', description:'Commerce, Accounting, Economics' },
  ];
  if (!confirm(`Load ${presets.length} standard Nigerian combinations? Duplicates will be skipped.`)) return;
  const { error } = await db.from('subject_combinations').upsert(
    presets.map(p=>({ school_id: currentUser.school_id, ...p })),
    { onConflict: 'school_id,name' }
  );
  if (error) { toast('Error: '+error.message,'error'); return; }
  await loadAll(); renderTab(); toast('Standard combinations loaded!','success');
}
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../js/assistant.js"></script>
</body>
