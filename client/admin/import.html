<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Import Data · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .import-zone{border:2px dashed var(--border-2);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .18s;background:var(--surface-2);}
    .import-zone:hover,.import-zone.drag{border-color:var(--primary);background:var(--primary-light);}
    .import-zone svg{display:block;margin:0 auto 12px;opacity:.4;}
    .preview-table{width:100%;border-collapse:collapse;font-size:.82rem;max-height:340px;overflow-y:auto;display:block;}
    .preview-table th{padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);position:sticky;top:0;}
    .preview-table td{padding:7px 12px;border-bottom:1px solid var(--border);}
    .step-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:white;font-size:.75rem;font-weight:800;flex-shrink:0;}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, parsedRows = [], classes = [], currentTerm;

(async () => {
  currentUser = await initAdminLayout('import', 'Import Data');
  if (!currentUser) return;
  const sid = currentUser.school_id;

  const [{ data: cls }, { data: trm }] = await Promise.all([
    db.from('classes').select('id,name').eq('school_id', sid).order('name'),
    db.from('terms').select('*').eq('school_id', sid).eq('is_current', true).maybeSingle(),
  ]);
  classes = cls || []; currentTerm = trm;

  document.getElementById('pageBody').innerHTML = `
    <div style="margin-bottom:22px;">
      <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Import Students</h1>
      <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Bulk-import students from a CSV file</p>
    </div>

    <!-- Step 1: Download Template -->
    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:24px;">
      <div class="step-badge">1</div>
      <div style="flex:1;">
        <div style="font-weight:700;margin-bottom:6px;">Download CSV Template</div>
        <p style="font-size:.875rem;color:var(--ink-3);margin-bottom:10px;">Download the template, fill in student data, then upload it below.</p>
        <button class="btn btn--secondary btn--sm" onclick="downloadTemplate()">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Template
        </button>
        <div style="margin-top:10px;font-size:.78rem;color:var(--ink-3);">
          <strong>Required columns:</strong> full_name, admission_no<br>
          <strong>Optional:</strong> gender, date_of_birth, phone, parent_name, parent_email, class_name
        </div>
      </div>
    </div>

    <!-- Step 2: Upload -->
    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:24px;">
      <div class="step-badge">2</div>
      <div style="flex:1;">
        <div style="font-weight:700;margin-bottom:6px;">Upload CSV File</div>
        <div class="import-zone" id="dropZone" onclick="document.getElementById('csvFile').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="handleDrop(event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p style="font-weight:600;margin:0;">Click to browse or drag & drop</p>
          <p style="font-size:.8rem;color:var(--ink-3);margin:4px 0 0;">CSV files only, max 1MB</p>
        </div>
        <input type="file" id="csvFile" accept=".csv" style="display:none;" onchange="handleFile(this.files[0])">
      </div>
    </div>

    <!-- Step 3: Preview & Options -->
    <div id="previewSection" style="display:none;">
      <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;">
        <div class="step-badge">3</div>
        <div style="flex:1;">
          <div style="font-weight:700;margin-bottom:10px;">Preview & Import Options</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
            <div>
              <label class="form-label" style="font-size:.78rem;">Default Class (optional)</label>
              <select id="importClass" class="form-control" style="max-width:180px;">
                <option value="">— None —</option>
                ${classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="form-label" style="font-size:.78rem;">Default Term</label>
              <select id="importTerm" class="form-control" style="max-width:180px;">
                <option value="">— None —</option>
              </select>
            </div>
            <label style="display:flex;align-items:center;gap:6px;font-size:.845rem;cursor:pointer;">
              <input type="checkbox" id="skipDuplicates" checked> Skip duplicate admission numbers
            </label>
          </div>
          <div id="previewWrap"></div>
          <div id="importProgress" style="display:none;margin-top:12px;"></div>
          <button class="btn btn--primary" id="importBtn" onclick="startImport()" style="margin-top:14px;">
            Import Students
          </button>
        </div>
      </div>
    </div>
  `;

  // Populate term select
  const { data: terms } = await db.from('terms').select('id,name,is_current,academic_year').eq('school_id', currentUser.school_id).order('created_at',{ascending:false});
  document.getElementById('importTerm').innerHTML = '<option value="">— None —</option>' +
    (terms||[]).map(t=>`<option value="${t.id}" ${t.is_current?'selected':''}>${t.name}${t.academic_year?' · '+t.academic_year:''}</option>`).join('');
})();

function downloadTemplate() {
  const csv = 'full_name,admission_no,gender,date_of_birth,phone,parent_name,parent_email,class_name\nAmaka Okafor,ADM001,female,2010-05-12,08012345678,Mrs Okafor,okafor@email.com,JSS 1A\n';
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'students-import-template.csv';
  a.click();
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag');
  handleFile(e.dataTransfer.files[0]);
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.csv')) { toast('Please upload a CSV file.', 'error'); return; }
  if (file.size > 1024 * 1024) { toast('File too large. Max 1MB.', 'error'); return; }
  const reader = new FileReader();
  reader.onload = e => parseCSV(e.target.result);
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) { toast('CSV has no data rows.', 'error'); return; }
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[^a-z_]/g,''));
  parsedRows = lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g,''));
    const obj = {};
    headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
    return obj;
  }).filter(r => r.full_name || r.admission_no);

  const previewWrap = document.getElementById('previewWrap');
  previewWrap.innerHTML = `
    <p style="font-size:.845rem;color:var(--ink-3);margin-bottom:8px;">Found <strong>${parsedRows.length} rows</strong>. Preview (first 5):</p>
    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;">
      <table class="preview-table">
        <thead><tr>${Object.keys(parsedRows[0]).map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${parsedRows.slice(0,5).map(r=>`<tr>${Object.values(r).map(v=>`<td>${v||'—'}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
  document.getElementById('previewSection').style.display = 'block';
  document.getElementById('importBtn').textContent = `Import ${parsedRows.length} Students`;
}

async function startImport() {
  const btn = document.getElementById('importBtn');
  const progress = document.getElementById('importProgress');
  const classId = document.getElementById('importClass').value;
  const termId = document.getElementById('importTerm').value;
  const skipDups = document.getElementById('skipDuplicates').checked;
  const sid = currentUser.school_id;

  btn.disabled = true; btn.textContent = 'Importing…';
  progress.style.display = 'block'; progress.innerHTML = '<div style="color:var(--ink-3);">Starting import…</div>';

  let success = 0, skipped = 0, errors = 0;

  // Get existing admission numbers if skipping duplicates
  let existingAdmNos = new Set();
  if (skipDups) {
    const { data } = await db.from('students').select('admission_no').eq('school_id', sid);
    existingAdmNos = new Set((data||[]).map(s=>s.admission_no?.toUpperCase()));
  }

  for (let i = 0; i < parsedRows.length; i++) {
    const row = parsedRows[i];
    const admNo = (row.admission_no||'').toUpperCase();

    if (skipDups && existingAdmNos.has(admNo)) { skipped++; continue; }
    if (!row.full_name || !admNo) { errors++; continue; }

    const payload = {
      school_id: sid, full_name: row.full_name, admission_no: admNo,
      gender: row.gender?.toLowerCase() || null,
      date_of_birth: row.date_of_birth || null,
      parent_phone: row.phone || null,
      parent_name: row.parent_name || null,
      parent_email: row.parent_email || null,
      is_active: true, pin: '1234',
    };

    const { data: stu, error } = await db.from('students').insert(payload).select('id').single();
    if (error) { errors++; continue; }
    success++;

    // Enroll if class+term given
    const targetClass = classId || (row.class_name ? classes.find(c=>c.name.toLowerCase()===row.class_name.toLowerCase())?.id : null);
    if (targetClass && termId && stu?.id) {
      await db.from('enrollments').insert({ student_id: stu.id, class_id: targetClass, term_id: termId, school_id: sid }).catch(()=>{});
    }

    if (i % 5 === 0) {
      progress.innerHTML = `<div style="color:var(--ink-2);">Importing… ${i+1}/${parsedRows.length}</div>`;
      await new Promise(r => setTimeout(r, 10));
    }
  }

  btn.disabled = false; btn.textContent = `Import ${parsedRows.length} Students`;
  progress.innerHTML = `
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px 16px;">
      <strong style="color:#166534;">Import complete!</strong><br>
      <span style="font-size:.845rem;color:#166534;">✅ ${success} imported &nbsp;·&nbsp; ⏭ ${skipped} skipped &nbsp;·&nbsp; ❌ ${errors} errors</span>
    </div>`;
  if (success > 0) toast(`${success} students imported successfully.`, 'success');
}
</script>
<script src="/js/pwa-v2.1.js"></script>

<script src="../js/assistant.js"></script>
</body>
</html>
