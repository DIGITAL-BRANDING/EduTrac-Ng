<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0b4d8a">
  <title>Scratch Cards · EduTrac Ng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:     #0b4d8a;
      --navy-dk:  #083970;
      --navy-lt:  #dbeafe;
      --gold:     #f5a623;
      --gold-lt:  #fff7e6;
      --green:    #16a34a;
      --green-lt: #dcfce7;
      --amber:    #d97706;
      --amber-lt: #fef3c7;
      --red:      #dc2626;
      --red-lt:   #fee2e2;
      --slate:    #64748b;
      --surface:  #f8fafc;
      --white:    #ffffff;
      --border:   #e2e8f0;
      --text:     #1e293b;
      --muted:    #94a3b8;
      --radius:   12px;
      --shadow:   0 4px 20px rgba(11,77,138,0.10), 0 1px 4px rgba(0,0,0,0.06);
      --shadow-lg:0 12px 32px rgba(11,77,138,0.18), 0 2px 8px rgba(0,0,0,0.06);
    }

    body {
      background: var(--surface);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    /* ─── PAGE HEADER ─────────────────────────────────────── */
    .page-header {
      background: linear-gradient(135deg, var(--navy-dk) 0%, var(--navy) 60%, #1a6fbd 100%);
      color: var(--white);
      padding: 28px 32px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }

    .page-header::before {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 260px; height: 260px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }
    .page-header::after {
      content: '';
      position: absolute;
      right: 40px; bottom: -80px;
      width: 180px; height: 180px;
      background: rgba(245,166,35,0.12);
      border-radius: 50%;
    }

    .page-header-left h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .page-header-left h1 span {
      color: var(--gold);
    }

    .page-header-left p {
      margin-top: 6px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.2px;
    }

    .header-brand {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }

    /* ─── STATS ROW ───────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 14px;
      padding: 20px 32px 0;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      flex: 1;
      min-width: 120px;
    }

    .stat-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .stat-icon.total   { background: var(--navy-lt); }
    .stat-icon.avail   { background: var(--green-lt); }
    .stat-icon.inuse   { background: var(--amber-lt); }
    .stat-icon.expired { background: var(--red-lt); }

    .stat-num { font-size: 1.5rem; font-weight: 800; line-height: 1; }
    .stat-num.avail   { color: var(--green); }
    .stat-num.inuse   { color: var(--amber); }
    .stat-num.expired { color: var(--red); }
    .stat-num.total   { color: var(--navy); }

    .stat-lbl { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }

    /* ─── TOOLBAR ─────────────────────────────────────────── */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 18px 32px;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      margin-top: 18px;
    }

    .toolbar-left { display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.15s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary   { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .btn-primary:hover { background: var(--navy-dk); }
    .btn-ghost     { background: var(--white); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface); }
    .btn-danger    { background: var(--white); color: var(--red); border-color: #fca5a5; }
    .btn-danger:hover { background: var(--red-lt); }

    .search-input {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.83rem;
      background: var(--white);
      color: var(--text);
      width: 220px;
      transition: border-color 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--navy); }

    /* ─── FOLDER TABS ─────────────────────────────────────── */
    .folder-tabs {
      display: flex;
      gap: 0;
      padding: 0 32px;
      border-bottom: 2px solid var(--border);
      background: var(--white);
      overflow-x: auto;
    }

    .folder-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 14px 22px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--slate);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
      white-space: nowrap;
      background: transparent;
      border-top: none; border-left: none; border-right: none;
    }

    .folder-tab:hover { color: var(--navy); }

    .folder-tab.active {
      color: var(--navy);
      border-bottom-color: var(--navy);
    }

    .folder-tab .tab-badge {
      background: var(--navy-lt);
      color: var(--navy);
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 20px;
      min-width: 20px;
      text-align: center;
    }

    .folder-tab.available .tab-badge { background: var(--green-lt); color: var(--green); }
    .folder-tab.inuse .tab-badge { background: var(--amber-lt); color: var(--amber); }
    .folder-tab.expired .tab-badge { background: var(--red-lt); color: var(--red); }

    .tab-icon { font-size: 1rem; }

    /* ─── CONTENT AREA ────────────────────────────────────── */
    .content-area {
      padding: 24px 32px 48px;
    }

    /* ─── SCRATCH CARD GRID ───────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-top: 4px;
    }

    /* ─── INDIVIDUAL SCRATCH CARD ─────────────────────────── */
    .scratch-card {
      background: var(--white);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .scratch-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    /* Diagonal ribbon for status */
    .card-ribbon {
      position: absolute;
      top: 14px; right: -22px;
      background: var(--green);
      color: var(--white);
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 28px;
      transform: rotate(35deg);
      z-index: 10;
    }
    .card-ribbon.in-use  { background: var(--amber); }
    .card-ribbon.expired { background: var(--red); }

    /* Card header — school branding */
    .card-header {
      background: linear-gradient(135deg, var(--navy-dk) 0%, var(--navy) 100%);
      padding: 13px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    .card-header::after {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 80px; height: 80px;
      background: rgba(245,166,35,0.15);
      border-radius: 50%;
    }

    .card-school-name {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.88rem;
      line-height: 1.25;
      font-weight: 400;
      max-width: 200px;
    }

    .card-purpose-badge {
      background: var(--gold);
      color: #1a1a1a;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      margin-top: 5px;
      display: inline-block;
    }

    .card-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      z-index: 2;
    }

    .edutrac-badge {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    /* Emblem svg */
    .card-emblem svg {
      width: 44px;
      height: 44px;
      opacity: 0.9;
    }

    /* Card Body */
    .card-body {
      padding: 15px 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .field-block { flex: 1; }

    .field-label {
      font-size: 0.57rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }

    .serial-value {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.3px;
    }

    /* Scratch panel */
    .pin-panel {
      background: linear-gradient(120deg, #c8cdd0 0%, #eaedee 40%, #d4d8db 70%, #9ea5aa 100%);
      border: 1px solid #c1c7cb;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.06);
      position: relative;
    }

    .pin-label {
      font-size: 0.52rem;
      font-weight: 800;
      color: rgba(0,0,0,0.45);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .pin-digits {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: #111;
      background: rgba(255,255,255,0.85);
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px dashed #b0b7bb;
      text-align: center;
      display: block;
    }

    .scratch-texture {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.06) 2px,
        rgba(255,255,255,0.06) 4px
      );
      border-radius: 8px;
      pointer-events: none;
    }

    /* Meta row */
    .card-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta-tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .meta-tag.available { background: var(--green-lt); color: #166534; }
    .meta-tag.in-use    { background: var(--amber-lt); color: #92400e; }
    .meta-tag.expired   { background: var(--red-lt); color: #991b1b; }
    .meta-tag.type      { background: var(--navy-lt); color: var(--navy); }
    .meta-tag.uses      { background: #f1f5f9; color: var(--slate); }

    /* Card footer */
    .card-footer {
      background: var(--gold);
      border-top: 1px solid #e8961a;
      padding: 9px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-site {
      font-size: 0.62rem;
      font-weight: 700;
      color: #3d1f00;
      text-decoration: none;
    }

    .footer-date {
      font-size: 0.58rem;
      font-weight: 600;
      color: rgba(0,0,0,0.5);
      text-align: right;
    }

    /* ─── EMPTY STATE ─────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      background: var(--white);
      border-radius: var(--radius);
      border: 2px dashed var(--border);
      margin-top: 8px;
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-title { font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 1rem; }
    .empty-sub { color: var(--muted); font-size: 0.82rem; }

    /* ─── MODAL ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 460px;
      margin: 16px;
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--navy-dk), var(--navy));
      padding: 18px 22px;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 { font-size: 1rem; font-weight: 700; }

    .modal-close {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--white); }

    .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-control {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.85rem;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .form-control:focus { outline: none; border-color: var(--navy); }

    .form-error {
      font-size: 0.77rem;
      color: var(--red);
      font-weight: 600;
      background: var(--red-lt);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid var(--red);
      display: none;
    }

    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface);
    }

    /* ─── TOAST ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 10000;
      display: none;
      transition: opacity 0.3s;
    }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* ─── SECTION HEADER ──────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-header h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .section-header .count-chip {
      background: var(--navy-lt);
      color: var(--navy);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }

    /* ─── PRINT ───────────────────────────────────────────── */
    @media print {
      .toolbar, .stats-row, .folder-tabs, .modal-overlay, .toast, button {
        display: none !important;
      }
      body { background: white; }
      .scratch-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        margin-bottom: 16px;
      }
      .content-area { padding: 0; }
    }

    @media (max-width: 640px) {
      .page-header { padding: 20px 16px; }
      .stats-row { padding: 14px 16px 0; }
      .toolbar { padding: 12px 16px; }
      .folder-tabs { padding: 0 16px; }
      .content-area { padding: 16px 16px 40px; }
      .cards-grid { grid-template-columns: 1fr; }
      .search-input { width: 100%; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- Generate Modal -->
<div class="modal-overlay" id="genModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>✦ Generate Scratch Cards</h2>
      <button class="modal-close" onclick="closeModal('genModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Number of Cards</label>
        <input type="number" id="genCount" class="form-control" value="12" min="1" max="200">
      </div>
      <div class="form-group">
        <label class="form-label">PIN Length</label>
        <select id="genPinLen" class="form-control">
          <option value="8">8 digits</option>
          <option value="10">10 digits</option>
          <option value="12" selected>12 digits</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Card Purpose</label>
        <select id="genPurpose" class="form-control">
          <option value="Result Checker">Result Checker</option>
          <option value="Registration">Registration</option>
        </select>
      </div>
      <div id="genErr" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('genModal')">Cancel</button>
      <button class="btn btn-primary" id="genBtn" onclick="generateCards()">Generate Cards</button>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>

<script>
let currentUser, allCards = [], activeTab = 'available';

/* ─── INIT ─────────────────────────────────────────────────── */
(async () => {
  currentUser = await initAdminLayout('scratch-cards', 'Scratch Cards');
  if (!currentUser) return;

  document.getElementById('pageBody').innerHTML = buildPageHTML();
  loadCards();
})();

function buildPageHTML() {
  return `
    <div class="page-header">
      <div class="page-header-left">
        <h1>Scratch Card <span>Management</span></h1>
        <p>Generate, distribute and track secure authentication scratch vouchers</p>
      </div>
      <div class="header-brand">EduTrac Ng</div>
    </div>

    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-icon total">📋</div>
        <div><div class="stat-num total" id="stTotal">0</div><div class="stat-lbl">Total Cards</div></div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon avail">✅</div>
        <div><div class="stat-num avail" id="stAvail">0</div><div class="stat-lbl">Available</div></div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon inuse">🔄</div>
        <div><div class="stat-num inuse" id="stInUse">0</div><div class="stat-lbl">In Use</div></div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon expired">⛔</div>
        <div><div class="stat-num expired" id="stExpired">0</div><div class="stat-lbl">Expired / Used</div></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-primary" onclick="openModal('genModal')">＋ Generate Cards</button>
        <button class="btn btn-ghost" onclick="exportCards()">⬇ Export CSV</button>
        <button class="btn btn-ghost" onclick="printCards()">🖨 Print</button>
      </div>
      <div class="toolbar-right">
        <input type="text" id="cardSearch" class="search-input" placeholder="🔍  Search serial or PIN…" oninput="renderCards()">
      </div>
    </div>

    <div class="folder-tabs">
      <button class="folder-tab available active" id="tab-available" onclick="switchTab('available')">
        <span class="tab-icon">📂</span> Available
        <span class="tab-badge available" id="badge-available">0</span>
      </button>
      <button class="folder-tab inuse" id="tab-inuse" onclick="switchTab('inuse')">
        <span class="tab-icon">📁</span> In-Use
        <span class="tab-badge inuse" id="badge-inuse">0</span>
      </button>
      <button class="folder-tab expired" id="tab-expired" onclick="switchTab('expired')">
        <span class="tab-icon">🗂</span> Expired
        <span class="tab-badge expired" id="badge-expired">0</span>
      </button>
    </div>

    <div class="content-area">
      <div id="cardsContent"><div style="text-align:center;padding:60px;color:#94a3b8;">Loading cards…</div></div>
    </div>
  `;
}

/* ─── DATA ─────────────────────────────────────────────────── */
async function loadCards() {
  const { data, error } = await db.from('scratch_cards')
    .select('*, schools(name)')
    .eq('school_id', currentUser.school_id)
    .order('created_at', { ascending: false });
  if (error) { showError(error.message); return; }
  allCards = data || [];
  updateStats();
  renderCards();
}

function categoriseCard(c) {
  if (c.is_used) return 'expired';
  if ((c.uses_count || 0) > 0) return 'inuse';
  return 'available';
}

function updateStats() {
  const total    = allCards.length;
  const avail    = allCards.filter(c => categoriseCard(c) === 'available').length;
  const inuse    = allCards.filter(c => categoriseCard(c) === 'inuse').length;
  const expired  = allCards.filter(c => categoriseCard(c) === 'expired').length;

  document.getElementById('stTotal').textContent   = total;
  document.getElementById('stAvail').textContent   = avail;
  document.getElementById('stInUse').textContent   = inuse;
  document.getElementById('stExpired').textContent = expired;

  document.getElementById('badge-available').textContent = avail;
  document.getElementById('badge-inuse').textContent     = inuse;
  document.getElementById('badge-expired').textContent   = expired;
}

/* ─── TABS ─────────────────────────────────────────────────── */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById(`tab-${tab}`);
  if (el) el.classList.add('active');
  renderCards();
}

/* ─── RENDER ───────────────────────────────────────────────── */
function renderCards() {
  const q = (document.getElementById('cardSearch')?.value || '').toLowerCase();
  const filtered = allCards.filter(c => {
    const cat = categoriseCard(c);
    if (cat !== activeTab) return false;
    if (q && !(c.serial_no || '').toLowerCase().includes(q) && !(c.pin || '').includes(q)) return false;
    return true;
  });

  const container = document.getElementById('cardsContent');
  if (!filtered.length) {
    const labels = { available: 'Available', inuse: 'In-Use', expired: 'Expired' };
    const icons  = { available: '📭', inuse: '📋', expired: '🗂' };
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${icons[activeTab]}</div>
        <div class="empty-title">No ${labels[activeTab]} Cards</div>
        <div class="empty-sub">${activeTab === 'available' ? 'Generate a batch to get started.' : 'Cards will appear here once their status changes.'}</div>
        ${activeTab === 'available' ? `<button class="btn btn-primary" style="margin-top:16px;" onclick="openModal('genModal')">＋ Generate Cards</button>` : ''}
      </div>`;
    return;
  }

  const tabLabel = { available: 'Available Cards', inuse: 'In-Use Cards', expired: 'Expired / Used Cards' };
  container.innerHTML = `
    <div class="section-header">
      <h2>${tabLabel[activeTab]}</h2>
      <span class="count-chip">${filtered.length} card${filtered.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="cards-grid">${filtered.slice(0, 150).map(buildCardHTML).join('')}</div>
    ${filtered.length > 150 ? `<p style="text-align:center;margin-top:16px;font-size:0.75rem;color:#94a3b8;">Showing 150 of ${filtered.length} cards — export CSV for full list.</p>` : ''}
  `;
}

/* ─── CARD HTML ────────────────────────────────────────────── */
function buildCardHTML(card) {
  const schoolName = card.schools?.name || 'Your School';
  const serialNo   = esc(card.serial_no || `EDU${Math.floor(Math.random()*10000)}`);
  const pin        = formatPin(card.pin);
  const cat        = categoriseCard(card);
  const purpose    = (card.purpose || 'Result Checker').trim();
  const isResult   = purpose.toLowerCase().includes('result');

  // Purpose badge label
  const purposeLabel = isResult ? '🔎 Result Checker' : '📝 Registration';

  // Status
  const ribbonLabel = { available: 'Active', inuse: 'In Use', expired: 'Used' }[cat];
  const statusClass = cat;

  // Uses text
  const usesText = (card.uses_count && card.max_uses)
    ? `${card.uses_count} / ${card.max_uses} uses`
    : (card.used_at ? `Used: ${new Date(card.used_at).toLocaleDateString('en-GB')}` : 'Valid for use');

  return `
  <div class="scratch-card">
    <div class="card-ribbon ${statusClass}">${ribbonLabel}</div>

    <div class="card-header">
      <div>
        <div class="card-school-name">${esc(schoolName)}</div>
        <div class="card-purpose-badge">${purposeLabel}</div>
      </div>
      <div class="card-header-right">
        <span class="edutrac-badge">EduTrac Ng</span>
        <div class="card-emblem">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 2 L59 38 L95 22 L70 48 L98 50 L70 52 L95 78 L59 62 L50 98 L41 62 L5 78 L30 52 L2 50 L30 48 L5 22 L41 38 Z" fill="rgba(255,255,255,0.15)"/>
            <path d="M50 10 L57 40 L88 27 L66 47 L90 50 L66 53 L88 73 L57 60 L50 90 L43 60 L12 73 L34 53 L10 50 L34 47 L12 27 L43 40 Z" fill="${isResult ? '#f5a623' : '#4ade80'}"/>
            <circle cx="50" cy="50" r="17" fill="rgba(11,77,138,0.85)"/>
            <text x="50" y="46" font-size="7" font-weight="bold" fill="#f5a623" text-anchor="middle" font-family="Inter, sans-serif">EDU</text>
            <text x="50" y="56" font-size="6" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-family="Inter, sans-serif">TRAC</text>
          </svg>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="field-row">
        <div class="field-block">
          <span class="field-label">Serial Number</span>
          <span class="serial-value">${serialNo}</span>
        </div>
      </div>

      <div>
        <div class="pin-panel">
          <div class="scratch-texture"></div>
          <div class="pin-label">🔐 PIN (Scratch & Enter)</div>
          <span class="pin-digits">${pin}</span>
        </div>
      </div>

      <div class="card-meta">
        <span class="meta-tag ${statusClass}">${ribbonLabel === 'Active' ? '✓ Available' : ribbonLabel}</span>
        <span class="meta-tag type">${isResult ? 'Result Checker' : 'Registration'}</span>
        ${card.uses_count ? `<span class="meta-tag uses">${card.uses_count}/${card.max_uses || 1} uses</span>` : ''}
      </div>
    </div>

    <div class="card-footer">
      <a class="footer-site" href="https://www.edutracng.com">www.edutracng.com</a>
      <div class="footer-date">${usesText}</div>
    </div>
  </div>`;
}

/* ─── PIN FORMAT ───────────────────────────────────────────── */
function formatPin(pin) {
  if (!pin) return '****-****-****';
  const r = String(pin).replace(/[\s-]/g, '');
  if (r.length === 12) return `${r.slice(0,4)}-${r.slice(4,8)}-${r.slice(8,12)}`;
  if (r.length === 10) return `${r.slice(0,4)}-${r.slice(4,7)}-${r.slice(7,10)}`;
  if (r.length === 8)  return `${r.slice(0,4)}-${r.slice(4,8)}`;
  return r.match(/.{1,4}/g)?.join('-') || r;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ─── GENERATE ─────────────────────────────────────────────── */
async function generateCards() {
  const btn   = document.getElementById('genBtn');
  const errEl = document.getElementById('genErr');
  const count = parseInt(document.getElementById('genCount').value);
  const pinLen= parseInt(document.getElementById('genPinLen').value);
  const purp  = document.getElementById('genPurpose').value;

  errEl.style.display = 'none';
  if (!count || count < 1 || count > 200) {
    errEl.textContent = 'Count must be between 1 and 200.';
    errEl.style.display = 'block';
    return;
  }

  const { data: schoolData, error: schErr } = await db.from('schools')
    .select('can_self_generate_cards, self_generate_limit')
    .eq('id', currentUser.school_id).single();

  if (schErr || !schoolData?.can_self_generate_cards) {
    errEl.textContent = 'Permission denied: contact your administrator.';
    errEl.style.display = 'block';
    return;
  }

  const limit = schoolData.self_generate_limit || 100;
  if (count > limit) { errEl.textContent = `Max batch is ${limit} cards.`; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '⏳ Generating…';

  const cardType = purp.toLowerCase().includes('result') ? 'result' : 'registration';
  const maxUses  = cardType === 'result' ? 3 : 1;
  const now = Date.now();
  const usedPins = new Set();
  const batch = [];

  for (let i = 0; i < count; i++) {
    let p;
    do {
      p = Array.from({length: pinLen}, () => Math.floor(Math.random()*10)).join('');
    } while (usedPins.has(p));
    usedPins.add(p);
    batch.push({
      school_id: currentUser.school_id,
      serial_no: `EDU${String(now).slice(-7)}${String(i+1).padStart(3,'0')}`,
      pin: p, is_used: false, uses_count: 0, max_uses: maxUses,
      card_type: cardType, purpose: purp,
      batch_id: `BATCH_${purp.replace(/\s/g,'')}${String(now).slice(-6)}`,
    });
  }

  const { error } = await db.from('scratch_cards').insert(batch);
  btn.disabled = false; btn.textContent = 'Generate Cards';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('genModal');
  showToast(`${count} card(s) generated successfully.`, 'success');
  loadCards();
}

/* ─── EXPORT / PRINT ───────────────────────────────────────── */
function exportCards() {
  const rows = allCards.map(c => [
    c.serial_no, c.pin, categoriseCard(c), c.purpose || '', c.used_at || ''
  ]);
  const csv = [['Serial Number','PIN','Status','Purpose','Used At'], ...rows]
    .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
    .join('\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([csv], {type:'text/csv'})),
    download: `scratchcards_${new Date().toISOString().slice(0,10)}.csv`
  });
  a.click(); URL.revokeObjectURL(a.href);
}

function printCards() { window.print(); }

/* ─── HELPERS ──────────────────────────────────────────────── */
function openModal(id)  { document.getElementById(id)?.classList.add('open'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }

function showToast(msg, type) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.style.display = 'block'; el.style.opacity = '1';
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; }, 400);
  }, 3000);
}

function showError(msg) {
  const c = document.getElementById('cardsContent');
  if (c) c.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error Loading Cards</div><div class="empty-sub">${esc(msg)}</div></div>`;
}

window.closeModal = closeModal;
window.openModal  = openModal;
window.generateCards = generateCards;
window.exportCards   = exportCards;
window.printCards    = printCards;
window.switchTab     = switchTab;
</script>
