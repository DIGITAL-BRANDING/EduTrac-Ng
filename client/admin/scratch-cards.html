<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0b4d8a">
  <title>Scratch Cards · EduTrac Ng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Shared */
      --surface:   #f1f5f9;
      --white:     #ffffff;
      --border:    #e2e8f0;
      --text:      #1e293b;
      --muted:     #94a3b8;
      --slate:     #64748b;
      --red:       #dc2626;
      --red-lt:    #fee2e2;
      --amber:     #d97706;
      --amber-lt:  #fef3c7;
      --green-lt:  #dcfce7;
      --shadow:    0 4px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg: 0 14px 36px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.05);
      --radius:    14px;

      /* Result Checker palette — deep navy + gold */
      --rc-bg1:    #07305c;
      --rc-bg2:    #0b4d8a;
      --rc-bg3:    #1565c0;
      --rc-gold:   #f5a623;
      --rc-gold2:  #ffc94a;
      --rc-lt:     #dbeafe;
      --rc-text:   #1e3a5f;

      /* Registration palette — forest green + cream */
      --rg-bg1:    #064e3b;
      --rg-bg2:    #065f46;
      --rg-bg3:    #047857;
      --rg-gold:   #d4a017;
      --rg-cream:  #f0fdf4;
      --rg-lt:     #bbf7d0;
      --rg-text:   #064e3b;
    }

    body {
      background: var(--surface);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    /* ══════════════════════════════════════════
       PAGE HEADER
    ══════════════════════════════════════════ */
    .page-header {
      background: linear-gradient(135deg, #051e36 0%, #07305c 55%, #0b4d8a 100%);
      color: var(--white);
      padding: 26px 32px 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content:''; position:absolute; right:-50px; top:-50px;
      width:240px; height:240px;
      background: rgba(245,166,35,0.08); border-radius:50%;
    }
    .page-header::after {
      content:''; position:absolute; left:30%; bottom:-70px;
      width:160px; height:160px;
      background: rgba(255,255,255,0.03); border-radius:50%;
    }
    .ph-left h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.7rem; font-weight:400; line-height:1.2;
    }
    .ph-left h1 em { color: var(--rc-gold); font-style:normal; }
    .ph-left p { margin-top:5px; font-size:0.78rem; color:rgba(255,255,255,0.55); }
    .ph-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:2; }
    .brand-pill {
      background: rgba(245,166,35,0.15);
      border: 1px solid rgba(245,166,35,0.35);
      border-radius:7px; padding:6px 13px;
      font-size:0.68rem; font-weight:800; letter-spacing:1.3px;
      text-transform:uppercase; color: var(--rc-gold);
    }
    .legend-row {
      display:flex; gap:10px;
    }
    .legend-chip {
      display:flex; align-items:center; gap:5px;
      font-size:0.65rem; font-weight:600; color:rgba(255,255,255,0.7);
    }
    .legend-swatch {
      width:10px; height:10px; border-radius:2px;
    }

    /* ══════════════════════════════════════════
       STATS BAR
    ══════════════════════════════════════════ */
    .stats-bar {
      display:flex; gap:12px; padding:18px 32px 0; flex-wrap:wrap;
    }
    .stat-card {
      background:var(--white); border:1px solid var(--border);
      border-radius:10px; padding:11px 18px;
      display:flex; align-items:center; gap:11px;
      box-shadow:0 2px 6px rgba(0,0,0,0.04);
      flex:1; min-width:110px;
    }
    .si { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; }
    .si.total   { background:#dbeafe; }
    .si.avail   { background:#dcfce7; }
    .si.inuse   { background:#fef3c7; }
    .si.expired { background:#fee2e2; }
    .sn { font-size:1.45rem; font-weight:800; line-height:1; }
    .sn.total   { color:#0b4d8a; }
    .sn.avail   { color:#16a34a; }
    .sn.inuse   { color:#d97706; }
    .sn.expired { color:#dc2626; }
    .sl { font-size:0.57rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-top:2px; }

    /* ══════════════════════════════════════════
       TOOLBAR
    ══════════════════════════════════════════ */
    .toolbar {
      display:flex; flex-wrap:wrap; gap:10px;
      padding:14px 32px;
      align-items:center; justify-content:space-between;
      background:var(--white);
      border-bottom:1px solid var(--border);
      margin-top:16px;
    }
    .tl { display:flex; gap:8px; flex-wrap:wrap; }
    .tr { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn {
      display:inline-flex; align-items:center; gap:5px;
      padding:8px 15px; border-radius:7px;
      font-size:0.81rem; font-weight:600; cursor:pointer;
      border:1px solid transparent; transition:0.15s;
      white-space:nowrap; text-decoration:none;
    }
    .btn-primary { background:#0b4d8a; color:#fff; border-color:#0b4d8a; }
    .btn-primary:hover { background:#083970; }
    .btn-ghost { background:#fff; color:var(--text); border-color:var(--border); }
    .btn-ghost:hover { background:var(--surface); }
    .search-box {
      padding:8px 13px; border:1px solid var(--border); border-radius:7px;
      font-size:0.82rem; background:#fff; color:var(--text);
      width:210px; transition:border-color 0.15s;
    }
    .search-box:focus { outline:none; border-color:#0b4d8a; }

    /* ══════════════════════════════════════════
       FOLDER TABS
    ══════════════════════════════════════════ */
    .folder-tabs {
      display:flex; padding:0 32px;
      border-bottom:2px solid var(--border);
      background:var(--white); overflow-x:auto;
    }
    .ftab {
      display:flex; align-items:center; gap:6px;
      padding:13px 20px 11px;
      font-size:0.81rem; font-weight:600;
      cursor:pointer; color:var(--slate);
      border:none; border-bottom:3px solid transparent;
      margin-bottom:-2px; background:transparent;
      transition:all 0.15s; white-space:nowrap;
    }
    .ftab:hover { color:#0b4d8a; }
    .ftab.active { color:#0b4d8a; border-bottom-color:#0b4d8a; }
    .tbadge {
      font-size:0.58rem; font-weight:800; padding:2px 7px;
      border-radius:20px; min-width:18px; text-align:center;
    }
    .ftab.favail .tbadge { background:#dcfce7; color:#166534; }
    .ftab.finuse .tbadge { background:#fef3c7; color:#92400e; }
    .ftab.fexpired .tbadge { background:#fee2e2; color:#991b1b; }
    .ftab:not(.favail):not(.finuse):not(.fexpired) .tbadge { background:#dbeafe; color:#1e40af; }

    /* ══════════════════════════════════════════
       CONTENT AREA
    ══════════════════════════════════════════ */
    .content-area { padding:22px 32px 48px; }
    .section-head {
      display:flex; align-items:center; gap:9px; margin-bottom:16px;
    }
    .section-head h2 { font-size:0.88rem; font-weight:700; }
    .count-chip {
      background:#dbeafe; color:#1e40af;
      font-size:0.62rem; font-weight:700;
      padding:2px 8px; border-radius:20px;
    }
    .cards-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
      gap:20px;
    }

    /* ══════════════════════════════════════════
       RESULT CHECKER CARD  (navy / gold)
    ══════════════════════════════════════════ */
    .sc-result {
      background:var(--white);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex; flex-direction:column;
      max-width:400px; margin:0 auto; width:100%;
      transition:transform 0.2s, box-shadow 0.2s;
      position:relative;
      border-top: 4px solid var(--rc-gold);
    }
    .sc-result:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }

    /* Result header */
    .sc-result .card-head {
      background: linear-gradient(135deg, var(--rc-bg1) 0%, var(--rc-bg2) 55%, var(--rc-bg3) 100%);
      padding:14px 15px 12px;
      display:flex; align-items:flex-start; justify-content:space-between;
      position:relative; overflow:hidden;
    }
    .sc-result .card-head::before {
      content:''; position:absolute;
      right:-24px; top:-24px;
      width:90px; height:90px;
      background:rgba(245,166,35,0.12); border-radius:50%;
    }
    /* watermark pattern */
    .sc-result .card-head::after {
      content:'RESULT';
      position:absolute; right:10px; bottom:-4px;
      font-size:2.8rem; font-weight:900; letter-spacing:2px;
      color:rgba(255,255,255,0.04); pointer-events:none;
      font-family:'Inter',sans-serif;
    }
    .rc-head-left {}
    .rc-type-label {
      font-size:0.55rem; font-weight:800; letter-spacing:1.2px;
      text-transform:uppercase; color:var(--rc-gold);
      margin-bottom:4px; display:block;
    }
    .rc-school-name {
      font-family:'DM Serif Display', Georgia, serif;
      font-size:0.9rem; color:#fff; line-height:1.25; font-weight:400;
      max-width:200px;
    }
    .rc-uses-row {
      display:flex; gap:4px; margin-top:7px;
    }
    .rc-use-dot {
      width:9px; height:9px; border-radius:50%;
      background:rgba(255,255,255,0.25);
      border:1px solid rgba(255,255,255,0.4);
    }
    .rc-use-dot.filled { background:var(--rc-gold); border-color:var(--rc-gold); }

    .rc-head-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; z-index:2; }
    .rc-brand-lbl { font-size:0.58rem; font-weight:800; color:rgba(255,255,255,0.45); letter-spacing:0.8px; }
    .rc-emblem svg { width:46px; height:46px; }

    /* Result card body */
    .sc-result .card-body {
      padding:14px 15px 12px;
      display:flex; flex-direction:column; gap:11px; flex-grow:1;
      background:#fff;
    }
    .field-lbl {
      font-size:0.56rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.7px; color:var(--muted); margin-bottom:3px; display:block;
    }
    .serial-val {
      font-family:'JetBrains Mono','Courier New',monospace;
      font-size:0.88rem; font-weight:700; color:#c81e1e; letter-spacing:0.3px;
    }

    /* metallic silver PIN panel */
    .pin-panel-silver {
      background: linear-gradient(120deg, #c0c5c9 0%, #e8ebec 35%, #d6dadd 65%, #979fa4 100%);
      border:1px solid #b8bec2; border-radius:8px;
      padding:9px 13px;
      box-shadow:inset 0 2px 5px rgba(0,0,0,0.13), 0 1px 2px rgba(0,0,0,0.06);
      position:relative;
    }
    .pin-panel-silver .scratch-tex {
      position:absolute; inset:0; border-radius:8px; pointer-events:none;
      background-image: repeating-linear-gradient(
        45deg, transparent, transparent 2px,
        rgba(255,255,255,0.07) 2px, rgba(255,255,255,0.07) 4px);
    }
    .pin-lbl-inner {
      font-size:0.5rem; font-weight:800; color:rgba(0,0,0,0.4);
      text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;
    }
    .pin-digits {
      font-family:'JetBrains Mono','Courier New',monospace;
      font-size:1.08rem; font-weight:700; letter-spacing:3px;
      color:#111; background:rgba(255,255,255,0.82);
      padding:5px 10px; border-radius:5px;
      border:1px dashed #adb5bd; text-align:center; display:block;
    }

    .rc-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .mtag {
      padding:3px 8px; border-radius:4px;
      font-size:0.56rem; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    }
    .mtag.st-avail    { background:#dcfce7; color:#166534; }
    .mtag.st-inuse    { background:#fef3c7; color:#92400e; }
    .mtag.st-expired  { background:#fee2e2; color:#991b1b; }
    .mtag.type-result { background:#dbeafe; color:#1e40af; }
    .mtag.uses-left   { background:#f1f5f9; color:var(--slate); }

    /* Result card footer — deep navy bar */
    .sc-result .card-foot {
      background: linear-gradient(90deg, var(--rc-bg1), var(--rc-bg2));
      padding:8px 15px;
      display:flex; justify-content:space-between; align-items:center;
      border-top:2px solid var(--rc-gold);
    }
    .sc-result .foot-site { font-size:0.6rem; font-weight:700; color:rgba(255,255,255,0.6); text-decoration:none; }
    .sc-result .foot-site:hover { color:var(--rc-gold); }
    .sc-result .foot-info { font-size:0.58rem; font-weight:600; color:rgba(255,255,255,0.45); text-align:right; }
    .sc-result .foot-uses { font-size:0.65rem; font-weight:700; color:var(--rc-gold); }

    /* status ribbon */
    .card-ribbon {
      position:absolute; top:14px; right:-22px;
      font-size:0.5rem; font-weight:800; letter-spacing:1px;
      text-transform:uppercase; color:#fff;
      padding:3px 28px; transform:rotate(35deg); z-index:10;
    }
    .card-ribbon.active  { background:#16a34a; }
    .card-ribbon.inuse   { background:#d97706; }
    .card-ribbon.expired { background:#dc2626; }

    /* ══════════════════════════════════════════
       REGISTRATION CARD  (forest green / cream)
    ══════════════════════════════════════════ */
    .sc-reg {
      background: var(--rg-cream);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex; flex-direction:column;
      max-width:400px; margin:0 auto; width:100%;
      transition:transform 0.2s, box-shadow 0.2s;
      position:relative;
      border-top: 4px solid var(--rg-gold);
    }
    .sc-reg:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }

    /* Reg header */
    .sc-reg .card-head {
      background: linear-gradient(135deg, var(--rg-bg1) 0%, var(--rg-bg2) 55%, var(--rg-bg3) 100%);
      padding:14px 15px 12px;
      display:flex; align-items:flex-start; justify-content:space-between;
      position:relative; overflow:hidden;
    }
    .sc-reg .card-head::before {
      content:''; position:absolute; right:-24px; top:-24px;
      width:90px; height:90px;
      background:rgba(212,160,23,0.14); border-radius:50%;
    }
    .sc-reg .card-head::after {
      content:'REGISTRATION';
      position:absolute; right:-6px; bottom:-4px;
      font-size:1.5rem; font-weight:900; letter-spacing:1px;
      color:rgba(255,255,255,0.04); pointer-events:none;
      font-family:'Inter',sans-serif; white-space:nowrap;
    }
    .rg-type-label {
      font-size:0.55rem; font-weight:800; letter-spacing:1.2px;
      text-transform:uppercase; color:#6ee7b7;
      margin-bottom:4px; display:block;
    }
    .rg-school-name {
      font-family:'DM Serif Display', Georgia, serif;
      font-size:0.9rem; color:#fff; line-height:1.25; font-weight:400;
      max-width:200px;
    }
    .rg-single-badge {
      display:inline-flex; align-items:center; gap:4px;
      margin-top:7px; background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.2);
      padding:3px 8px; border-radius:20px;
      font-size:0.55rem; font-weight:700; color:rgba(255,255,255,0.85);
    }
    .rg-head-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; z-index:2; }
    .rg-brand-lbl { font-size:0.58rem; font-weight:800; color:rgba(255,255,255,0.45); letter-spacing:0.8px; }
    .rg-emblem svg { width:46px; height:46px; }

    /* Reg body */
    .sc-reg .card-body {
      padding:14px 15px 12px;
      display:flex; flex-direction:column; gap:11px; flex-grow:1;
      background:var(--rg-cream);
    }

    /* golden PIN panel for registration */
    .pin-panel-green {
      background: linear-gradient(120deg, #a7f3d0 0%, #d1fae5 35%, #bbf7d0 65%, #6ee7b7 100%);
      border:1px solid #6ee7b7; border-radius:8px;
      padding:9px 13px;
      box-shadow:inset 0 2px 5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);
      position:relative;
    }
    .pin-panel-green .scratch-tex {
      position:absolute; inset:0; border-radius:8px; pointer-events:none;
      background-image: repeating-linear-gradient(
        -45deg, transparent, transparent 2px,
        rgba(255,255,255,0.12) 2px, rgba(255,255,255,0.12) 4px);
    }
    .pin-panel-green .pin-lbl-inner { color:rgba(6,78,59,0.55); }
    .pin-panel-green .pin-digits {
      color:#064e3b; background:rgba(255,255,255,0.75);
      border-color:#34d399;
    }

    .rg-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .mtag.type-reg { background:#d1fae5; color:#065f46; }

    /* Reg footer — green bar with gold accent */
    .sc-reg .card-foot {
      background: linear-gradient(90deg, var(--rg-bg1), var(--rg-bg2));
      padding:8px 15px;
      display:flex; justify-content:space-between; align-items:center;
      border-top:2px solid var(--rg-gold);
    }
    .sc-reg .foot-site { font-size:0.6rem; font-weight:700; color:rgba(255,255,255,0.6); text-decoration:none; }
    .sc-reg .foot-site:hover { color:#6ee7b7; }
    .sc-reg .foot-info { font-size:0.58rem; font-weight:600; color:rgba(255,255,255,0.45); text-align:right; }
    .sc-reg .foot-single { font-size:0.63rem; font-weight:700; color:#6ee7b7; }

    /* ══════════════════════════════════════════
       EMPTY STATE
    ══════════════════════════════════════════ */
    .empty-state {
      text-align:center; padding:60px 20px;
      background:var(--white); border-radius:var(--radius);
      border:2px dashed var(--border); margin-top:6px;
    }
    .empty-icon { font-size:2.4rem; margin-bottom:10px; }
    .empty-title { font-weight:700; color:var(--text); margin-bottom:5px; font-size:0.95rem; }
    .empty-sub { color:var(--muted); font-size:0.8rem; }

    /* ══════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════ */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.45);
      backdrop-filter:blur(3px); display:none;
      align-items:center; justify-content:center; z-index:1000;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
      background:var(--white); border-radius:16px;
      box-shadow:0 24px 60px rgba(0,0,0,0.22);
      width:100%; max-width:460px; margin:16px; overflow:hidden;
    }
    .modal-head {
      background:linear-gradient(135deg,#051e36,#0b4d8a);
      padding:17px 22px; color:#fff;
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-head h2 { font-size:0.97rem; font-weight:700; }
    .modal-close {
      background:transparent; border:none; color:rgba(255,255,255,0.65);
      cursor:pointer; font-size:1.1rem; padding:2px; transition:color 0.15s;
    }
    .modal-close:hover { color:#fff; }
    .modal-body { padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
    .fg { display:flex; flex-direction:column; gap:5px; }
    .fl { font-size:0.75rem; font-weight:600; color:var(--text); }
    .fc {
      padding:9px 12px; border:1px solid var(--border);
      border-radius:7px; font-size:0.84rem; color:var(--text);
      transition:border-color 0.15s;
    }
    .fc:focus { outline:none; border-color:#0b4d8a; }
    .ferr {
      font-size:0.76rem; color:var(--red); font-weight:600;
      background:var(--red-lt); padding:8px 12px;
      border-radius:6px; border-left:3px solid var(--red); display:none;
    }
    .modal-foot {
      padding:13px 22px; border-top:1px solid var(--border);
      display:flex; justify-content:flex-end; gap:10px;
      background:var(--surface);
    }

    /* Purpose preview chips */
    .purpose-preview {
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .pp-chip {
      flex:1; min-width:120px; padding:10px 12px; border-radius:8px;
      border:2px solid var(--border); cursor:pointer; transition:all 0.15s;
      text-align:center;
    }
    .pp-chip.rc-chip { border-color:#dbeafe; background:#f0f7ff; }
    .pp-chip.rc-chip.selected { border-color:#0b4d8a; background:#dbeafe; }
    .pp-chip.rg-chip { border-color:#d1fae5; background:#f0fdf9; }
    .pp-chip.rg-chip.selected { border-color:#065f46; background:#d1fae5; }
    .pp-chip-icon { font-size:1.4rem; margin-bottom:4px; }
    .pp-chip-name { font-size:0.72rem; font-weight:700; }
    .pp-chip-desc { font-size:0.62rem; color:var(--muted); margin-top:2px; }
    input[name="genPurpose"] { display:none; }

    /* ══════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════ */
    .toast {
      position:fixed; bottom:24px; right:24px;
      padding:12px 20px; border-radius:10px;
      font-size:0.83rem; font-weight:600; color:#fff;
      box-shadow:0 8px 24px rgba(0,0,0,0.15);
      z-index:10000; display:none; transition:opacity 0.3s;
    }
    .toast.success { background:#16a34a; }
    .toast.error   { background:#dc2626; }

    /* ══════════════════════════════════════════
       PRINT
    ══════════════════════════════════════════ */
    @media print {
      .toolbar,.stats-bar,.folder-tabs,.modal-overlay,.toast,button,.page-header { display:none !important; }
      body { background:#fff; }
      .sc-result, .sc-reg { break-inside:avoid; box-shadow:none !important; border:1px solid #ccc !important; margin-bottom:14px; }
      .content-area { padding:0; }
    }
    @media (max-width:640px) {
      .page-header,.stats-bar,.toolbar,.folder-tabs { padding-left:16px; padding-right:16px; }
      .content-area { padding:14px 16px 36px; }
      .cards-grid { grid-template-columns:1fr; }
      .search-box { width:100%; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- ══ GENERATE MODAL ══════════════════════════════════════ -->
<div class="modal-overlay" id="genModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>✦ Generate Scratch Cards</h2>
      <button class="modal-close" onclick="closeModal('genModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="fl">Card Type</label>
        <div class="purpose-preview">
          <div class="pp-chip rc-chip selected" onclick="selectPurpose('Result Checker', this)">
            <div class="pp-chip-icon">🔎</div>
            <div class="pp-chip-name" style="color:#0b4d8a;">Result Checker</div>
            <div class="pp-chip-desc">3 uses per card</div>
          </div>
          <div class="pp-chip rg-chip" onclick="selectPurpose('Registration', this)">
            <div class="pp-chip-icon">📝</div>
            <div class="pp-chip-name" style="color:#065f46;">Registration</div>
            <div class="pp-chip-desc">1 use per card</div>
          </div>
        </div>
        <input type="hidden" id="genPurpose" value="Result Checker">
      </div>
      <div class="fg">
        <label class="fl">Number of Cards</label>
        <input type="number" id="genCount" class="fc" value="12" min="1" max="200">
      </div>
      <div class="fg">
        <label class="fl">PIN Length</label>
        <select id="genPinLen" class="fc">
          <option value="8">8 digits</option>
          <option value="10">10 digits</option>
          <option value="12" selected>12 digits</option>
        </select>
      </div>
      <div id="genErr" class="ferr"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('genModal')">Cancel</button>
      <button class="btn btn-primary" id="genBtn" onclick="generateCards()">Generate Cards</button>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>

<script>
let currentUser, allCards = [], activeTab = 'available';

/* ─── INIT ──────────────────────────────────────────────── */
(async () => {
  currentUser = await initAdminLayout('scratch-cards', 'Scratch Cards');
  if (!currentUser) return;
  document.getElementById('pageBody').innerHTML = buildPage();
  loadCards();
})();

function buildPage() {
  return `
  <div class="page-header">
    <div class="ph-left">
      <h1>Scratch Card <em>Management</em></h1>
      <p>Generate, distribute and track secure authentication scratch vouchers</p>
    </div>
    <div class="ph-right">
      <div class="brand-pill">EduTrac Ng</div>
      <div class="legend-row">
        <span class="legend-chip"><span class="legend-swatch" style="background:#f5a623;"></span>Result Checker (3 uses)</span>
        <span class="legend-chip"><span class="legend-swatch" style="background:#6ee7b7;"></span>Registration (1 use)</span>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="si total">📋</div><div><div class="sn total" id="stTotal">0</div><div class="sl">Total</div></div></div>
    <div class="stat-card"><div class="si avail">✅</div><div><div class="sn avail" id="stAvail">0</div><div class="sl">Available</div></div></div>
    <div class="stat-card"><div class="si inuse">🔄</div><div><div class="sn inuse" id="stInUse">0</div><div class="sl">In-Use</div></div></div>
    <div class="stat-card"><div class="si expired">⛔</div><div><div class="sn expired" id="stExpired">0</div><div class="sl">Expired</div></div></div>
  </div>

  <div class="toolbar">
    <div class="tl">
      <button class="btn btn-primary" onclick="openModal('genModal')">＋ Generate Cards</button>
      <button class="btn btn-ghost" onclick="exportCards()">⬇ Export CSV</button>
      <button class="btn btn-ghost" onclick="printCards()">🖨 Print</button>
    </div>
    <div class="tr">
      <input type="text" id="cardSearch" class="search-box" placeholder="🔍  Search serial or PIN…" oninput="renderCards()">
    </div>
  </div>

  <div class="folder-tabs">
    <button class="ftab favail active" id="tab-available" onclick="switchTab('available')">
      📂 Available <span class="tbadge" id="badge-available">0</span>
    </button>
    <button class="ftab finuse" id="tab-inuse" onclick="switchTab('inuse')">
      📁 In-Use <span class="tbadge" id="badge-inuse">0</span>
    </button>
    <button class="ftab fexpired" id="tab-expired" onclick="switchTab('expired')">
      🗂 Expired <span class="tbadge" id="badge-expired">0</span>
    </button>
  </div>

  <div class="content-area">
    <div id="cardsContent"><div style="text-align:center;padding:60px;color:#94a3b8;">Loading cards…</div></div>
  </div>`;
}

/* ─── DATA ──────────────────────────────────────────────── */
async function loadCards() {
  const { data, error } = await db.from('scratch_cards')
    .select('*, schools(name)')
    .eq('school_id', currentUser.school_id)
    .order('created_at', { ascending: false });
  if (error) { showErr(error.message); return; }
  allCards = data || [];
  updateStats();
  renderCards();
}

function cat(c) {
  if (c.is_used) return 'expired';
  if ((c.uses_count || 0) > 0) return 'inuse';
  return 'available';
}

function updateStats() {
  const t = allCards.length;
  const a = allCards.filter(c => cat(c) === 'available').length;
  const i = allCards.filter(c => cat(c) === 'inuse').length;
  const e = allCards.filter(c => cat(c) === 'expired').length;
  document.getElementById('stTotal').textContent   = t;
  document.getElementById('stAvail').textContent   = a;
  document.getElementById('stInUse').textContent   = i;
  document.getElementById('stExpired').textContent = e;
  document.getElementById('badge-available').textContent = a;
  document.getElementById('badge-inuse').textContent     = i;
  document.getElementById('badge-expired').textContent   = e;
}

/* ─── TABS ──────────────────────────────────────────────── */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${tab}`)?.classList.add('active');
  renderCards();
}

/* ─── RENDER ────────────────────────────────────────────── */
function renderCards() {
  const q = (document.getElementById('cardSearch')?.value || '').toLowerCase();
  const list = allCards.filter(c => {
    if (cat(c) !== activeTab) return false;
    if (q && !(c.serial_no||'').toLowerCase().includes(q) && !(c.pin||'').includes(q)) return false;
    return true;
  });
  const el = document.getElementById('cardsContent');
  const labels = { available:'Available Cards', inuse:'In-Use Cards', expired:'Expired / Used Cards' };
  const icons  = { available:'📭', inuse:'📋', expired:'🗂' };

  if (!list.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${icons[activeTab]}</div>
      <div class="empty-title">No ${labels[activeTab]}</div>
      <div class="empty-sub">${activeTab==='available'?'Generate a batch to get started.':'Cards will move here as their status changes.'}</div>
      ${activeTab==='available'?`<button class="btn btn-primary" style="margin-top:14px;" onclick="openModal('genModal')">＋ Generate Cards</button>`:''}
    </div>`;
    return;
  }

  el.innerHTML = `
    <div class="section-head">
      <h2>${labels[activeTab]}</h2>
      <span class="count-chip">${list.length} card${list.length!==1?'s':''}</span>
    </div>
    <div class="cards-grid">${list.slice(0,150).map(buildCard).join('')}</div>
    ${list.length>150?`<p style="text-align:center;margin-top:14px;font-size:0.73rem;color:#94a3b8;">Showing 150 of ${list.length} — export CSV for full list.</p>`:''}
  `;
}

/* ─── BUILD CARD HTML ───────────────────────────────────── */
function buildCard(card) {
  const isResult = (card.max_uses || 1) >= 3 || (card.card_type === 'result') ||
                   (card.purpose||'').toLowerCase().includes('result');
  return isResult ? buildResultCard(card) : buildRegCard(card);
}

/* Result Checker card — navy / gold */
function buildResultCard(card) {
  const school  = esc(card.schools?.name || 'School Name');
  const serial  = esc(card.serial_no || `EDU${rnd()}`);
  const pin     = fmtPin(card.pin);
  const status  = cat(card);
  const ribbon  = { available:'Active', inuse:'In Use', expired:'Used' }[status];
  const used    = card.uses_count || 0;
  const maxU    = card.max_uses || 3;
  const rem     = Math.max(0, maxU - used);
  const useTxt  = status === 'expired'
    ? (card.used_at ? `Expired ${new Date(card.used_at).toLocaleDateString('en-GB')}` : 'All uses exhausted')
    : `${rem} use${rem!==1?'s':''} remaining`;

  // 3 use-dots
  const dots = Array.from({length: maxU}, (_,i) =>
    `<div class="rc-use-dot${i < used ? ' filled' : ''}"></div>`).join('');

  return `
  <div class="sc-result">
    <div class="card-ribbon ${status}">${ribbon}</div>
    <div class="card-head">
      <div class="rc-head-left">
        <span class="rc-type-label">🔎 Result Checker</span>
        <div class="rc-school-name">${school}</div>
        <div class="rc-uses-row">${dots}</div>
      </div>
      <div class="rc-head-right">
        <span class="rc-brand-lbl">EduTrac Ng</span>
        <div class="rc-emblem">${resultEmblem()}</div>
      </div>
    </div>

    <div class="card-body">
      <div>
        <span class="field-lbl">Serial Number</span>
        <span class="serial-val">${serial}</span>
      </div>
      <div>
        <div class="pin-panel-silver">
          <div class="scratch-tex"></div>
          <div class="pin-lbl-inner">🔐 Scratch to reveal PIN</div>
          <span class="pin-digits">${pin}</span>
        </div>
      </div>
      <div class="rc-meta">
        <span class="mtag st-${status}">${status==='available'?'✓ Available':ribbon}</span>
        <span class="mtag type-result">Result Checker</span>
        <span class="mtag uses-left">Up to ${maxU} uses</span>
      </div>
    </div>

    <div class="card-foot">
      <a class="foot-site" href="https://www.edutracng.com">www.edutracng.com</a>
      <div>
        <div class="foot-uses">${useTxt}</div>
        <div class="foot-info">Valid for academic result access</div>
      </div>
    </div>
  </div>`;
}

/* Registration card — forest green / cream */
function buildRegCard(card) {
  const school  = esc(card.schools?.name || 'School Name');
  const serial  = esc(card.serial_no || `EDU${rnd()}`);
  const pin     = fmtPin(card.pin);
  const status  = cat(card);
  const ribbon  = { available:'Active', inuse:'In Use', expired:'Used' }[status];
  const useTxt  = status === 'expired'
    ? (card.used_at ? `Used ${new Date(card.used_at).toLocaleDateString('en-GB')}` : 'Used')
    : 'Single-use — not yet used';

  return `
  <div class="sc-reg">
    <div class="card-ribbon ${status}">${ribbon}</div>
    <div class="card-head">
      <div>
        <span class="rg-type-label">📝 Registration</span>
        <div class="rg-school-name">${school}</div>
        <div class="rg-single-badge">⬡ Single Use Only</div>
      </div>
      <div class="rg-head-right">
        <span class="rg-brand-lbl">EduTrac Ng</span>
        <div class="rg-emblem">${regEmblem()}</div>
      </div>
    </div>

    <div class="card-body">
      <div>
        <span class="field-lbl">Serial Number</span>
        <span class="serial-val" style="color:#064e3b;">${serial}</span>
      </div>
      <div>
        <div class="pin-panel-green">
          <div class="scratch-tex"></div>
          <div class="pin-lbl-inner">🔐 Scratch to reveal PIN</div>
          <span class="pin-digits">${pin}</span>
        </div>
      </div>
      <div class="rg-meta">
        <span class="mtag st-${status}">${status==='available'?'✓ Available':ribbon}</span>
        <span class="mtag type-reg">Registration</span>
        <span class="mtag uses-left">1 use only</span>
      </div>
    </div>

    <div class="card-foot">
      <a class="foot-site" href="https://www.edutracng.com">www.edutracng.com</a>
      <div>
        <div class="foot-single">${useTxt}</div>
        <div class="foot-info">Valid for student registration</div>
      </div>
    </div>
  </div>`;
}

/* ─── SVG EMBLEMS ───────────────────────────────────────── */
function resultEmblem() {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 4 L58 36 L92 22 L68 46 L96 50 L68 54 L92 78 L58 64 L50 96 L42 64 L8 78 L32 54 L4 50 L32 46 L8 22 L42 36 Z" fill="rgba(255,255,255,0.1)"/>
    <path d="M50 12 L56 38 L86 26 L64 47 L88 50 L64 53 L86 74 L56 62 L50 88 L44 62 L14 74 L36 53 L12 50 L36 47 L14 26 L44 38 Z" fill="#f5a623"/>
    <circle cx="50" cy="50" r="18" fill="#07305c"/>
    <text x="50" y="47" font-size="8" font-weight="bold" fill="#f5a623" text-anchor="middle" font-family="Inter,sans-serif">EDU</text>
    <text x="50" y="57" font-size="6.5" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-family="Inter,sans-serif">TRAC</text>
  </svg>`;
}

function regEmblem() {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,6 61,39 96,39 68,60 79,93 50,72 21,93 32,60 4,39 39,39" fill="rgba(255,255,255,0.1)"/>
    <polygon points="50,14 59,42 90,42 66,58 75,88 50,71 25,88 34,58 10,42 41,42" fill="#6ee7b7"/>
    <circle cx="50" cy="50" r="18" fill="#064e3b"/>
    <text x="50" y="47" font-size="8" font-weight="bold" fill="#6ee7b7" text-anchor="middle" font-family="Inter,sans-serif">EDU</text>
    <text x="50" y="57" font-size="6.5" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-family="Inter,sans-serif">TRAC</text>
  </svg>`;
}

/* ─── HELPERS ───────────────────────────────────────────── */
function fmtPin(pin) {
  if (!pin) return '****-****-****';
  const r = String(pin).replace(/[\s-]/g,'');
  if (r.length===12) return `${r.slice(0,4)}-${r.slice(4,8)}-${r.slice(8,12)}`;
  if (r.length===10) return `${r.slice(0,4)}-${r.slice(4,7)}-${r.slice(7,10)}`;
  if (r.length===8)  return `${r.slice(0,4)}-${r.slice(4,8)}`;
  return r.match(/.{1,4}/g)?.join('-')||r;
}

function rnd() { return Math.floor(Math.random()*90000+10000); }

function esc(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function selectPurpose(val, el) {
  document.querySelectorAll('.pp-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('genPurpose').value = val;
}

/* ─── GENERATE ──────────────────────────────────────────── */
async function generateCards() {
  const btn   = document.getElementById('genBtn');
  const errEl = document.getElementById('genErr');
  const count = parseInt(document.getElementById('genCount').value);
  const pinL  = parseInt(document.getElementById('genPinLen').value);
  const purp  = document.getElementById('genPurpose').value;

  errEl.style.display = 'none';
  if (!count||count<1||count>200) {
    errEl.textContent='Count must be 1–200.'; errEl.style.display='block'; return;
  }

  const {data:sd, error:se} = await db.from('schools')
    .select('can_self_generate_cards,self_generate_limit')
    .eq('id',currentUser.school_id).single();
  if (se||!sd?.can_self_generate_cards) {
    errEl.textContent='Permission denied. Contact your administrator.'; errEl.style.display='block'; return;
  }
  const lim = sd.self_generate_limit||100;
  if (count>lim) { errEl.textContent=`Batch limit is ${lim}.`; errEl.style.display='block'; return; }

  btn.disabled=true; btn.textContent='⏳ Generating…';

  const isResult = purp.toLowerCase().includes('result');
  const cardType = isResult ? 'result' : 'registration';
  const maxUses  = isResult ? 3 : 1;
  const now      = Date.now();
  const pins     = new Set();
  const batch    = [];

  for (let i=0;i<count;i++) {
    let p;
    do { p = Array.from({length:pinL},()=>Math.floor(Math.random()*10)).join(''); } while(pins.has(p));
    pins.add(p);
    batch.push({
      school_id: currentUser.school_id,
      serial_no: `EDU${String(now).slice(-7)}${String(i+1).padStart(3,'0')}`,
      pin:p, is_used:false, uses_count:0, max_uses:maxUses,
      card_type:cardType, purpose:purp,
      batch_id:`BATCH_${cardType.toUpperCase()}${String(now).slice(-6)}`,
    });
  }

  const {error} = await db.from('scratch_cards').insert(batch);
  btn.disabled=false; btn.textContent='Generate Cards';
  if (error) { errEl.textContent=error.message; errEl.style.display='block'; return; }
  closeModal('genModal');
  showToast(`${count} ${purp} card(s) generated successfully.`, 'success');
  loadCards();
}

/* ─── EXPORT / PRINT ────────────────────────────────────── */
function exportCards() {
  const rows = allCards.map(c=>[c.serial_no,c.pin,cat(c),c.purpose||'',c.used_at||'']);
  const csv  = [['Serial','PIN','Status','Purpose','Used At'],...rows]
    .map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),
    download:`edutracng_scratchcards_${new Date().toISOString().slice(0,10)}.csv`
  });
  a.click(); URL.revokeObjectURL(a.href);
}

function printCards() { window.print(); }

/* ─── MODAL HELPERS ─────────────────────────────────────── */
function openModal(id)  { document.getElementById(id)?.classList.add('open'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }

function showToast(msg, type) {
  const el = document.getElementById('toastEl');
  el.textContent=msg; el.className=`toast ${type}`;
  el.style.display='block'; el.style.opacity='1';
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>{ el.style.display='none'; },400); },3200);
}

function showErr(msg) {
  const c = document.getElementById('cardsContent');
  if(c) c.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-sub">${esc(msg)}</div></div>`;
}

window.closeModal=closeModal; window.openModal=openModal;
window.generateCards=generateCards; window.exportCards=exportCards;
window.printCards=printCards; window.switchTab=switchTab;
window.selectPurpose=selectPurpose;
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../js/assistant.js"></script>
<script src="../assets/js/theme-switcher.js"></script>
</body>
</html>
