<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Fee Management · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .fee-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
    .fee-head{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
    .fee-head h3{font-size:.95rem;font-weight:700;margin:0;}
    .fee-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border);font-size:.845rem;}
    .fee-row:last-child{border-bottom:none;}
    .kpi-sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
    .kpi-sm-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
    .kpi-sm-val{font-size:1.4rem;font-weight:900;}
    .kpi-sm-lbl{font-size:.7rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
    .section-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:.68rem;font-weight:700;letter-spacing:.02em;}
    .section-badge.nursery{background:#fce7f3;color:#be185d;}
    .section-badge.primary{background:#dbeafe;color:#1d4ed8;}
    .section-badge.junior{background:#dcfce7;color:#15803d;}
    .section-badge.senior{background:#fef3c7;color:#b45309;}
    .section-badge.vocational{background:#ede9fe;color:#7c3aed;}
    .section-badge.all{background:var(--surface-3);color:var(--ink-3);}
    .student-section-hint{font-size:.72rem;color:var(--ink-3);margin-top:4px;padding:6px 10px;background:var(--surface-2);border-radius:6px;display:none;}
    .fee-section-group{margin-bottom:4px;}
    .fee-section-header{padding:7px 18px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2);color:var(--ink-3);border-bottom:1px solid var(--border);}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Add/Edit Fee Type Modal -->
<div class="modal" id="feeModal">
  <div class="modal__box" style="max-width:500px;">
    <div class="modal__header">
      <h2 class="modal__title" id="feeModalTitle">Add Fee Type</h2>
      <button class="modal__close" onclick="closeModal('feeModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="feeId">
      <div class="form-grid">
        <div class="form-group col-full">
          <label class="form-label">Fee Name <span class="required">*</span></label>
          <input type="text" id="feeName" class="form-control" placeholder="e.g. School Fees, PTA Levy, Development Levy">
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₦) <span class="required">*</span></label>
          <input type="number" id="feeAmount" class="form-control" placeholder="e.g. 50000" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">Term <span class="required">*</span></label>
          <select id="feeTerm" class="form-control"><option value="">— Select Term —</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">School Section</label>
          <select id="feeSection" class="form-control" onchange="onSectionChange()">
            <option value="">All Sections</option>
            <option value="nursery">🌱 Nursery / Early Years</option>
            <option value="primary">📚 Primary</option>
            <option value="junior">🏫 Junior Secondary (JSS)</option>
            <option value="senior">🎓 Senior Secondary (SSS)</option>
            <option value="vocational">🔧 Vocational / Technical</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Specific Class <span style="color:var(--ink-3);font-weight:400;">(optional)</span></label>
          <select id="feeClass" class="form-control"><option value="">All Classes in Section</option></select>
        </div>
      </div>
      <div id="feeSectionHint" style="font-size:.78rem;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin-top:8px;display:none;">
        💡 This fee will only apply to students in the selected section. You can create multiple fee types with the same name but different amounts for each section.
      </div>
      <div id="feeFormErr" class="form-error" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('feeModal')">Cancel</button>
      <button class="btn btn--primary" id="saveFeeBtn" onclick="saveFeeType()">Save Fee Type</button>
    </div>
  </div>
</div>

<!-- Record Payment Modal -->
<div class="modal" id="payModal">
  <div class="modal__box" style="max-width:520px;">
    <div class="modal__header">
      <h2 class="modal__title">Record Payment</h2>
      <button class="modal__close" onclick="closeModal('payModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="form-grid">
        <div class="form-group col-full">
          <label class="form-label">Student <span class="required">*</span></label>
          <select id="payStudent" class="form-control" onchange="onStudentChange()"><option value="">— Select Student —</option></select>
          <div id="studentSectionHint" class="student-section-hint"></div>
        </div>
        <div class="form-group col-full">
          <label class="form-label">Fee Type</label>
          <select id="payFeeType" class="form-control" onchange="onFeeTypeChange()"><option value="">— Select fee type —</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount Paid (₦) <span class="required">*</span></label>
          <input type="number" id="payAmount" class="form-control" placeholder="0.00" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select id="payMethod" class="form-control">
            <option value="cash">Cash</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="card">Card</option>
            <option value="pos">POS</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="payDate" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Reference No.</label>
          <input type="text" id="payRef" class="form-control" placeholder="Optional">
        </div>
        <div class="form-group col-full">
          <label class="form-label">Notes</label>
          <input type="text" id="payNotes" class="form-control" placeholder="Optional">
        </div>
      </div>
      <div id="payFormErr" class="form-error" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('payModal')">Cancel</button>
      <button class="btn btn--primary" id="savePayBtn" onclick="savePayment()">Record Payment</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, feeTypes = [], classes = [], terms = [], students = [], currentTerm, payments = [];

function fmt(n) { return '₦' + Number(n||0).toLocaleString('en-NG'); }

// ── Section detection helpers ──────────────────────────────────
const SECTION_PATTERNS = {
  nursery:    /nursery|creche|kg|kindergarten|pre[\s-]?school|early|reception|playgroup/i,
  primary:    /primary|pry|basic|elementary|std\s*\d/i,
  junior:     /jss|j\.?s\.?s|junior|jnr|jhs|middle/i,
  senior:     /sss|s\.?s\.?s|senior|snr|shs|a[\s-]?level|form\s*[456]/i,
  vocational: /voc|tech|vocational|technical|trade|craft|nce|polytechnic/i,
};
const SECTION_LABELS = {
  nursery: 'Nursery / Early Years',
  primary: 'Primary',
  junior: 'Junior Secondary (JSS)',
  senior: 'Senior Secondary (SSS)',
  vocational: 'Vocational / Technical',
};
const SECTION_COLORS = {
  nursery: 'nursery', primary: 'primary', junior: 'junior',
  senior: 'senior', vocational: 'vocational',
};

function detectSection(level, name) {
  const text = (level || '') + ' ' + (name || '');
  for (const [key, pattern] of Object.entries(SECTION_PATTERNS)) {
    if (pattern.test(text)) return key;
  }
  return null; // undetected → "all"
}

function getSectionBadge(section) {
  if (!section) return '<span class="section-badge all">All Sections</span>';
  const label = SECTION_LABELS[section] || section;
  const cls = SECTION_COLORS[section] || 'all';
  return `<span class="section-badge ${cls}">${label}</span>`;
}

// Returns which section a fee type belongs to, based on linked class level
function getFeeSection(ft) {
  if (!ft.class_id || !ft.classes) return null;
  return detectSection(ft.classes.level, ft.classes.name);
}

// ── Init ───────────────────────────────────────────────────────
(async () => {
  currentUser = await initAdminLayout('fees', 'Fee Management');
  if (!currentUser) return;
  const sid = currentUser.school_id;

  const [{ data: cls }, { data: trm }, { data: stu }] = await Promise.all([
    db.from('classes').select('id,name,level').eq('school_id', sid).order('name'),
    db.from('terms').select('*').eq('school_id', sid).order('created_at', { ascending: false }),
    db.from('students').select('id,full_name,admission_no,enrollments(class_id,classes(name,level))').eq('school_id', sid).eq('is_active', true).order('full_name'),
  ]);
  classes = cls || []; terms = trm || []; students = stu || [];
  currentTerm = terms.find(t => t.is_current) || terms[0];

  // Populate static selects
  document.getElementById('feeTerm').innerHTML =
    '<option value="">— Select Term —</option>' +
    terms.map(t => `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>${t.name}${t.academic_year ? ' · ' + t.academic_year : ''}</option>`).join('');

  document.getElementById('payStudent').innerHTML =
    '<option value="">— Select Student —</option>' +
    students.map(s => `<option value="${s.id}">${s.full_name} (${s.admission_no || '—'})</option>`).join('');

  document.getElementById('payDate').value = new Date().toISOString().slice(0, 10);

  // Build class dropdown (all)
  populateFeeClassDropdown('');

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;">
      <div>
        <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Fee Management</h1>
        <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">${currentTerm ? currentTerm.name : 'No active term'} &mdash; Different sections pay different amounts</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn--secondary btn--sm" onclick="openAddFee()">+ Add Fee Type</button>
        <button class="btn btn--primary btn--sm" onclick="openRecordPayment()">+ Record Payment</button>
      </div>
    </div>
    <div class="kpi-sm" id="feeSummary">
      <div class="kpi-sm-box"><div class="kpi-sm-val" id="kpiExpected">—</div><div class="kpi-sm-lbl">Total Expected</div></div>
      <div class="kpi-sm-box"><div class="kpi-sm-val" id="kpiCollected" style="color:#16a34a;">—</div><div class="kpi-sm-lbl">Collected</div></div>
      <div class="kpi-sm-box"><div class="kpi-sm-val" id="kpiOutstanding" style="color:#dc2626;">—</div><div class="kpi-sm-lbl">Outstanding</div></div>
      <div class="kpi-sm-box"><div class="kpi-sm-val" id="kpiRate" style="color:#2563eb;">—</div><div class="kpi-sm-lbl">Collection Rate</div></div>
    </div>
    <div id="feeContent">Loading…</div>
  `;
  loadFees();
})();

// ── Populate class dropdown filtered by section ────────────────
function populateFeeClassDropdown(sectionKey) {
  let filtered = classes;
  if (sectionKey) {
    filtered = classes.filter(c => detectSection(c.level, c.name) === sectionKey);
    if (!filtered.length) filtered = classes; // fallback if no classes match
  }
  document.getElementById('feeClass').innerHTML =
    '<option value="">All Classes in Section</option>' +
    filtered.map(c => {
      const sec = detectSection(c.level, c.name);
      const secLabel = sec ? ` [${SECTION_LABELS[sec] || sec}]` : '';
      return `<option value="${c.id}">${c.name}${c.level ? ' · ' + c.level : ''}${secLabel}</option>`;
    }).join('');
}

// ── Section change in fee modal ────────────────────────────────
function onSectionChange() {
  const sec = document.getElementById('feeSection').value;
  populateFeeClassDropdown(sec);
  document.getElementById('feeSectionHint').style.display = sec ? 'block' : 'none';
}

// ── Load & render fees ─────────────────────────────────────────
async function loadFees() {
  const sid = currentUser.school_id;
  showLoader('#feeContent', 'Loading fee data…');

  const [{ data: ft, error: ftErr }, { data: pmt, error: pmtErr }] = await Promise.all([
    db.from('fee_types').select('*,classes(name,level),terms(name)').eq('school_id', sid).order('created_at'),
    db.from('payments').select('*,students(full_name,admission_no),fee_types(name)').eq('school_id', sid).order('paid_at', { ascending: false }).limit(50),
  ]);

  if (ftErr) { showError('#feeContent', 'Failed to load fee types: ' + ftErr.message); return; }
  if (pmtErr) { showError('#feeContent', 'Failed to load payments: ' + pmtErr.message); return; }

  feeTypes = ft || []; payments = pmt || [];

  // Rebuild pay fee type dropdown (smart — grouped by section)
  rebuildPayFeeTypeDropdown();

  const totalExpected = feeTypes.reduce((s, f) => s + Number(f.amount || 0), 0);
  const totalCollected = payments.reduce((s, p) => s + Number(p.amount_paid || 0), 0);
  const outstanding = Math.max(0, totalExpected - totalCollected);
  const rate = totalExpected > 0 ? Math.round(totalCollected / totalExpected * 100) : 0;
  document.getElementById('kpiExpected').textContent = fmt(totalExpected);
  document.getElementById('kpiCollected').textContent = fmt(totalCollected);
  document.getElementById('kpiOutstanding').textContent = fmt(outstanding);
  document.getElementById('kpiRate').textContent = rate + '%';

  // Group fee types by section for display
  const sectionOrder = ['nursery', 'primary', 'junior', 'senior', 'vocational', null];
  const grouped = {};
  feeTypes.forEach(f => {
    const sec = getFeeSection(f);
    if (!grouped[sec]) grouped[sec] = [];
    grouped[sec].push(f);
  });

  let feeRowsHtml = '';
  sectionOrder.forEach(sec => {
    const group = grouped[sec] || [];
    if (!group.length) return;
    const headerLabel = sec ? SECTION_LABELS[sec] : 'All Sections (General)';
    const badge = getSectionBadge(sec);
    feeRowsHtml += `<div class="fee-section-header">${badge} &nbsp;${headerLabel}</div>`;
    feeRowsHtml += group.map(f => `
      <div class="fee-row">
        <div>
          <div style="font-weight:600;">${f.name}</div>
          <div style="font-size:.75rem;color:var(--ink-3);">
            ${f.classes?.name || 'All Classes'} · ${f.terms?.name || '—'}
          </div>
        </div>
        <div style="font-weight:800;font-size:.95rem;color:var(--primary);">${fmt(f.amount)}</div>
        <div style="display:flex;gap:4px;">
          <button class="btn btn--ghost btn--sm" title="Edit" onclick="editFee('${f.id}')">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="btn btn--ghost btn--sm" style="color:var(--danger);" title="Delete" onclick="deleteFee('${f.id}','${f.name.replace(/'/g, "\\'")}')">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>`).join('');
  });

  document.getElementById('feeContent').innerHTML = `
    <div class="fee-card">
      <div class="fee-head">
        <h3>Fee Types <span style="font-size:.72rem;color:var(--ink-3);font-weight:400;">(grouped by section)</span></h3>
        <button class="btn btn--secondary btn--sm" onclick="openAddFee()">+ Add</button>
      </div>
      ${feeTypes.length ? feeRowsHtml : '<div style="padding:20px;text-align:center;color:var(--ink-3);">No fee types set up. Click "+ Add" to create fees per section.</div>'}
    </div>
    <div class="fee-card">
      <div class="fee-head">
        <h3>Recent Payments</h3>
        <button class="btn btn--secondary btn--sm" onclick="openRecordPayment()">+ Record</button>
      </div>
      ${payments.length ? `
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:.845rem;">
            <thead><tr style="background:var(--surface-2);">
              ${['Student','Fee Type','Amount','Method','Date',''].map(h => `<th style="padding:9px 14px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--border);">${h}</th>`).join('')}
            </tr></thead>
            <tbody>${payments.slice(0, 30).map(p => `
              <tr style="border-bottom:1px solid var(--border);">
                <td style="padding:10px 14px;">
                  <div style="font-weight:600;">${p.students?.full_name || '—'}</div>
                  <div style="font-size:.72rem;color:var(--ink-3);">${p.students?.admission_no || ''}</div>
                </td>
                <td style="padding:10px 14px;font-size:.78rem;color:var(--ink-3);">${p.fee_types?.name || '—'}</td>
                <td style="padding:10px 14px;font-weight:800;color:#16a34a;">${fmt(p.amount_paid)}</td>
                <td style="padding:10px 14px;">
                  <span style="background:var(--surface-3);padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600;">${p.payment_method || '—'}</span>
                </td>
                <td style="padding:10px 14px;font-size:.78rem;color:var(--ink-3);">${p.paid_at || '—'}</td>
                <td style="padding:10px 14px;">
                  <button class="btn btn--ghost btn--sm" style="color:var(--danger);" onclick="deletePayment('${p.id}')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                  </button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<div style="padding:20px;text-align:center;color:var(--ink-3);">No payments recorded yet.</div>'}
    </div>
  `;
}

// ── Rebuild payFeeType dropdown (grouped by section) ───────────
function rebuildPayFeeTypeDropdown(filterSection) {
  const sectionOrder = ['nursery', 'primary', 'junior', 'senior', 'vocational', null];
  const grouped = {};
  feeTypes.forEach(f => {
    const sec = getFeeSection(f);
    if (!grouped[sec]) grouped[sec] = [];
    grouped[sec].push(f);
  });

  let html = '<option value="">— Select fee type —</option>';
  sectionOrder.forEach(sec => {
    const group = grouped[sec] || [];
    if (!group.length) return;
    // If filterSection provided, highlight matching section fees
    const isMatch = filterSection && sec === filterSection;
    const label = sec ? SECTION_LABELS[sec] : 'All Sections';
    html += `<optgroup label="${isMatch ? '⭐ ' : ''}${label}">`;
    group.forEach(f => {
      html += `<option value="${f.id}" data-amount="${f.amount}" data-section="${sec || ''}">${f.name}${f.classes?.name ? ' (' + f.classes.name + ')' : ''} — ${fmt(f.amount)}</option>`;
    });
    html += '</optgroup>';
  });
  document.getElementById('payFeeType').innerHTML = html;

  // Auto-select first fee matching student's section
  if (filterSection) {
    const matching = feeTypes.find(f => getFeeSection(f) === filterSection);
    if (matching) {
      document.getElementById('payFeeType').value = matching.id;
      onFeeTypeChange();
    }
  }
}

// ── Student change in pay modal ────────────────────────────────
function onStudentChange() {
  const stuId = document.getElementById('payStudent').value;
  const hint = document.getElementById('studentSectionHint');
  if (!stuId) { hint.style.display = 'none'; rebuildPayFeeTypeDropdown(); return; }

  const stu = students.find(s => s.id === stuId);
  if (!stu) { hint.style.display = 'none'; return; }

  // Detect student's section from most recent enrollment
  const enrollment = stu.enrollments?.[0];
  const cls = enrollment?.classes;
  const section = cls ? detectSection(cls.level, cls.name) : null;
  const sectionLabel = section ? SECTION_LABELS[section] : null;

  if (cls) {
    const badge = getSectionBadge(section);
    hint.innerHTML = `📍 ${cls.name}${sectionLabel ? ' &mdash; ' + badge : ''} &mdash; Showing matching fee types first`;
    hint.style.display = 'block';
  } else {
    hint.innerHTML = `⚠️ Student not enrolled in any class this term — showing all fee types`;
    hint.style.display = 'block';
  }

  rebuildPayFeeTypeDropdown(section);
}

// ── Fee type change → auto-fill amount ────────────────────────
function onFeeTypeChange() {
  const sel = document.getElementById('payFeeType');
  const opt = sel.selectedOptions[0];
  if (opt?.dataset.amount) {
    document.getElementById('payAmount').value = opt.dataset.amount;
  }
}

// ── Open add fee modal ─────────────────────────────────────────
function openAddFee() {
  document.getElementById('feeModalTitle').textContent = 'Add Fee Type';
  document.getElementById('feeId').value = '';
  ['feeName', 'feeAmount'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('feeSection').value = '';
  document.getElementById('feeClass').value = '';
  document.getElementById('feeTerm').value = currentTerm?.id || '';
  document.getElementById('feeFormErr').style.display = 'none';
  document.getElementById('feeSectionHint').style.display = 'none';
  populateFeeClassDropdown('');
  openModal('feeModal');
}

// ── Edit fee ───────────────────────────────────────────────────
function editFee(id) {
  const f = feeTypes.find(x => x.id === id); if (!f) return;
  document.getElementById('feeModalTitle').textContent = 'Edit Fee Type';
  document.getElementById('feeId').value = f.id;
  document.getElementById('feeName').value = f.name || '';
  document.getElementById('feeAmount').value = f.amount || '';
  document.getElementById('feeTerm').value = f.term_id || '';
  document.getElementById('feeFormErr').style.display = 'none';

  // Restore section selector
  const sec = getFeeSection(f);
  document.getElementById('feeSection').value = sec || '';
  document.getElementById('feeSectionHint').style.display = sec ? 'block' : 'none';
  populateFeeClassDropdown(sec || '');
  document.getElementById('feeClass').value = f.class_id || '';
  openModal('feeModal');
}

// ── Save fee type ──────────────────────────────────────────────
async function saveFeeType() {
  const btn = document.getElementById('saveFeeBtn');
  const errEl = document.getElementById('feeFormErr');
  const name = document.getElementById('feeName').value.trim();
  const amount = parseFloat(document.getElementById('feeAmount').value);
  const termId = document.getElementById('feeTerm').value;

  if (!name) { errEl.textContent = 'Fee name required.'; errEl.style.display = 'block'; return; }
  if (!amount || amount <= 0) { errEl.textContent = 'Valid amount required.'; errEl.style.display = 'block'; return; }
  if (!termId) { errEl.textContent = 'Select a term.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = {
    school_id: currentUser.school_id, name, amount, term_id: termId,
    class_id: document.getElementById('feeClass').value || null,
  };
  const id = document.getElementById('feeId').value;
  const { error } = id
    ? await db.from('fee_types').update(payload).eq('id', id)
    : await db.from('fee_types').insert(payload);
  btn.disabled = false; btn.textContent = 'Save Fee Type';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('feeModal');
  toast(id ? 'Fee updated.' : 'Fee type added.', 'success');
  loadFees();
}

// ── Delete fee ─────────────────────────────────────────────────
async function deleteFee(id, name) {
  if (!confirm(`Delete fee type "${name}"?`)) return;
  const { error } = await db.from('fee_types').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Fee type deleted.', 'success');
  loadFees();
}

// ── Open payment modal ─────────────────────────────────────────
function openRecordPayment() {
  document.getElementById('payStudent').value = '';
  document.getElementById('payAmount').value = '';
  document.getElementById('payMethod').value = 'cash';
  document.getElementById('payDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('payRef').value = '';
  document.getElementById('payNotes').value = '';
  document.getElementById('payFeeType').value = '';
  document.getElementById('payFormErr').style.display = 'none';
  document.getElementById('studentSectionHint').style.display = 'none';
  rebuildPayFeeTypeDropdown();
  openModal('payModal');
}

// ── Save payment ───────────────────────────────────────────────
async function savePayment() {
  const btn = document.getElementById('savePayBtn');
  const errEl = document.getElementById('payFormErr');
  const stuId = document.getElementById('payStudent').value;
  const amount = parseFloat(document.getElementById('payAmount').value);
  if (!stuId) { errEl.textContent = 'Select a student.'; errEl.style.display = 'block'; return; }
  if (!amount || amount <= 0) { errEl.textContent = 'Valid amount required.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = {
    school_id: currentUser.school_id,
    student_id: stuId,
    amount_paid: amount,
    payment_method: document.getElementById('payMethod').value,
    reference: document.getElementById('payRef').value.trim() || null,
    notes: document.getElementById('payNotes').value.trim() || null,
    fee_type_id: document.getElementById('payFeeType').value || null,
    received_by: currentUser.id,
  };
  const { error } = await db.from('payments').insert(payload);
  btn.disabled = false; btn.textContent = 'Record Payment';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('payModal');
  toast('Payment recorded.', 'success');
  loadFees();
}

// ── Delete payment ─────────────────────────────────────────────
async function deletePayment(id) {
  if (!confirm('Delete this payment record?')) return;
  const { error } = await db.from('payments').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Payment deleted.', 'success');
  loadFees();
}
