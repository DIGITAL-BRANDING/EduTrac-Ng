
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduTrack NG">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>EduTrack NG — Settings</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    /* ── Shared ── */
    .combo-card{border:2px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:var(--transition);margin-bottom:10px;}
    .combo-card:hover{border-color:var(--primary);}
    .combo-card.selected{background:var(--primary-light);}
    .combo-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
    .subject-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:600;margin:3px;border:1.5px solid var(--border);cursor:pointer;transition:var(--transition);user-select:none;}
    .subject-chip.core{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
    .subject-chip.elective{background:var(--info-light);border-color:var(--info);color:var(--info);}
    .subject-chip.unassigned{background:var(--surface-3);color:var(--ink-3);border-color:var(--border);}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
    .toggle-row:last-child{border-bottom:none;}
    .toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .slider{position:absolute;cursor:pointer;inset:0;background:var(--border-2);border-radius:24px;transition:.3s;}
    .slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s;}
    .toggle input:checked+.slider{background:var(--primary);}
    .toggle input:checked+.slider:before{transform:translateX(20px);}
    .upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:var(--transition);}
    .upload-zone:hover{border-color:var(--primary);background:var(--primary-light);}
    .no-term-banner{background:var(--warning-light,#fffbeb);border:1.5px solid var(--warning,#f59e0b);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--warning-dark,#92400e);}
    .no-term-banner strong{font-weight:700;}
    .no-term-banner a{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline;}
    /* ── Program / Level hierarchy ── */
    .prog-card{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .prog-card__head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-3);cursor:pointer;gap:8px;}
    .prog-card__head:hover{background:var(--primary-light);}
    .prog-card__body{padding:12px 14px;border-top:1px solid var(--border);display:none;}
    .prog-card__body.open{display:block;}
    .level-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;margin-bottom:4px;background:var(--surface-3);}
    .level-row:hover{background:var(--primary-light);}
    .class-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:600;background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);margin:2px;}
    /* ── Edit modal ── */
    .edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:center;justify-content:center;}
    .edit-overlay.active{display:flex;}
    .edit-box{background:var(--surface,#fff);border-radius:14px;padding:24px;width:min(480px,94vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .edit-box h3{margin:0 0 16px;font-size:16px;}
  </style>
</head>
<body>
<div id="app"></div>
<!-- Edit modal (shared) -->
<div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="edit-box" id="editBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────
let currentUser, terms=[], gradingScale=[], dashSettings={};

// ── BOOT ──────────────────────────────────────────────────────
(async()=>{
  currentUser = await initAdminLayout('settings','Settings');
  if(!currentUser) return;
  await loadAll();
  renderPage();
})();

// ── School-type helpers ────────────────────────────────────────
function getSchoolType(){ return currentUser?.schools?.school_type || window._schoolType || 'o_level'; }
function getPeriodLabel(){ const t=getSchoolType(); return (t==='tertiary'||t==='vocational')?'Semester':'Term'; }
function getSessionLabel(){ const t=getSchoolType(); return t==='tertiary'?'Academic Year':'Academic Session'; }

// Levels available per school type (used to build dynamic dropdowns)
const LEVEL_PRESETS = {
  o_level:    ['Pre-Primary','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3'],
  vocational: ['Basic Tech 1','Basic Tech 2','Vocational Level 1','Vocational Level 2','Vocational Level 3'],
  islamic:    ['Nursery','Primary 1','Primary 2','Primary 3','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3','Tahfiz Year 1','Tahfiz Year 2','Tahfiz Year 3'],
  tertiary:   ['Pre-ND','ND I','ND II','HND I','HND II','Year 1','Year 2','Year 3','Year 4','Year 5','Postgraduate'],
};

function getLevelsForType(){ return LEVEL_PRESETS[getSchoolType()] || LEVEL_PRESETS.o_level; }

// ── RENDER PAGE ───────────────────────────────────────────────
function renderPage(){
  const pl = getPeriodLabel(); const sl = getSessionLabel();
  document.getElementById('pageBody').innerHTML=`
    <div class="page-header"><h1>Settings</h1><p>School identity, academic sessions, grading and portal controls</p></div>
    <div class="tabs" style="overflow-x:auto;white-space:nowrap;">
      <button class="tab active" onclick="showTab('school',this)">${tabIcon('school')}School &amp; Logo</button>
      <button class="tab" onclick="showTab('academic',this)">${tabIcon('programs')}Academic Structure</button>
      <button class="tab" onclick="showTab('terms',this)">${tabIcon('terms')}${sl}</button>
      <button class="tab" onclick="showTab('grading',this)">${tabIcon('grading')}Grading</button>
      <button class="tab" onclick="showTab('exams',this)">${tabIcon('exams')}Exam Components</button>
      <button class="tab" onclick="showTab('portals',this)">${tabIcon('portals')}Portal Controls</button>
      <button class="tab" onclick="showTab('stuaccounts',this)">${tabIcon('students')}Student Logins</button>
    </div>
    <div id="settingsContent"></div>`;
  renderSchool();
}

function renderAcademicPointer(){
  document.getElementById('settingsContent').innerHTML = `
    <div class="card" style="max-width:640px;text-align:center;padding:40px 32px;">
      <div style="width:56px;height:56px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <h3 style="font-size:18px;font-weight:800;margin:0 0 8px;">Programmes, Levels, Classes, Subjects &amp; Combinations</h3>
      <p style="font-size:14px;color:var(--ink-3);line-height:1.7;margin:0 0 22px;">
        All academic structure settings now live together on one page, so it's easier to set everything up in order:
        create your <strong>Programmes</strong>, add <strong>Levels</strong> to each, build your <strong>Classes</strong>,
        manage your master <strong>Subjects</strong> list, and group subjects into <strong>Combinations</strong> like Science, Art and Commercial.
      </p>
      <a href="programs.html" class="btn btn--primary">
        Open Academic Structure
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>`;
}

function tabIcon(id){
  const icons={
    school: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>`,
    programs:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
    terms:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    grading:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,
    exams:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    portals:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
    students:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  };
  return icons[id]||'';
}

function trashIcon(){ return `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`; }
function editIcon(){ return `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`; }

async function showTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('settingsContent').innerHTML='<div style="padding:24px;text-align:center;color:var(--ink-3);">Loading…</div>';
  await ({school:renderSchool,academic:renderAcademicPointer,terms:renderTerms,grading:renderGrading,
    exams:renderExams,portals:renderPortalControls,stuaccounts:renderStudentAccounts})[tab]?.();
}

async function loadAll(){
  const[{data:trm},{data:scale},{data:dash}]=await Promise.all([
    db.from('terms').select('*').eq('school_id',currentUser.school_id).order('created_at',{ascending:false}),
    db.from('grading_scales').select('*').eq('school_id',currentUser.school_id).order('min_score',{ascending:false}),
    db.from('dashboard_settings').select('*').eq('school_id',currentUser.school_id).maybeSingle(),
  ]);
  terms=trm||[]; gradingScale=scale||[]; dashSettings=dash||{};
}

// ── TERM HELPERS ──────────────────────────────────────────────
function getCurrentTerm(){ return terms.find(t=>t.is_current)||null; }
function noTermBanner(msg=''){
  const label=getPeriodLabel().toLowerCase();
  const base=msg||`No active ${label} is set. You must <a onclick="showTab('terms',document.querySelectorAll('.tab')[5])">activate a ${label}</a> before proceeding.`;
  return `<div class="no-term-banner"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> <span>${base}</span></div>`;
}
function requireCurrentTerm(actionLabel='this action'){
  if(getCurrentTerm()) return true;
  toast(`Activate a ${getPeriodLabel().toLowerCase()} first before ${actionLabel}.`,'warning');
  return false;
}

// ── EDIT MODAL ────────────────────────────────────────────────
function openEdit(html){ document.getElementById('editBox').innerHTML=html; document.getElementById('editOverlay').classList.add('active'); }
function closeEdit(){ document.getElementById('editOverlay').classList.remove('active'); }

// ═══════════════════════════════════════════════════════════════
//  TAB 1 — SCHOOL & LOGO
// ═══════════════════════════════════════════════════════════════
function renderSchool(){
  const s=currentUser.schools||{};
  document.getElementById('settingsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:860px;">
      <div class="card">
        <div class="card__header"><span class="card__title">School Logo</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
          <div id="logoPreview" style="width:100px;height:100px;border-radius:14px;overflow:hidden;border:2px solid var(--border);background:var(--surface-3);display:flex;align-items:center;justify-content:center;">
            ${s.logo_url?`<img src="${s.logo_url}" style="width:100%;height:100%;object-fit:cover;">`:'<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>'}
          </div>
          <div class="upload-zone" style="width:100%;" onclick="document.getElementById('logoFile').click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div style="font-size:14px;font-weight:600;margin-top:6px;">Upload Logo</div>
            <div style="font-size:12px;color:var(--ink-3);">PNG, JPG up to 2MB</div>
          </div>
          <input type="file" id="logoFile" accept="image/*" style="display:none;" onchange="handleLogoUpload(this)">
          ${s.logo_url?`<button class="btn btn--ghost btn--sm btn--full" onclick="removeLogo()">Remove Logo</button>`:''}
        </div>
        <div id="logoProgress" style="display:none;margin-top:12px;">
          <div class="progress-bar"><div class="progress-bar__fill" id="logoBar" style="width:0%;"></div></div>
          <p id="logoStatus" style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:4px;"></p>
        </div>
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title">School Profile</span></div>
        <div class="form-group"><label class="form-label">School Name</label><input id="scName" class="form-control" value="${s.name||''}"></div>
        <div class="form-group"><label class="form-label">Phone</label><input id="scPhone" class="form-control" value="${s.phone||''}"></div>
        <div class="form-group"><label class="form-label">Email</label><input id="scEmail" type="email" class="form-control" value="${s.email||''}"></div>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">State</label><input id="scState" class="form-control" value="${s.state||''}"></div>
          <div class="form-group"><label class="form-label">LGA</label><input id="scLga" class="form-control" value="${s.lga||''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Address</label><input id="scAddress" class="form-control" value="${s.address||''}"></div>
        <div class="form-group"><label class="form-label">Motto</label><input id="scMotto" class="form-control" value="${s.motto||''}"></div>
        <div class="form-group">
          <label class="form-label">School Type <span class="required">*</span></label>
          <select id="scType" class="form-control" onchange="onSchoolTypeChange(this.value)">
            <option value="o_level"   ${(s.school_type||'o_level')==='o_level'  ?'selected':''}>O-Level — Primary / Secondary School</option>
            <option value="vocational"${s.school_type==='vocational'?'selected':''}>Vocational / Technical School</option>
            <option value="islamic"   ${s.school_type==='islamic'   ?'selected':''}>Islamic Institute / Madrasa</option>
            <option value="tertiary"  ${s.school_type==='tertiary'  ?'selected':''}>Tertiary — College / Polytechnic / University</option>
          </select>
          <p style="font-size:11px;color:var(--ink-3);margin-top:5px;">Determines whether the system uses <strong>Terms</strong> or <strong>Semesters</strong>, and which level options appear throughout.</p>
        </div>
        <button class="btn btn--primary btn--full" onclick="saveSchool()">Save Profile</button>
      </div>
    </div>`;
}

function onSchoolTypeChange(val){
  window._schoolType = val;
  // Refresh tab label for Academic Session
  const sl = getSessionLabel();
  const tabsEl = document.querySelectorAll('.tab');
  if(tabsEl[5]) tabsEl[5].innerHTML = tabIcon('terms') + sl;
}

async function handleLogoUpload(input){
  const file=input.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Select an image file.','error'); return; }
  if(file.size>2097152){ toast('Image must be under 2MB.','error'); return; }
  document.getElementById('logoProgress').style.display='block';
  document.getElementById('logoBar').style.width='30%';
  document.getElementById('logoStatus').textContent='Uploading…';
  try{
    const ext=file.name.split('.').pop();
    const path=`logos/school-${currentUser.school_id}.${ext}`;
    const{error:upErr}=await db.storage.from('school-assets').upload(path,file,{upsert:true});
    if(upErr) throw upErr;
    document.getElementById('logoBar').style.width='70%';
    const{data:urlData}=db.storage.from('school-assets').getPublicUrl(path);
    const logoUrl=urlData.publicUrl+'?t='+Date.now();
    await db.from('schools').update({logo_url:urlData.publicUrl}).eq('id',currentUser.school_id);
    document.getElementById('logoBar').style.width='100%';
    document.getElementById('logoStatus').textContent='Uploaded!';
    document.getElementById('logoPreview').innerHTML=`<img src="${logoUrl}" style="width:100%;height:100%;object-fit:cover;">`;
    const icon=document.querySelector('.sidebar__logo-icon');
    if(icon) icon.innerHTML=`<img src="${logoUrl}" style="width:36px;height:36px;border-radius:7px;object-fit:cover;">`;
    toast('Logo uploaded!','success');
    setTimeout(()=>document.getElementById('logoProgress').style.display='none',2000);
  }catch(err){
    document.getElementById('logoStatus').textContent='Failed: '+err.message;
    toast('Upload failed. Ensure a "school-assets" storage bucket exists in Supabase.','error');
  }
}
async function removeLogo(){
  if(!confirm('Remove logo?')) return;
  await db.from('schools').update({logo_url:null}).eq('id',currentUser.school_id);
  toast('Logo removed.','success'); renderSchool();
}
async function saveSchool(){
  const{error}=await db.from('schools').update({
    name:document.getElementById('scName').value,
    phone:document.getElementById('scPhone').value,
    email:document.getElementById('scEmail').value,
    state:document.getElementById('scState').value,
    lga:document.getElementById('scLga').value,
    address:document.getElementById('scAddress').value,
    motto:document.getElementById('scMotto').value,
    school_type:document.getElementById('scType').value,
  }).eq('id',currentUser.school_id);
  if(error){toast(error.message,'error');return;}
  // Update local cache so other tabs see the new type immediately

}

function renderTerms(){

    <div style="max-width:900px;">
      <!-- Active status -->
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;background:${currentTerm?'var(--success-light,#f0fdf4)':'var(--warning-light,#fffbeb)'};border:1.5px solid ${currentTerm?'var(--success,#16a34a)':'var(--warning,#f59e0b)'};">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${currentTerm?'#16a34a':'#f59e0b'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span style="font-size:13px;color:${currentTerm?'var(--success-dark,#14532d)':'var(--warning-dark,#92400e)'};">
          ${currentTerm?`Active ${periodLabel}: <strong>${currentTerm.name}</strong> &nbsp;|&nbsp; ${sessionLabel}: <strong>${currentTerm.session||'Not set'}</strong>`:`No active ${periodLabel.toLowerCase()} set — please activate one below.`}
        </span>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <!-- Left: Sessions & Periods list -->
        <div>
          <div class="card">
            <div class="card__header">
              <span class="card__title">${sessionLabel}s &amp; ${periodLabel}s</span>
              <button class="btn btn--primary btn--sm" onclick="openAddSession()">+ New ${sessionLabel}</button>
            </div>
            ${Object.keys(sessionMap).length===0
              ? `<p style="color:var(--ink-3);font-size:13px;">No sessions yet. Create your first ${sessionLabel} then add ${periodLabel}s.</p>`
              : Object.keys(sessionMap).sort().reverse().map(sess=>`
                <div style="margin-bottom:12px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                    <div style="font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;">${sess}</div>
                  </div>
                  ${sessionMap[sess].map(t=>`
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;margin-bottom:4px;background:${t.is_current?'var(--primary-light)':'var(--surface-3)'};border:1.5px solid ${t.is_current?'var(--primary)':'transparent'};">
                      <div>
                        <div style="font-weight:600;font-size:13px;">${t.name}</div>
                        <div style="font-size:11px;color:var(--ink-3);">${t.start_date?formatDate(t.start_date)+' – '+formatDate(t.end_date):'No dates'}</div>
                      </div>
                      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0;">
                        ${t.is_current?'<span class="badge badge--green" style="font-size:11px;">Active</span>'
                          :`<button class="btn btn--secondary btn--sm" style="font-size:11px;padding:3px 8px;" onclick="setCurrentTerm('${t.id}')">Activate</button>`}
                        <button class="btn btn--ghost btn--sm" style="padding:4px 6px;" onclick="editTermModal('${t.id}')" title="Edit">${editIcon()}</button>
                        <button class="btn btn--ghost btn--sm" style="padding:4px 6px;" onclick="deleteTerm('${t.id}')" title="Delete">${trashIcon()}</button>
                      </div>
                    </div>`).join('')}
                </div>`).join('')}
          </div>
        </div>

        <!-- Right: Add period -->
        <div class="card">
          <div class="card__header"><span class="card__title">Add ${periodLabel}</span></div>
          ${!currentTerm&&terms.length>0?noTermBanner(`You have ${periodLabel.toLowerCase()}s but none is active.`):''}
          <div class="form-group"><label class="form-label">${periodLabel} Name <span class="required">*</span></label>
            <input id="newTermName" class="form-control" placeholder="${periodLabel==='Semester'?'First Semester':'First Term'}"></div>
          <div class="form-group">
            <label class="form-label">${sessionLabel}</label>
            <select id="newTermSession" class="form-control">
              <option value="">— Select ${sessionLabel} —</option>
              ${[...new Set(terms.map(t=>t.session).filter(Boolean))].sort().reverse().map(s=>`<option value="${s}">${s}</option>`).join('')}
              <option value="__new__">+ Type a new ${sessionLabel}…</option>
            </select>
          </div>
          <div class="form-group" id="customSessionGroup" style="display:none;">

function openAddSession(){
  const sl=getSessionLabel();
  openEdit(`
    <h3>New ${sl}</h3>
    <div class="form-group"><label class="form-label">${sl} Name <span class="required">*</span></label>
      <input id="as-name" class="form-control" placeholder="${sl==='Academic Year'?'2024/2025':'2024/2025 Session'}"></div>
    <p style="font-size:12px;color:var(--ink-3);">After creating the session, add ${getPeriodLabel()}s to it using the form on the right.</p>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn--primary" onclick="saveSession()">Save</button>
      <button class="btn btn--ghost" onclick="closeEdit()">Cancel</button>
    </div>`);
}
async function saveSession(){
  const name=document.getElementById('as-name').value.trim();
  if(!name){toast('Enter a session name.','error');return;}
  closeEdit();
  // Pre-fill the session dropdown and rerender
  if(!terms.find(t=>t.session===name)){
    // Create a lightweight placeholder term just to register the session
    // (only if DB has academic_sessions table — otherwise harmless)
    try{ await db.from('academic_sessions').insert({school_id:currentUser.school_id,name}); }catch{}
  }
  toast(`${getSessionLabel()} "${name}" ready — now add ${getPeriodLabel()}s to it.`,'success');
  await loadAll(); renderTerms();
  // Auto-select new session in dropdown
  setTimeout(()=>{ const sel=document.getElementById('newTermSession'); if(sel){ const opt=[...sel.options].find(o=>o.value===name); if(!opt){ const o=new Option(name,name); sel.add(o); } sel.value=name; } },200);
}

function editTermModal(id){
  const t=terms.find(x=>x.id===id); if(!t) return;
  const pl=getPeriodLabel(); const sl=getSessionLabel();
  const sessions=[...new Set(terms.map(x=>x.session).filter(Boolean))];
  openEdit(`
    <h3>Edit ${pl}</h3>
    <div class="form-group"><label class="form-label">${pl} Name <span class="required">*</span></label>
      <input id="et-name" class="form-control" value="${t.name}"></div>
    <div class="form-group"><label class="form-label">${sl}</label>
      <input id="et-session" class="form-control" list="et-sessions" value="${t.session||''}">
      <datalist id="et-sessions">${sessions.map(s=>`<option value="${s}">`).join('')}</datalist>
    </div>
    <div class="form-group"><label class="form-label">Start Date</label>
      <input type="date" id="et-start" class="form-control" value="${t.start_date||''}"></div>
    <div class="form-group"><label class="form-label">End Date</label>
      <input type="date" id="et-end" class="form-control" value="${t.end_date||''}"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn--primary" onclick="updateTerm('${id}')">Update</button>
      <button class="btn btn--ghost" onclick="closeEdit()">Cancel</button>
    </div>`);
}
async function updateTerm(id){
  const name=document.getElementById('et-name').value.trim();
  if(!name){toast('Enter a name.','error');return;}
  const{error}=await db.from('terms').update({name,session:document.getElementById('et-session').value.trim()||null,start_date:document.getElementById('et-start').value||null,end_date:document.getElementById('et-end').value||null}).eq('id',id);
  if(error){toast(error.message,'error');return;}
  closeEdit(); await loadAll(); renderTerms(); toast(`${getPeriodLabel()} updated!`,'success');
}
async function addTerm(setAsCurrent=false){
  const name=document.getElementById('newTermName').value.trim();
  if(!name){toast(`Enter a ${getPeriodLabel()} name.`,'error');return;}
  const start=document.getElementById('newTermStart').value||null;
  const end=document.getElementById('newTermEnd').value||null;
  const sessionSel=document.getElementById('newTermSession');
  let session=sessionSel?.value||null;
  if(session==='__new__') session=document.getElementById('newTermSessionCustom')?.value?.trim()||null;
  const{data:newTerm,error}=await db.from('terms').insert({school_id:currentUser.school_id,name,start_date:start,end_date:end,session:session||null}).select().single();
  if(error){toast('Error: '+error.message,'error');return;}
  if(setAsCurrent||terms.length===0){
    await db.from('terms').update({is_current:false}).eq('school_id',currentUser.school_id);
    await db.from('terms').update({is_current:true}).eq('id',newTerm.id);
  }
  await loadAll(); renderTerms();
  const label=getPeriodLabel();
  toast(setAsCurrent||terms.length===0?`${label} added and activated!`:`${label} added!`,'success');
}
async function setCurrentTerm(id){
  await db.from('terms').update({is_current:false}).eq('school_id',currentUser.school_id);
  await db.from('terms').update({is_current:true}).eq('id',id);
  await loadAll(); renderTerms(); toast('Active period updated!','success');
}
async function deleteTerm(id){
  const t=terms.find(x=>x.id===id);
  if(t?.is_current&&!confirm('This is the active period. Deleting it means no period will be active. Continue?')) return;
  if(!t?.is_current&&!confirm(`Delete this ${getPeriodLabel().toLowerCase()}?`)) return;
  await db.from('terms').delete().eq('id',id);
  await loadAll(); renderTerms();
}

function editGradeModal(id){

    <div class="form-grid">
      <div class="form-group"><label class="form-label">Grade</label><input id="eg-grade" class="form-control" value="${g.grade}"></div>

async function updateGrade(id){
  const{error}=await db.from('grading_scales').update({grade:document.getElementById('eg-grade').value.trim(),remark:document.getElementById('eg-remark').value.trim()||null,min_score:Number(document.getElementById('eg-min').value),max_score:Number(document.getElementById('eg-max').value)}).eq('id',id);

    </div>`);
}
async function updateExam(id){
  const{error}=await db.from('exams').update({name:document.getElementById('ee-name').value.trim(),max_score:Number(document.getElementById('ee-max').value),weight:Number(document.getElementById('ee-weight').value)}).eq('id',id);
  if(error){toast(error.message,'error');return;}
  closeEdit(); loadExams(); toast('Component updated!','success');
}
async function addExam(){
  if(!requireCurrentTerm('adding an exam component')) return;
  const name=document.getElementById('exName').value.trim(); const max=Number(document.getElementById('exMax').value);
  if(!name||!max){toast('Fill name and max score.','error');return;}
  const termId=getCurrentTerm().id;
  await db.from('exams').insert({school_id:currentUser.school_id,name,max_score:max,weight:Number(document.getElementById('exWeight').value)||1,term_id:termId});
  renderExams(); toast('Added!','success');
}
async function addDefaultExams(){
  if(!requireCurrentTerm('loading default components')) return;
  const termId=getCurrentTerm().id;
  await db.from('exams').upsert([
    {school_id:currentUser.school_id,name:'CA 1',max_score:20,weight:1,term_id:termId},
    {school_id:currentUser.school_id,name:'CA 2',max_score:20,weight:1,term_id:termId},
    {school_id:currentUser.school_id,name:'Exam',max_score:60,weight:1,term_id:termId},
  ],{onConflict:'school_id,name'});
  renderExams(); toast('Standard components added!','success');
}
async function deleteExam(id){ if(!confirm('Delete?')) return; await db.from('exams').delete().eq('id',id); loadExams(); }

// ═══════════════════════════════════════════════════════════════
//  TAB 9 — PORTAL CONTROLS
// ═══════════════════════════════════════════════════════════════
async function renderPortalControls(){
  let{data:ds}=await db.from('dashboard_settings').select('*').eq('school_id',currentUser.school_id).maybeSingle();
  if(!ds){ const{data:c}=await db.from('dashboard_settings').insert({school_id:currentUser.school_id}).select().single(); ds=c||{}; }
  dashSettings=ds;
  const tog=(key,label,desc)=>`
    <div class="toggle-row">
      <div><div style="font-size:14px;font-weight:500;">${label}</div>
        <div style="font-size:12px;color:var(--ink-3);">${desc}</div></div>
      <label class="toggle"><input type="checkbox" ${ds[key]!==false?'checked':''} onchange="saveDash('${key}',this.checked)"><span class="slider"></span></label>
    </div>`;
  document.getElementById('settingsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;max-width:960px;">
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Teacher Portal</span></div>
        ${tog('teacher_see_attendance','Attendance','Can take & view attendance')}
        ${tog('teacher_see_scores','Score Entry','Can enter student scores')}
        ${tog('teacher_see_students','Student List','Can view their students')}
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Student Portal</span></div>
        ${tog('student_see_results','Results','Can view own results')}
        ${tog('student_see_attendance','Attendance','Can view attendance record')}
        ${tog('student_see_fees','Fee Status','Can view fee balance')}
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Parent Portal</span></div>
        ${tog('parent_see_results','Results','Can view child results')}
        ${tog('parent_see_attendance','Attendance','Can view child attendance')}
        ${tog('parent_see_fees','Fees','Can view fee status')}
      </div>
    </div>
    <div class="card" style="margin-top:16px;max-width:440px;background:var(--primary-light);border-color:var(--primary);">
      <p style="font-size:13px;color:var(--primary);">Changes apply immediately on next page load.</p>
    </div>`;
}
async function saveDash(key,value){
  const{error}=await db.from('dashboard_settings').update({[key]:value,updated_at:new Date().toISOString()}).eq('school_id',currentUser.school_id);
  if(error){toast(error.message,'error');return;}
  dashSettings[key]=value; toast('Setting saved!','success');
}

// ═══════════════════════════════════════════════════════════════
//  TAB 10 — STUDENT LOGINS
// ═══════════════════════════════════════════════════════════════
async function renderStudentAccounts(){
  const{data:students}=await db.from('students').select('id,full_name,admission_no,can_login,pin,enrollments(classes(name))').eq('school_id',currentUser.school_id).eq('is_active',true).order('full_name');
  window._stuList=students||[];
  document.getElementById('settingsContent').innerHTML=`
    <div style="max-width:860px;">
      <div class="card" style="margin-bottom:16px;background:var(--info-light);border-color:var(--info);">
        <p style="font-size:13px;color:var(--info);">
          <strong>How Student Login Works:</strong><br>
          Students log in at <strong>student/index.html</strong> using their <strong>Admission Number</strong> as username and a <strong>PIN</strong> you set here.
        </p>
      </div>
      <div class="filter-bar">
        <div class="search-box" style="flex:1;max-width:280px;">
          <input class="form-control" id="stuSearch" placeholder="Search…" oninput="filterStu()">
        </div>
        <button class="btn btn--secondary btn--sm" onclick="enableAll()">Enable All</button>
        <button class="btn btn--ghost btn--sm" onclick="disableAll()">Disable All</button>
      </div>
      <div class="card" style="padding:0;"><div class="table-wrap" id="stuTable" style="border:none;"></div></div>
    </div>`;
  filterStu();
}
function filterStu(){
  const q=(document.getElementById('stuSearch')?.value||'').toLowerCase();
  const f=(window._stuList||[]).filter(s=>s.full_name.toLowerCase().includes(q)||s.admission_no?.toLowerCase().includes(q));
  renderStuTable(f);
}
function renderStuTable(students){
  if(!students.length){document.getElementById('stuTable').innerHTML='<p style="padding:16px;color:var(--ink-3);">No students found.</p>';return;}
  document.getElementById('stuTable').innerHTML=`
    <table><thead><tr><th>Student</th><th>Class</th><th>Adm. No.</th><th>PIN</th><th>Login</th><th></th></tr></thead>
    <tbody>${students.map(s=>`
      <tr>
        <td><div class="student-cell"><div class="avatar avatar--sm">${s.full_name.charAt(0)}</div><div class="info"><div class="name">${s.full_name}</div></div></div></td>
        <td><span class="chip">${s.enrollments?.[0]?.classes?.name||'—'}</span></td>
        <td style="font-family:var(--mono);font-size:13px;">${s.admission_no||'—'}</td>
        <td><input type="text" id="pin-${s.id}" maxlength="8" style="width:80px;padding:5px 8px;border:1.5px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:13px;" value="${s.pin||''}" placeholder="Set PIN"></td>
        <td><label class="toggle"><input type="checkbox" ${s.can_login?'checked':''} onchange="toggleStu('${s.id}',this.checked)"><span class="slider"></span></label></td>
        <td><button class="btn btn--primary btn--sm" onclick="saveStuPin('${s.id}')">Save</button></td>
      </tr>`).join('')}
    </tbody></table>`;
}
async function toggleStu(id,val){ await db.from('students').update({can_login:val}).eq('id',id); const s=window._stuList?.find(s=>s.id===id); if(s) s.can_login=val; toast(`Login ${val?'enabled':'disabled'}.`,'success'); }
async function saveStuPin(id){
  const pin=document.getElementById(`pin-${id}`)?.value?.trim();
  if(!pin||pin.length<4){toast('PIN must be 4+ characters.','error');return;}
  await db.from('students').update({pin,can_login:true}).eq('id',id);
  const s=window._stuList?.find(s=>s.id===id); if(s){s.pin=pin;s.can_login=true;}
  toast('PIN saved! Login enabled.','success');
}
async function enableAll(){ if(!confirm('Enable login for all students?')) return; await db.from('students').update({can_login:true}).eq('school_id',currentUser.school_id).eq('is_active',true); toast('All enabled!','success'); renderStudentAccounts(); }
async function disableAll(){ if(!confirm('Disable all student logins?')) return; await db.from('students').update({can_login:false}).eq('school_id',currentUser.school_id); toast('All disabled.','success'); renderStudentAccounts(); }
</script>
