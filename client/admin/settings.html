<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a6e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduTrack NG">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>EduTrack NG — Settings</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .combo-card { border:2px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:var(--transition);margin-bottom:10px; }
    .combo-card:hover { border-color:var(--primary); }
    .combo-card.selected { background:var(--primary-light); }
    .combo-dot { width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0; }
    .subject-chip { display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:600;margin:3px;border:1.5px solid var(--border);cursor:pointer;transition:var(--transition);user-select:none; }
    .subject-chip.core { background:var(--primary-light);border-color:var(--primary);color:var(--primary); }
    .subject-chip.elective { background:var(--info-light);border-color:var(--info);color:var(--info); }
    .subject-chip.unassigned { background:var(--surface-3);color:var(--ink-3);border-color:var(--border); }
    .toggle-row { display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border); }
    .toggle-row:last-child { border-bottom:none; }
    .toggle { position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0; }
    .toggle input { opacity:0;width:0;height:0; }
    .slider { position:absolute;cursor:pointer;inset:0;background:var(--border-2);border-radius:24px;transition:.3s; }
    .slider:before { content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s; }
    .toggle input:checked+.slider { background:var(--primary); }
    .toggle input:checked+.slider:before { transform:translateX(20px); }
    .upload-zone { border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:var(--transition); }
    .upload-zone:hover { border-color:var(--primary);background:var(--primary-light); }
    .no-term-banner { background:var(--warning-light,#fffbeb);border:1.5px solid var(--warning,#f59e0b);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--warning-dark,#92400e); }
    .no-term-banner strong { font-weight:700; }
    .no-term-banner a { color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, classes=[], subjects=[], terms=[], gradingScale=[], combinations=[], dashSettings={};

// ── BOOT ──────────────────────────────────────────────────────
(async()=>{
  currentUser = await initAdminLayout('settings','Settings');
  if(!currentUser) return;
  // Load all data FIRST, then render page and default tab
  await loadAll();
  renderPage();
})();

function renderPage(){
  document.getElementById('pageBody').innerHTML=`
    <div class="page-header"><h1>Settings</h1><p>School profile, academic sessions, subjects, combinations, and portal controls</p></div>
    <div class="tabs" style="overflow-x:auto;white-space:nowrap;">
      <button class="tab active" onclick="showTab('school',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"15\" rx=\"2\"/><path d=\"M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2\"/><line x1=\"12\" y1=\"12\" x2=\"12\" y2=\"16\"/><line x1=\"10\" y1=\"14\" x2=\"14\" y2=\"14\"/></svg>School &amp; Logo</button>
      <button class="tab" onclick="showTab('terms',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>Academic Session</button>
      <button class="tab" onclick="showTab('classes',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"2\"/><rect x=\"7\" y=\"7\" width=\"3\" height=\"3\"/><rect x=\"14\" y=\"7\" width=\"3\" height=\"3\"/><rect x=\"7\" y=\"14\" width=\"3\" height=\"3\"/><rect x=\"14\" y=\"14\" width=\"3\" height=\"3\"/></svg>Classes</button>
      <button class="tab" onclick="showTab('subjects',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>Subjects</button>
      <button class="tab" onclick="showTab('combinations',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><circle cx=\"18\" cy=\"18\" r=\"3\"/><circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M13 6h3a2 2 0 0 1 2 2v7\"/><line x1=\"6\" y1=\"9\" x2=\"6\" y2=\"21\"/></svg>Combinations</button>
      <button class="tab" onclick="showTab('grading',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/><line x1=\"2\" y1=\"20\" x2=\"22\" y2=\"20\"/></svg>Grading</button>
      <button class="tab" onclick="showTab('exams',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"/><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"/></svg>Exam Components</button>
      <button class="tab" onclick="showTab('portals',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/></svg>Portal Controls</button>
      <button class="tab" onclick="showTab('stuaccounts',this)"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-right:5px;vertical-align:-2px;\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Student Logins</button>
    </div>
    <div id="settingsContent"></div>`;
  // Render first tab now that data is loaded
  renderSchool();
}

async function showTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('settingsContent').innerHTML =
    '<div style="padding:24px;text-align:center;"><div style="font-size:24px;margin-bottom:12px;">⏳</div><p>Loading…</p></div>';
  await ({
    school:renderSchool, terms:renderTerms, classes:renderClasses,
    subjects:renderSubjects, combinations:renderCombinations, grading:renderGrading,
    exams:renderExams, portals:renderPortalControls, stuaccounts:renderStudentAccounts
  })[tab]?.();
}

async function loadAll(){
  const[{data:cls},{data:sub},{data:trm},{data:scale},{data:combos},{data:dash}] = await Promise.all([
    db.from('classes').select('id,name,level,combination_id').eq('school_id',currentUser.school_id).order('name'),
    db.from('subjects').select('id,name,code').eq('school_id',currentUser.school_id).order('name'),
    db.from('terms').select('*').eq('school_id',currentUser.school_id).order('created_at',{ascending:false}),
    db.from('grading_scales').select('*').eq('school_id',currentUser.school_id).order('min_score',{ascending:false}),
    db.from('subject_combinations').select('*').eq('school_id',currentUser.school_id).order('name'),
    db.from('dashboard_settings').select('*').eq('school_id',currentUser.school_id).maybeSingle()
  ]);
  classes=cls||[]; subjects=sub||[]; terms=trm||[]; gradingScale=scale||[]; combinations=combos||[]; dashSettings=dash||{};
}

// ── CURRENT TERM HELPERS ──────────────────────────────────────
function getCurrentTerm(){ return terms.find(t=>t.is_current)||null; }

/** Returns the no-period warning banner HTML. */
function noTermBanner(msg=''){
  const label = getPeriodLabel().toLowerCase();
  const base = msg || `No active ${label} is set. You must <a onclick="showTab('terms',document.querySelectorAll('.tab')[1])">activate a ${label}</a> before proceeding.`;
  return `<div class="no-term-banner"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> <span>${base}</span></div>`;
}

/** Guard: shows a toast + returns false if no current term exists. */
function requireCurrentTerm(actionLabel='this action'){
  if(getCurrentTerm()) return true;
  const label = getPeriodLabel().toLowerCase();
  toast(`Activate a ${label} first before ${actionLabel}.`,'warning');
  return false;
}

// ── SCHOOL & LOGO ─────────────────────────────────────────────
function renderSchool(){
  const s=currentUser.schools||{};
  document.getElementById('settingsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:800px;">
      <div class="card">
        <div class="card__header"><span class="card__title">School Logo</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
          <div id="logoPreview" style="width:100px;height:100px;border-radius:14px;overflow:hidden;border:2px solid var(--border);background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:42px;">
            ${s.logo_url?`<img src="${s.logo_url}" style="width:100%;height:100%;object-fit:cover;">`:'🏫'}
          </div>
          <div class="upload-zone" style="width:100%;" onclick="document.getElementById('logoFile').click()">
            <div style="font-size:24px;"></div>
            <div style="font-size:14px;font-weight:600;margin-top:6px;">Upload School Logo</div>
            <div style="font-size:12px;color:var(--ink-3);">PNG, JPG up to 2MB</div>
          </div>
          <input type="file" id="logoFile" accept="image/*" style="display:none;" onchange="handleLogoUpload(this)">
          ${s.logo_url?`<button class="btn btn--ghost btn--sm btn--full" onclick="removeLogo()">Remove Logo</button>`:''}
        </div>
        <div id="logoProgress" style="display:none;margin-top:12px;">
          <div class="progress-bar"><div class="progress-bar__fill" id="logoBar" style="width:0%;"></div></div>
          <p id="logoStatus" style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:4px;"></p>
        </div>
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title">School Profile</span></div>
        <div class="form-group"><label class="form-label">School Name</label><input id="scName" class="form-control" value="${s.name||''}"></div>
        <div class="form-group"><label class="form-label">Phone</label><input id="scPhone" class="form-control" value="${s.phone||''}"></div>
        <div class="form-group"><label class="form-label">Email</label><input id="scEmail" type="email" class="form-control" value="${s.email||''}"></div>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">State</label><input id="scState" class="form-control" value="${s.state||''}"></div>
          <div class="form-group"><label class="form-label">LGA</label><input id="scLga" class="form-control" value="${s.lga||''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Address</label><input id="scAddress" class="form-control" value="${s.address||''}"></div>
        <div class="form-group"><label class="form-label">School Motto</label><input id="scMotto" class="form-control" value="${s.motto||''}"></div>
        <div class="form-group">
          <label class="form-label">School Type</label>
          <select id="scType" class="form-control">
            <option value="o_level" ${(s.school_type||'o_level')==='o_level'?'selected':''}>O-Level (Primary / Secondary)</option>
            <option value="vocational" ${s.school_type==='vocational'?'selected':''}>Vocational / Technical School</option>
            <option value="islamic" ${s.school_type==='islamic'?'selected':''}>Islamic Institute / Madrasa</option>
            <option value="tertiary" ${s.school_type==='tertiary'?'selected':''}>Tertiary Institution (College / Polytechnic / University)</option>
          </select>
          <p style="font-size:12px;color:var(--ink-3);margin-top:5px;">Controls whether the system uses <strong>Terms</strong> (O-Level/Islamic) or <strong>Semesters</strong> (Vocational/Tertiary) across the platform.</p>
        </div>
        <button class="btn btn--primary btn--full" onclick="saveSchool()">Save Profile</button>
      </div>
    </div>`;
}

async function handleLogoUpload(input){
  const file=input.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Select an image file.','error'); return; }
  if(file.size>2097152){ toast('Image must be under 2MB.','error'); return; }
  document.getElementById('logoProgress').style.display='block';
  document.getElementById('logoBar').style.width='30%';
  document.getElementById('logoStatus').textContent='Uploading…';
  try {
    const ext=file.name.split('.').pop();
    const path=`logos/school-${currentUser.school_id}.${ext}`;
    const{error:upErr}=await db.storage.from('school-assets').upload(path,file,{upsert:true});
    if(upErr) throw upErr;
    document.getElementById('logoBar').style.width='70%';
    const{data:urlData}=db.storage.from('school-assets').getPublicUrl(path);
    const logoUrl=urlData.publicUrl+'?t='+Date.now();
    await db.from('schools').update({logo_url:urlData.publicUrl}).eq('id',currentUser.school_id);
    document.getElementById('logoBar').style.width='100%';
    document.getElementById('logoStatus').textContent='Uploaded!';
    document.getElementById('logoPreview').innerHTML=`<img src="${logoUrl}" style="width:100%;height:100%;object-fit:cover;">`;
    const icon=document.querySelector('.sidebar__logo-icon');
    if(icon) icon.innerHTML=`<img src="${logoUrl}" style="width:36px;height:36px;border-radius:7px;object-fit:cover;">`;
    toast('Logo uploaded!','success');
    setTimeout(()=>document.getElementById('logoProgress').style.display='none',2000);
  } catch(err){
    document.getElementById('logoStatus').textContent='Failed: '+err.message;
    toast('Upload failed. Create a "school-assets" storage bucket in Supabase first.','error');
  }
}

async function removeLogo(){
  if(!confirm('Remove logo?')) return;
  await db.from('schools').update({logo_url:null}).eq('id',currentUser.school_id);
  toast('Logo removed.','success'); renderSchool();
}

async function saveSchool(){
  const{error}=await db.from('schools').update({
    name:document.getElementById('scName').value,
    phone:document.getElementById('scPhone').value,
    email:document.getElementById('scEmail').value,
    state:document.getElementById('scState').value,
    lga:document.getElementById('scLga').value,
    address:document.getElementById('scAddress').value,
    motto:document.getElementById('scMotto').value,
    school_type:document.getElementById('scType').value,
  }).eq('id',currentUser.school_id);
  if(error){toast(error.message,'error');return;}
  toast('School profile saved!','success');
}

// ── ACADEMIC SESSION / TERMS ──────────────────────────────────
// Helper: detect school type to use correct period label
function getPeriodLabel(){ 
  const t = (currentUser?.schools?.school_type) || (window._schoolType) || 'o_level';
  return (t==='tertiary'||t==='vocational') ? 'Semester' : 'Term';
}
function getSessionLabel(){
  const t = (currentUser?.schools?.school_type) || (window._schoolType) || 'o_level';
  return t==='tertiary' ? 'Academic Year' : 'Academic Session';
}

function renderTerms(){
  const currentTerm = getCurrentTerm();
  const periodLabel = getPeriodLabel();
  const sessionLabel = getSessionLabel();

  // Group terms by session for display
  const sessionMap = {};
  terms.forEach(t => {
    const sess = t.session || 'No Session';
    if(!sessionMap[sess]) sessionMap[sess] = [];
    sessionMap[sess].push(t);
  });

  document.getElementById('settingsContent').innerHTML=`
    <div style="max-width:860px;">
      <!-- Active Status Banner -->
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;background:${currentTerm?'var(--success-light,#f0fdf4)':'var(--warning-light,#fffbeb)'};border:1.5px solid ${currentTerm?'var(--success,#16a34a)':'var(--warning,#f59e0b)'};">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${currentTerm?'#16a34a':'#f59e0b'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span style="font-size:13px;color:${currentTerm?'var(--success-dark,#14532d)':'var(--warning-dark,#92400e)'};">
          ${currentTerm
            ? `Active ${periodLabel}: <strong>${currentTerm.name}</strong> &nbsp;|&nbsp; ${sessionLabel}: <strong>${currentTerm.session||'Not set'}</strong>`
            : `No active ${periodLabel.toLowerCase()} set — please activate one below.`}
        </span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <!-- Left: Existing Sessions & Terms -->
        <div>
          <!-- Session List Card -->
          <div class="card" style="margin-bottom:16px;">
            <div class="card__header">
              <span class="card__title">${sessionLabel}s</span>
              <button class="btn btn--primary btn--sm" onclick="document.getElementById('addSessionCard').style.display='block';this.style.display='none';">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Session
              </button>
            </div>
            <div id="addSessionCard" style="display:none;background:var(--surface-3);border-radius:var(--radius);padding:12px;margin-bottom:12px;">
              <div class="form-group" style="margin-bottom:8px;"><label class="form-label" style="font-size:12px;">${sessionLabel} Name <span class="required">*</span></label>
                <input id="newSessionName" class="form-control" style="font-size:13px;" placeholder="${sessionLabel==='Academic Year'?'2024/2025':'2024/2025 Session'}"></div>
              <div style="display:flex;gap:6px;">
                <button class="btn btn--primary btn--sm" onclick="addSession()">Save</button>
                <button class="btn btn--ghost btn--sm" onclick="document.getElementById('addSessionCard').style.display='none';document.querySelector('.btn--primary').style.display='';">Cancel</button>
              </div>
            </div>
            ${Object.keys(sessionMap).length
              ? Object.keys(sessionMap).sort().reverse().map(sess=>`
                <div style="margin-bottom:8px;">
                  <div style="font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;padding:4px 0;">${sess}</div>
                  ${sessionMap[sess].map(t=>`
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;margin-bottom:4px;background:${t.is_current?'var(--primary-light)':'var(--surface-3)'};border:1.5px solid ${t.is_current?'var(--primary)':'transparent'};">
                      <div>
                        <div style="font-weight:600;font-size:13px;">${t.name}</div>
                        <div style="font-size:11px;color:var(--ink-3);">${t.start_date?formatDate(t.start_date)+' – '+formatDate(t.end_date):'No dates set'}</div>
                      </div>
                      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0;">
                        ${t.is_current
                          ? '<span class="badge badge--green" style="font-size:11px;">Active</span>'

            <select id="newTermSession" class="form-control">
              <option value="">— Select ${sessionLabel} —</option>
              ${[...new Set(terms.map(t=>t.session).filter(Boolean))].sort().reverse().map(s=>`<option value="${s}">${s}</option>`).join('')}

          <div style="display:flex;gap:8px;flex-wrap:wrap;">

            <button class="btn btn--secondary" onclick="addTerm(true)">Add &amp; Activate</button>

          <p style="font-size:12px;color:var(--ink-3);margin-top:10px;"><strong>Add &amp; Activate</strong> adds the ${periodLabel.toLowerCase()} and makes it active in one step.</p>
        </div>
      </div>
    </div>`;

  // Handle custom session input toggle
  document.getElementById('newTermSession')?.addEventListener('change', function(){
    document.getElementById('customSessionGroup').style.display = this.value==='__new__' ? 'block' : 'none';
  });
}

async function addSession(){
  const name = document.getElementById('newSessionName')?.value?.trim();
  if(!name){ toast('Enter a session name.','error'); return; }
  // Sessions are implicit — they're just the session field on terms.
  // We create a placeholder term-free session record if the DB has an academic_sessions table,
  // otherwise we just store the name for use when adding terms.
  try {
    const { error } = await db.from('academic_sessions').insert({ school_id: currentUser.school_id, name });
    if(error && !error.message.includes('does not exist')) throw error;
  } catch {}
  toast('Session name saved!', 'success');
  document.getElementById('addSessionCard').style.display = 'none';
  // Re-populate session dropdown
  renderTerms();
}

async function addTerm(setAsCurrent=false){
  const name=document.getElementById('newTermName').value.trim();
  if(!name){toast(`Enter a ${getPeriodLabel()} name.`,'error');return;}
  const start=document.getElementById('newTermStart').value||null;
  const end=document.getElementById('newTermEnd').value||null;

  // Resolve session name
  const sessionSel = document.getElementById('newTermSession');
  let session = sessionSel?.value||null;
  if(session==='__new__'){
    session = document.getElementById('newTermSessionCustom')?.value?.trim()||null;
  }

  // Insert the new term/semester
  const{data:newTerm,error}=await db.from('terms').insert({
    school_id:currentUser.school_id, name,
    start_date:start, end_date:end,
    session: session||null
  }).select().single();

  if(error){toast('Error: '+error.message,'error');return;}

  // If requested, or if there are no other terms yet, set as current
  if(setAsCurrent || terms.length===0){
    await db.from('terms').update({is_current:false}).eq('school_id',currentUser.school_id);
    await db.from('terms').update({is_current:true}).eq('id',newTerm.id);
  }

  await loadAll();
  renderTerms();
  const label=getPeriodLabel();
  toast(setAsCurrent||terms.length===0 ? `${label} added and activated!` : `${label} added!`,'success');
}

async function setCurrentTerm(id){
  await db.from('terms').update({is_current:false}).eq('school_id',currentUser.school_id);
  await db.from('terms').update({is_current:true}).eq('id',id);
  await loadAll();
  renderTerms();
  toast('Current term updated! ✅','success');
}

async function deleteTerm(id){
  const t=terms.find(x=>x.id===id);
  if(t?.is_current && !confirm('This is the current term. Deleting it means no term will be active. Continue?')) return;
  if(!t?.is_current && !confirm('Delete this term?')) return;
  await db.from('terms').delete().eq('id',id);
  await loadAll();
  renderTerms();
}

function cycleChip(subjectId, name, code){
  const chip=document.getElementById(`chip-${subjectId}`);
  const state=chip.dataset.state;
  const display=code||name.substring(0,4);
  if(state==='unassigned'){
    chip.dataset.state='core'; chip.className='subject-chip core';
    chip.innerHTML=`${display} <span style="font-size:10px;">★</span>`;
  } else if(state==='core'){
    chip.dataset.state='elective'; chip.className='subject-chip elective';
    chip.innerHTML=`${display} <span style="font-size:10px;">◆</span>`;
  } else {
    chip.dataset.state='unassigned'; chip.className='subject-chip unassigned';
    chip.innerHTML=`${display} <span style="font-size:10px;"></span>`;
  }
  const chips=[...document.querySelectorAll('#chipArea .subject-chip')];
  const coreCount=chips.filter(c=>c.dataset.state==='core').length;
  const elecCount=chips.filter(c=>c.dataset.state==='elective').length;
  const cc=document.getElementById('coreCount'); if(cc) cc.textContent=coreCount;
  const ec=document.getElementById('electiveCount'); if(ec) ec.textContent=elecCount;
}

async function saveComboSubjects(comboId){
  const chips=[...document.querySelectorAll('#chipArea .subject-chip')];
  const rows=chips.filter(c=>c.dataset.state!=='unassigned').map(c=>({
    combination_id:comboId,
    subject_id:c.id.replace('chip-',''),
    school_id:currentUser.school_id,
    is_compulsory:c.dataset.state==='core'
  }));
  await db.from('combination_subjects').delete().eq('combination_id',comboId);
  if(rows.length){
    const{error}=await db.from('combination_subjects').insert(rows);
    if(error){toast('Save failed: '+error.message,'error');return;}
  }
  toast(`${rows.length} subjects saved! ✅`,'success');
}

async function deleteCombo(id){
  if(!confirm('Delete this combination?')) return;
  if(activeComboId===id) activeComboId=null;
  await db.from('subject_combinations').delete().eq('id',id);
  await loadAll(); await renderCombinations();
}

async function loadNigerianCombinations(){
  if(!subjects.length){ toast('Load subjects first (Subjects tab → Load Nigerian Standard Subjects)','info'); return; }
  if(!confirm('Add Science, Art, Commercial, General combinations?')) return;

  const{data:inserted}=await db.from('subject_combinations').upsert([
    {school_id:currentUser.school_id,name:'Core Subjects',description:'Compulsory for ALL students',color:'#374151'},
    {school_id:currentUser.school_id,name:'Science',description:'Physics, Chemistry, Biology, Further Maths',color:'#2563eb'},
    {school_id:currentUser.school_id,name:'Art',description:'Literature, Government, History, CRS/IRS',color:'#7c3aed'},
    {school_id:currentUser.school_id,name:'Commercial',description:'Economics, Accounting, Commerce',color:'#d97706'},
    {school_id:currentUser.school_id,name:'General',description:'Mixed subjects for JSS level',color:'#16a34a'},
  ],{onConflict:'school_id,name'}).select();

  const subMap={}; subjects.forEach(s=>subMap[s.name]=s.id);
  const combMap={}; (inserted||[]).forEach(c=>combMap[c.name]=c.id);

  const rows=[];
  const assign=(combo,names,core)=>names.forEach(n=>{ if(subMap[n]&&combMap[combo]) rows.push({combination_id:combMap[combo],subject_id:subMap[n],school_id:currentUser.school_id,is_compulsory:core}); });

  assign('Core Subjects',['English Language','Mathematics','Civic Education','Physical & Health Education'],true);
  assign('Science',['Physics','Chemistry','Biology','Further Mathematics','Agricultural Science','Computer Studies'],false);
  assign('Art',['Literature in English','Government','History','Christian Religious Studies','Islamic Studies','Yoruba','Igbo','Hausa','Fine Arts','Music','French'],false);
  assign('Commercial',['Economics','Commerce','Accounting','Geography'],false);
  assign('General',['Basic Science','Social Studies','Computer Studies','Agricultural Science','Home Economics'],false);

  if(rows.length) await db.from('combination_subjects').upsert(rows,{onConflict:'combination_id,subject_id'});
  await renderCombinations(); toast('Nigerian combinations loaded! ✅','success');
}

// ── GRADING ───────────────────────────────────────────────────
function renderGrading(){
  document.getElementById('settingsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:700px;">
      <div class="card">
        <div class="card__header"><span class="card__title">Grading Scale</span></div>
        ${gradingScale.length?`
          <div class="table-wrap" style="border:none;">
            <table><thead><tr><th>Grade</th><th>Min</th><th>Max</th><th>Remark</th><th></th></tr></thead>
            <tbody>${gradingScale.map(g=>`<tr>
              <td><strong>${g.grade}</strong></td><td>${g.min_score}</td><td>${g.max_score}</td>
              <td style="color:var(--ink-3);">${g.remark||'—'}</td>
              <td><button class="btn btn--ghost btn--sm" onclick="deleteGrade('${g.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></td>
            </tr>`).join('')}</tbody></table>
          </div>`:'<p style="color:var(--ink-3);">No grading scale yet.</p>'}
        <button class="btn btn--secondary btn--sm btn--full" style="margin-top:12px;" onclick="addNigerianGrading()">Load Nigerian A1–F9</button>
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title">Add Grade Band</span></div>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Grade</label><input id="gGrade" class="form-control" placeholder="A1"></div>
          <div class="form-group"><label class="form-label">Remark</label><input id="gRemark" class="form-control" placeholder="Excellent"></div>
          <div class="form-group"><label class="form-label">Min</label><input type="number" id="gMin" class="form-control" placeholder="75"></div>
          <div class="form-group"><label class="form-label">Max</label><input type="number" id="gMax" class="form-control" placeholder="100"></div>
        </div>
        <button class="btn btn--primary" onclick="addGrade()">+ Add</button>
      </div>
    </div>`;
}

async function addNigerianGrading(){
  await db.from('grading_scales').delete().eq('school_id',currentUser.school_id);
  await db.from('grading_scales').insert([
    {grade:'A1',min_score:75,max_score:100,remark:'Excellent'},
    {grade:'B2',min_score:70,max_score:74,remark:'Very Good'},
    {grade:'B3',min_score:65,max_score:69,remark:'Good'},
    {grade:'C4',min_score:60,max_score:64,remark:'Credit'},
    {grade:'C5',min_score:55,max_score:59,remark:'Credit'},
    {grade:'C6',min_score:50,max_score:54,remark:'Credit'},
    {grade:'D7',min_score:45,max_score:49,remark:'Pass'},
    {grade:'E8',min_score:40,max_score:44,remark:'Pass'},
    {grade:'F9',min_score:0,max_score:39,remark:'Fail'},
  ].map(s=>({school_id:currentUser.school_id,...s})));
  await loadAll(); renderGrading(); toast('Nigerian A1–F9 grading loaded!','success');
}

async function addGrade(){
  const grade=document.getElementById('gGrade').value.trim();
  const min=Number(document.getElementById('gMin').value);
  const max=Number(document.getElementById('gMax').value);
  if(!grade){toast('Fill all fields.','error');return;}
  await db.from('grading_scales').insert({school_id:currentUser.school_id,grade,min_score:min,max_score:max,remark:document.getElementById('gRemark').value||null});
  await loadAll(); renderGrading();
}

async function deleteGrade(id){
  await db.from('grading_scales').delete().eq('id',id);
  await loadAll(); renderGrading();
}

// ── EXAMS ─────────────────────────────────────────────────────
function renderExams(){
  const currentTerm = getCurrentTerm();
  document.getElementById('settingsContent').innerHTML=`
    <div style="max-width:640px;">
      ${!currentTerm ? noTermBanner('You must <a onclick="showTab(\'terms\',document.querySelectorAll(\'.tab\')[1])">set a current term</a> before adding exam components. Exams are linked to a term.') : `
      <div class="card" style="margin-bottom:12px;background:var(--success-light,#f0fdf4);border-color:var(--success,#16a34a);">
        <p style="font-size:13px;color:var(--success-dark,#14532d);">Active ${getPeriodLabel()}: <strong>${currentTerm.name}</strong>. New exam components will be linked to this ${getPeriodLabel().toLowerCase()}.</p>
      </div>`}
      <div class="card" style="margin-bottom:20px;">
        <div class="card__header"><span class="card__title">Exam Components</span></div>
        <div id="examList"><div class="et-loader"><div class="et-spinner"></div></div></div>
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title">Add Component</span></div>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Name</label><input id="exName" class="form-control" placeholder="CA1"></div>
          <div class="form-group"><label class="form-label">Max Score</label><input type="number" id="exMax" class="form-control" placeholder="100"></div>
          <div class="form-group"><label class="form-label">Weight</label><input type="number" id="exWeight" class="form-control" value="1"></div>
        </div>
        <button class="btn btn--primary" onclick="addExam()" ${!currentTerm?'disabled title="Set a current term first"':''}>+ Add</button>
        <button class="btn btn--secondary" style="margin-left:8px;" onclick="addDefaultExams()" ${!currentTerm?'disabled title="Set a current term first"':''}>Load CA1+CA2+Exam</button>
      </div>
    </div>`;
  loadExams();
}

async function loadExams(){
  const{data}=await db.from('exams').select('*').eq('school_id',currentUser.school_id).order('name');
  const examListEl=document.getElementById('examList');
  if(!examListEl) return;
  examListEl.innerHTML=data?.length?`
    <table style="width:100%;font-size:14px;border-collapse:collapse;">
      <thead><tr style="background:var(--surface-3);">
        <th style="padding:8px 12px;text-align:left;">Name</th>
        <th style="padding:8px 12px;">Max</th>
        <th style="padding:8px 12px;">Weight</th>
        <th></th>
      </tr></thead>
      <tbody>${data.map(e=>`<tr style="border-bottom:1px solid var(--border);">
        <td style="padding:8px 12px;font-weight:600;">${e.name}</td>
        <td style="padding:8px 12px;">${e.max_score}</td>
        <td style="padding:8px 12px;">${e.weight}</td>
        <td style="padding:8px 12px;"><button class="btn btn--ghost btn--sm" onclick="deleteExam('${e.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></td>
      </tr>`).join('')}</tbody>
    </table>`:'<p style="color:var(--ink-3);">No exam components yet.</p>';
}

async function addExam(){
  if(!requireCurrentTerm('adding an exam component')) return;
  const name=document.getElementById('exName').value.trim();
  const max=Number(document.getElementById('exMax').value);
  if(!name||!max){toast('Fill name and max score.','error');return;}
  const termId=getCurrentTerm().id;
  await db.from('exams').insert({school_id:currentUser.school_id,name,max_score:max,weight:Number(document.getElementById('exWeight').value)||1,term_id:termId});
  renderExams(); toast('Added!','success');
}

async function addDefaultExams(){
  if(!requireCurrentTerm('loading default exam components')) return;
  const termId=getCurrentTerm().id;
  await db.from('exams').upsert([
    {school_id:currentUser.school_id,name:'CA 1',max_score:20,weight:1,term_id:termId},
    {school_id:currentUser.school_id,name:'CA 2',max_score:20,weight:1,term_id:termId},
    {school_id:currentUser.school_id,name:'Exam',max_score:60,weight:1,term_id:termId},
  ],{onConflict:'school_id,name'});
  renderExams(); toast('Standard components added!','success');
}

async function deleteExam(id){
  if(!confirm('Delete?')) return;
  await db.from('exams').delete().eq('id',id);
  renderExams();
}

// ── PORTAL CONTROLS ───────────────────────────────────────────

  if(!ds){
    const{data:c}=await db.from('dashboard_settings').insert({school_id:currentUser.school_id}).select().single();
    ds=c||{};

  dashSettings=ds;

  const tog=(key,label,desc)=>`
    <div class="toggle-row">
      <div><div style="font-size:14px;font-weight:500;">${label}</div>
        <div style="font-size:12px;color:var(--ink-3);">${desc}</div></div>
      <label class="toggle">
        <input type="checkbox" ${ds[key]!==false?'checked':''} onchange="saveDash('${key}',this.checked)">
        <span class="slider"></span>
      </label>
    </div>`;

  document.getElementById('settingsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;max-width:960px;">
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Teacher Portal</span></div>
        ${tog('teacher_see_attendance','Attendance','Can take & view attendance')}
        ${tog('teacher_see_scores','Score Entry','Can enter student scores')}
        ${tog('teacher_see_students','Student List','Can view their students')}
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Student Portal</span></div>
        ${tog('student_see_results','Results','Can view own results')}
        ${tog('student_see_attendance','Attendance','Can view attendance record')}
        ${tog('student_see_fees','Fee Status','Can view fee balance')}
      </div>
      <div class="card">
        <div class="card__header"><span class="card__title"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Parent Portal</span></div>
        ${tog('parent_see_results','Results','Can view child results')}
        ${tog('parent_see_attendance','Attendance','Can view child attendance')}
        ${tog('parent_see_fees','Fees','Can view fee status')}
      </div>
    </div>
    <div class="card" style="margin-top:16px;max-width:440px;background:var(--primary-light);border-color:var(--primary);">
      <p style="font-size:13px;color:var(--primary);">Changes apply immediately on next page load.</p>
    </div>`;
}

async function saveDash(key,value){
  const{error}=await db.from('dashboard_settings').update({[key]:value,updated_at:new Date().toISOString()}).eq('school_id',currentUser.school_id);
  if(error){toast(error.message,'error');return;}
  dashSettings[key]=value;
  toast('Setting saved!','success');
}

// ── STUDENT ACCOUNTS ──────────────────────────────────────────
async function renderStudentAccounts(){
  const{data:students}=await db.from('students')
    .select('id,full_name,admission_no,can_login,pin,enrollments(classes(name))')
    .eq('school_id',currentUser.school_id).eq('is_active',true).order('full_name');

  window._stuList=students||[];

  document.getElementById('settingsContent').innerHTML=`
    <div style="max-width:860px;">
      <div class="card" style="margin-bottom:16px;background:var(--info-light);border-color:var(--info);">
        <p style="font-size:13px;color:var(--info);">
          <strong>How Student Login Works:</strong><br>
          Students log in at <strong>student/index.html</strong> using their <strong>Admission Number</strong> as username and a <strong>PIN</strong> you set here.
          Enable the toggle and set a PIN for each student who should have access.
        </p>
      </div>
      <div class="filter-bar">
        <div class="search-box" style="flex:1;max-width:280px;">
          <input class="form-control" id="stuSearch" placeholder="Search…" oninput="filterStu()">
        </div>
        <button class="btn btn--secondary btn--sm" onclick="enableAll()">Enable All</button>
        <button class="btn btn--ghost btn--sm" onclick="disableAll()">Disable All</button>
      </div>
      <div class="card" style="padding:0;">
        <div class="table-wrap" id="stuTable" style="border:none;"></div>
      </div>
    </div>`;

  filterStu();
}

function filterStu(){
  const q=(document.getElementById('stuSearch')?.value||'').toLowerCase();
  const f=(window._stuList||[]).filter(s=>s.full_name.toLowerCase().includes(q)||s.admission_no?.toLowerCase().includes(q));
  renderStuTable(f);
}

function renderStuTable(students){
  if(!students.length){showEmpty('#stuTable','No students found.','👤');return;}
  document.getElementById('stuTable').innerHTML=`
    <table>
      <thead><tr><th>Student</th><th>Class</th><th>Adm. No.</th><th>PIN</th><th>Login</th><th></th></tr></thead>
      <tbody>
        ${students.map(s=>`
          <tr>
            <td><div class="student-cell">
              <div class="avatar avatar--sm">${s.full_name.charAt(0)}</div>
              <div class="info"><div class="name">${s.full_name}</div></div>
            </div></td>
            <td><span class="chip">${s.enrollments?.[0]?.classes?.name||'—'}</span></td>
            <td style="font-family:var(--mono);font-size:13px;">${s.admission_no||'—'}</td>
            <td>
              <input type="text" id="pin-${s.id}" maxlength="8"
                style="width:80px;padding:5px 8px;border:1.5px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:13px;"
                value="${s.pin||''}" placeholder="Set PIN">
            </td>
            <td>
              <label class="toggle">
                <input type="checkbox" ${s.can_login?'checked':''} onchange="toggleStu('${s.id}',this.checked)">
                <span class="slider"></span>
              </label>
            </td>
            <td>
              <button class="btn btn--primary btn--sm" onclick="saveStuPin('${s.id}')">Save</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function toggleStu(id,val){
  await db.from('students').update({can_login:val}).eq('id',id);
  const s=window._stuList?.find(s=>s.id===id); if(s) s.can_login=val;
  toast(`Login ${val?'enabled':'disabled'}.`,'success');
}

async function saveStuPin(id){
  const pin=document.getElementById(`pin-${id}`)?.value?.trim();
  if(!pin||pin.length<4){toast('PIN must be 4+ characters.','error');return;}
  await db.from('students').update({pin,can_login:true}).eq('id',id);
  const s=window._stuList?.find(s=>s.id===id); if(s){s.pin=pin;s.can_login=true;}
  toast('PIN saved! Login enabled.','success');
}

async function enableAll(){
  if(!confirm('Enable login for all students?')) return;
  await db.from('students').update({can_login:true}).eq('school_id',currentUser.school_id).eq('is_active',true);
  toast('All student logins enabled!','success'); renderStudentAccounts();
}

async function disableAll(){
  if(!confirm('Disable all student logins?')) return;
  await db.from('students').update({can_login:false}).eq('school_id',currentUser.school_id);
  toast('All disabled.','success'); renderStudentAccounts();
}
</script>
