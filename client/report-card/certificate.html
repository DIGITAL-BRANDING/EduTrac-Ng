<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Achievement</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<!-- api/database.js is the canonical Supabase client + institution-label system.
     Do NOT also load js/supabase.js here — both files declare the same top-level
     SUPABASE_URL/SUPABASE_ANON_KEY/createClient constants, and loading both in the
     same page throws a SyntaxError that silently blocks every script on the page
     from running at all. See report-cards.html for the same fix applied there. -->
<script src="../api/database.js"></script>
<script src="../js/report-card-engine.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a2e;font-family:'EB Garamond',Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}

/* ── ORIENTATION MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(4px);}
.modal{background:white;border-radius:12px;padding:36px 40px;max-width:460px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-logo{font-size:40px;margin-bottom:14px;}
.modal h2{font-family:'Cinzel',serif;font-size:20px;color:#1a2e6e;margin-bottom:8px;}
.modal p{font-size:13px;color:#666;margin-bottom:24px;line-height:1.6;}
.orient-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.orient-btn{border:2px solid #e0e0e0;border-radius:10px;padding:18px 12px;cursor:pointer;background:white;transition:all .2s;position:relative;}
.orient-btn:hover{border-color:#c8860a;background:#fffbe6;}
.orient-btn.selected{border-color:#c8860a;background:linear-gradient(135deg,#fffbe6,#fff5cc);box-shadow:0 0 0 3px rgba(200,134,10,.15);}
.orient-preview{margin:0 auto 10px;border:2px solid #ddd;background:#f5f5f5;position:relative;}
.orient-preview.land{width:80px;height:56px;}
.orient-preview.port{width:56px;height:80px;}
.orient-preview::after{content:'A';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:#ccc;}
.orient-label{font-family:'Cinzel',serif;font-size:12px;color:#333;font-weight:700;letter-spacing:1px;}
.orient-sub{font-size:10px;color:#888;margin-top:3px;}
.modal-gen-btn{width:100%;padding:12px;background:#1a2e6e;border:none;border-radius:8px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.5px;transition:filter .2s;}
.modal-gen-btn:hover{filter:brightness(1.15);}
.modal-gen-btn:disabled{background:#ddd;color:#aaa;cursor:not-allowed;}
.modal-back{display:block;margin-top:12px;font-size:12px;color:#999;cursor:pointer;text-decoration:underline;}

/* ── TOP CONTROL BAR ── */
.ctrl{background:#0f0f1e;color:white;width:100%;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;print-color-adjust:exact;}
.ctrl-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;color:#f0c040;flex:1;}
.ctrl-btn{padding:7px 16px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.btn-print{background:#1a2e6e;color:#fff;}
.btn-back{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.2);}
.btn-orient{background:rgba(255,255,255,.08);color:#f0c040;border:1px solid rgba(240,192,64,.3);}
.ctrl-badge{font-size:10px;background:rgba(200,134,10,.2);border:1px solid rgba(200,134,10,.4);color:#f0c040;padding:3px 10px;border-radius:20px;font-family:sans-serif;letter-spacing:.5px;}

/* ── LOADING ── */
.loading{color:#f0c040;font-family:'Cinzel',serif;font-size:16px;letter-spacing:2px;padding:60px;text-align:center;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── CERTIFICATE WRAPPER ── */
.cert-page-wrap{padding:20px;width:100%;display:flex;justify-content:center;}

/* ═══════════════════════════════════════
   LANDSCAPE CERTIFICATE DESIGN
   Formal academic credential — restrained navy/gold palette,
   guilloché-style engraved border, no decorative swooshes or
   award-badge graphics. Designed to read as credible for both
   secondary schools and tertiary/vocational institutions.
   ═══════════════════════════════════════ */
.cert-landscape{
  width:280mm;min-height:198mm;
  background:#fdfcf8;
  position:relative;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.4);
}
/* Engraved-line border, evoking banknote/diploma guilloché patterning
   without needing a raster image — built from repeating conic gradients. */
.cert-landscape .c-outer{
  position:absolute;inset:10px;
  border:2px solid #1a2e6e;
  pointer-events:none;z-index:10;
}
.cert-landscape .c-outer::before{
  content:'';position:absolute;inset:6px;
  border:1px solid #a8762a;pointer-events:none;
}
.cert-landscape .c-outer::after{
  content:'';position:absolute;inset:11px;
  border:1px solid #1a2e6e;opacity:.35;pointer-events:none;
}
/* Fine corner flourish — a simple double-line miter, not a multicolor ornament */
.cert-landscape .c-corner{
  position:absolute;width:34px;height:34px;z-index:11;
  border-top:2px solid #a8762a;border-left:2px solid #a8762a;
}
.cert-landscape .c-corner.tl{top:22px;left:22px;}
.cert-landscape .c-corner.tr{top:22px;right:22px;transform:rotate(90deg);}
.cert-landscape .c-corner.bl{bottom:22px;left:22px;transform:rotate(-90deg);}
.cert-landscape .c-corner.br{bottom:22px;right:22px;transform:rotate(180deg);}

/* Faint watermark seal — replaces the multicolor swooshes entirely */
.cert-landscape .c-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:420px;height:420px;z-index:0;opacity:.035;pointer-events:none;
}

/* Content layout */
.cert-landscape .c-content{
  position:relative;z-index:5;
  padding:40px 64px 32px;
  display:flex;flex-direction:column;align-items:center;
  min-height:198mm;
}
.cert-landscape .c-top-row{
  display:flex;align-items:center;gap:20px;width:100%;margin-bottom:6px;
}
.cert-landscape .c-logo{
  width:64px;height:64px;border-radius:6px;
  border:1.5px solid #1a2e6e;
  background:#fff;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.cert-landscape .c-logo img{width:100%;height:100%;object-fit:cover;}
.cert-landscape .c-logo-fb{font-family:'Cinzel',serif;font-size:8px;font-weight:700;color:#1a2e6e;text-align:center;padding:4px;line-height:1.3;}
.cert-landscape .c-school-block{flex:1;text-align:center;}
.cert-landscape .c-school-name{
  font-family:'Cinzel',serif;font-size:clamp(13px,2.2vw,19px);
  font-weight:700;color:#1a2e6e;letter-spacing:1px;line-height:1.2;
  text-transform:uppercase;
}
.cert-landscape .c-school-meta{font-size:10px;color:#666;margin-top:3px;}
.cert-landscape .c-badge-area{width:64px;flex-shrink:0;}
.cert-landscape .c-est{font-size:8.5px;color:#888;letter-spacing:1px;text-transform:uppercase;text-align:center;}

/* Thin formal rule, not a gradient gold bar */
.c-gold-div{height:1px;background:#a8762a;margin:9px auto;width:55%;}
.c-gold-div-full{height:1px;background:#1a2e6e;width:100%;margin:10px 0 4px;opacity:.5;}

/* CERTIFICATE heading */
.cert-landscape .c-cert-label{
  font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:3.5px;color:#666;
  text-transform:uppercase;margin-top:6px;
}
.cert-landscape .c-cert-title{
  font-family:'Cinzel',serif;font-size:clamp(24px,4vw,38px);
  font-weight:700;color:#1a2e6e;letter-spacing:3px;
  line-height:1.15;margin:4px 0 2px;
}
.cert-landscape .c-cert-sub{
  font-family:'Cinzel',serif;font-size:clamp(10px,1.6vw,14px);
  font-weight:600;color:#a8762a;letter-spacing:2.5px;
  text-transform:uppercase;
}

/* Formal presentation line — replaces the gold ribbon banner */
.cert-landscape .c-ribbon{
  font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:3px;
  color:#1a2e6e;font-weight:600;text-transform:uppercase;
  text-align:center;margin:16px 0 4px;
  padding-bottom:6px;border-bottom:1px solid #d8c7a0;
  width:60%;
}

/* Recipient name */
.cert-landscape .c-presented{
  font-family:'EB Garamond',Georgia,serif;font-size:13px;color:#555;
  margin-bottom:6px;margin-top:10px;
}
.cert-landscape .c-name{
  font-family:'Cormorant Garamond',serif;font-size:clamp(24px,4vw,40px);
  font-weight:600;font-style:normal;color:#1a2e6e;
  letter-spacing:1.5px;line-height:1.1;text-transform:uppercase;
}
.cert-landscape .c-name-line{
  width:58%;height:1px;background:#a8762a;
  margin:8px auto;
}

/* Body text */
.cert-landscape .c-body{
  font-family:'EB Garamond',Georgia,serif;font-size:13.5px;
  color:#333;text-align:center;line-height:1.8;
  max-width:500px;margin:4px auto;
}
.cert-landscape .c-achievement{
  display:inline-block;margin:10px 0;
  padding:7px 30px;
  background:#fff;
  border:1px solid #1a2e6e;border-radius:2px;
  font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.5px;
  font-weight:700;color:#1a2e6e;
}
.cert-landscape .c-stats{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0;
}
.cert-landscape .c-stat{
  text-align:center;padding:7px 16px;
  background:#fff;border:1px solid #d8c7a0;border-radius:2px;
  min-width:80px;
}
.cert-landscape .c-stat-val{
  font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:#1a2e6e;display:block;
}
.cert-landscape .c-stat-lbl{font-size:8.5px;color:#888;letter-spacing:.5px;text-transform:uppercase;}

/* Bottom signatures */
.cert-landscape .c-sig-row{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:16px;width:100%;margin-top:auto;padding-top:16px;
  border-top:1px solid #d8c7a0;align-items:end;
}
.cert-landscape .c-sig-blk{text-align:center;}
.cert-landscape .c-sig-img{min-height:40px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px;}
.cert-landscape .c-sig-img img{max-height:40px;max-width:100%;object-fit:contain;}
.cert-landscape .c-sig-line{border-top:1px solid #555;width:80%;margin:0 auto 4px;}
.cert-landscape .c-sig-la{font-family:'Cinzel',serif;font-size:9px;color:#222;letter-spacing:.5px;text-transform:uppercase;}
.cert-landscape .c-sig-sl{font-size:8px;color:#999;margin-top:1px;}
/* Formal seal device — concentric rings with a star motif, not an award badge */
.c-seal-svg{width:66px;height:66px;flex-shrink:0;}

/* Bottom strip — single restrained navy rule instead of a candy-stripe band */
.cert-landscape .c-bot-strip{
  position:absolute;bottom:0;left:0;right:0;height:5px;
  background:#1a2e6e;
  z-index:12;
}
.cert-landscape .c-top-strip{
  position:absolute;top:0;left:0;right:0;height:5px;
  background:#1a2e6e;
  z-index:12;
}

/* ═══════════════════════════════════════
   PORTRAIT CERTIFICATE DESIGN
   Formal academic credential, matching the landscape redesign.
   ═══════════════════════════════════════ */
.cert-portrait{
  width:210mm;min-height:297mm;
  background:#fdfcf8;position:relative;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.4);
}
/* Navy side panels — restrained, no gold gradient accent */
.cert-portrait .p-side-l{
  position:absolute;top:0;left:0;width:30px;bottom:0;
  background:#1a2e6e;z-index:2;
}
.cert-portrait .p-side-r{
  position:absolute;top:0;right:0;width:30px;bottom:0;
  background:#1a2e6e;z-index:2;
}
.cert-portrait .p-side-l::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:2px;
  background:#a8762a;
}
.cert-portrait .p-side-r::after{
  content:'';position:absolute;top:0;left:0;bottom:0;width:2px;
  background:#a8762a;
}
/* Single restrained top/bottom rule instead of a gold gradient band */
.cert-portrait .p-top-band{
  position:absolute;top:0;left:30px;right:30px;height:3px;
  background:#1a2e6e;z-index:3;
}
.cert-portrait .p-bot-band{
  position:absolute;bottom:0;left:30px;right:30px;height:3px;
  background:#1a2e6e;z-index:3;
}
/* Inner border */
.cert-portrait .p-inner-border{
  position:absolute;top:18px;left:44px;right:44px;bottom:18px;
  border:1.5px solid #1a2e6e;z-index:3;pointer-events:none;
}
.cert-portrait .p-inner-border::before{
  content:'';position:absolute;inset:5px;border:1px solid #a8762a;pointer-events:none;
}

/* Faint watermark seal */
.cert-portrait .p-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:280px;height:280px;z-index:1;opacity:.03;pointer-events:none;
}

/* Content */
.cert-portrait .p-content{
  position:relative;z-index:5;
  padding:30px 64px 24px;
  display:flex;flex-direction:column;align-items:center;
  min-height:297mm;
}
.cert-portrait .p-logo{
  width:70px;height:70px;border-radius:6px;
  border:1.5px solid #1a2e6e;
  background:#fff;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;margin-top:6px;
}
.cert-portrait .p-logo img{width:100%;height:100%;object-fit:cover;}
.cert-portrait .p-logo-fb{font-family:'Cinzel',serif;font-size:8px;font-weight:700;color:#1a2e6e;text-align:center;padding:5px;}
.cert-portrait .p-school-name{
  font-family:'Cinzel',serif;font-size:clamp(13px,2vw,17px);
  font-weight:700;color:#1a2e6e;text-align:center;letter-spacing:1px;
  text-transform:uppercase;
}
.cert-portrait .p-school-meta{font-size:9.5px;color:#666;margin-top:2px;text-align:center;}
.cert-portrait .p-cert-label{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:3.5px;color:#666;text-transform:uppercase;margin:14px 0 3px;}
.cert-portrait .p-cert-title{
  font-family:'Cinzel',serif;font-size:clamp(20px,3.5vw,30px);
  font-weight:700;color:#1a2e6e;letter-spacing:2.5px;text-align:center;line-height:1.2;
}
.cert-portrait .p-cert-sub{
  font-family:'Cinzel',serif;font-size:10px;font-weight:600;
  color:#a8762a;letter-spacing:2.5px;text-transform:uppercase;margin-top:3px;
}
.cert-portrait .p-ribbon{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:2.5px;
  color:#1a2e6e;font-weight:600;text-transform:uppercase;
  text-align:center;margin:18px 0 4px;
  padding-bottom:6px;border-bottom:1px solid #d8c7a0;width:70%;
}
.cert-portrait .p-presented{
  font-family:'EB Garamond',Georgia,serif;font-size:12.5px;color:#555;margin-bottom:6px;margin-top:8px;
}
.cert-portrait .p-name{
  font-family:'Cormorant Garamond',serif;font-size:clamp(22px,3.8vw,32px);
  font-weight:600;color:#1a2e6e;letter-spacing:1px;
  text-align:center;line-height:1.2;text-transform:uppercase;
}
.cert-portrait .p-name-line{
  width:65%;height:1px;background:#a8762a;
  margin:8px auto;
}
.cert-portrait .p-body{
  font-family:'EB Garamond',Georgia,serif;font-size:13px;
  color:#333;text-align:center;line-height:1.85;width:100%;
}
.cert-portrait .p-achievement{
  display:inline-block;margin:10px 0;
  padding:7px 26px;
  background:#fff;
  border:1px solid #1a2e6e;border-radius:2px;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.5px;
  font-weight:700;color:#1a2e6e;text-align:center;
}
.cert-portrait .p-stats{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0;
}
.cert-portrait .p-stat{
  text-align:center;padding:8px 14px;
  background:#fff;border:1px solid #d8c7a0;border-radius:2px;min-width:76px;
}
.cert-portrait .p-stat-val{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:#1a2e6e;display:block;}
.cert-portrait .p-stat-lbl{font-size:8px;color:#888;letter-spacing:.5px;text-transform:uppercase;}
.cert-portrait .p-seal-row{display:flex;justify-content:center;margin:14px 0;}
.p-seal-svg{width:68px;height:68px;}
.cert-portrait .p-sig-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:16px;width:100%;margin-top:auto;padding-top:16px;
  border-top:1px solid #d8c7a0;
}
.cert-portrait .p-sig-blk{text-align:center;}
.cert-portrait .p-sig-img{min-height:36px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:3px;}
.cert-portrait .p-sig-img img{max-height:36px;max-width:90%;object-fit:contain;}
.cert-portrait .p-sig-line{border-top:1px solid #555;width:80%;margin:0 auto 4px;}
.cert-portrait .p-sig-la{font-family:'Cinzel',serif;font-size:9px;color:#222;letter-spacing:.5px;text-transform:uppercase;}
.cert-portrait .p-sig-sl{font-size:8px;color:#999;margin-top:1px;}
.cert-portrait .p-cert-no{font-size:9px;color:#999;font-family:sans-serif;margin-top:10px;text-align:center;}

@media print{
  body{background:white;}
  .ctrl{display:none!important;}
  .cert-page-wrap{padding:0;}
  .cert-landscape,.cert-portrait{box-shadow:none!important;}
  @page{margin:0;}
}
@media screen and (max-width:600px){
  .cert-landscape{width:100%;min-height:auto;}
  .cert-portrait{width:100%;min-height:auto;}
}
</style>
</head>
<body>

<!-- ORIENTATION MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-logo" style="font-size:32px;">📜</div>
    <h2>Generate Certificate</h2>
    <p>Choose your preferred orientation before generating the certificate.</p>
    <div class="orient-grid">
      <div class="orient-btn selected" id="btnLand" onclick="selectOrient('landscape')">
        <div class="orient-preview land"></div>
        <div class="orient-label">LANDSCAPE</div>
        <div class="orient-sub">297mm × 210mm<br>A4 Horizontal</div>
      </div>
      <div class="orient-btn" id="btnPort" onclick="selectOrient('portrait')">
        <div class="orient-preview port"></div>
        <div class="orient-label">PORTRAIT</div>
        <div class="orient-sub">210mm × 297mm<br>A4 Vertical</div>
      </div>
    </div>
    <button class="modal-gen-btn" id="genBtn" onclick="generateCert()">Generate Certificate</button>
    <span class="modal-back" onclick="history.back()">← Go back</span>
  </div>
</div>

<!-- CONTROL BAR -->
<div class="ctrl" id="ctrlBar" style="display:none">
  <span class="ctrl-title">✦ Certificate of Achievement</span>
  <span class="ctrl-badge" id="orientBadge">LANDSCAPE</span>
  <button class="ctrl-btn btn-orient" onclick="changeOrient()">⟳ Change Orientation</button>
  <button class="ctrl-btn btn-print" onclick="window.print()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    Print / Save PDF
  </button>
  <button class="ctrl-btn btn-back" onclick="history.back()">← Back</button>
</div>

<div id="mainContent">
  <div class="loading">Loading certificate data…</div>
</div>

<script>
const p = new URLSearchParams(location.search);
const STUDENT_ID = p.get('student_id');
const TERM_ID    = p.get('term_id');

let _orient = 'landscape';
let _data   = null;

// ── Guard: ensure report-card-engine.js loaded (detectTheme/getCardTheme defined there) ──
if (typeof detectTheme === 'undefined') {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('modalBg').style.display = 'none';
    document.getElementById('ctrlBar').style.display = 'flex';
    showErr(
      'Certificate engine failed to load',
      'The file js/report-card-engine.js could not be loaded. This is usually caused by a ' +
      'network error or missing file. Please ensure the file exists at ../js/report-card-engine.js and refresh.'
    );
  });
}

function showErr(msg, detail = '') {
  const mc = document.getElementById('mainContent');
  if (!mc) return;
  mc.innerHTML = `

async function pageQuery(label, query, timeoutMs = 12000) {
  const timer = new Promise((_, rej) =>
    setTimeout(() => rej(new Error(`"${label}" timed out after ${timeoutMs/1000}s. Check your connection and retry.`)), timeoutMs)
  );
  try {
    const result = await Promise.race([query, timer]);
    if (result?.error) { console.warn(label, result.error.message); return null; }
    // Supabase query results have a .data property; plain async helpers like
    // getCurrentUser() resolve directly to the value itself — handle both.
    return result?.data !== undefined ? result.data : result;
  } catch(e) { console.warn(label, e.message || e); return null; }
}

function gradeFromScale(score, scale) {
  if (score === null || score === undefined || !scale?.length) return { grade: '—', remark: '' };
  const g = scale.find(s => score >= s.min_score && score <= s.max_score);
  return g ? { grade: g.grade, remark: g.remark || '' } : { grade: '—', remark: '' };
}
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }); }
  catch { return d; }
}

async function loadData() {
  if (!STUDENT_ID || !TERM_ID) {
    await showStudentPicker('certificate');
    return;
  }
  try {
    const student = await pageQuery('Student', db.from('students').select('*').eq('id', STUDENT_ID).single());
    if (!student) throw new Error('Student not found');

    const schoolId = student.school_id;

    const [school, scale, term, results, affective] = await Promise.all([
      pageQuery('School', db.from('schools').select('name,school_type,logo_url,address,state,lga,phone,email,motto,principal_signature_url,class_teacher_signature_url,vp_signature_url,exam_officer_signature_url').eq('id', schoolId).single()),
      pageQuery('Scale',  db.from('grading_scales').select('*').eq('school_id', schoolId).order('min_score', { ascending: false })),
      pageQuery('Term',   db.from('terms').select('*,academic_years(label)').eq('id', TERM_ID).single()),
      pageQuery('Results', db.from('results').select('score,subject_id,exam_id,subjects(id,name),exams(id,name,max_score,weight)').eq('student_id', STUDENT_ID).eq('term_id', TERM_ID)),
      pageQuery('Affective', db.from('affective_domain').select('*').eq('student_id', STUDENT_ID).eq('term_id', TERM_ID).maybeSingle()),
    ]);

    // Build unique subjects from results only
    const subMap = new Map();
    (results || []).forEach(r => {
      if (!subMap.has(r.subject_id)) subMap.set(r.subject_id, { name: r.subjects?.name || '—', rows: [] });
      subMap.get(r.subject_id).rows.push(r);
    });
    const subRows = [...subMap.values()].map(sub => {
      const tw = sub.rows.reduce((s, r) => s + (r.exams?.weight || 1), 0);
      const ws = sub.rows.reduce((s, r) => s + (r.score / (r.exams?.max_score || 100)) * 100 * (r.exams?.weight || 1), 0);
      const total = tw > 0 ? Math.round(ws / tw * 10) / 10 : null;
      const g = gradeFromScale(total, scale || []);
      return { name: sub.name, total, grade: g.grade, remark: g.remark };
    });

    const ws2 = subRows.filter(s => s.total !== null);
    const avg = ws2.length ? Math.round(ws2.reduce((s, r) => s + r.total, 0) / ws2.length * 10) / 10 : null;
    const totalSubjects = subRows.length;
    const passedSubjects = subRows.filter(s => s.grade && s.grade !== 'F' && s.grade !== '—').length;
    const og = gradeFromScale(avg, scale || []);
    const sessLabel = (term?.academic_years?.label || term?.name) || 'Current Session';

    // Enrollment for class name
    const enr = await pageQuery('Enrollment', db.from('enrollments').select('class_id,classes(id,name,level,section)').eq('student_id', STUDENT_ID).eq('term_id', TERM_ID).maybeSingle());
    const className = enr?.classes?.name || '—';
    const classRow  = enr?.classes || null;

    // ── Institution-aware theme + vocabulary ──────────────────────────────
    // detectTheme() and getInstitutionLabelsFor() come from report-card-engine.js
    // and api/database.js respectively (loaded at the top of this page). This is
    // the SAME detection logic report-cards.html uses, so a certificate for a
    // vocational training centre, tertiary institute, or computer training
    // school automatically uses the right words ("Trainee" vs "Student",
    // "Programme" vs "Class", "Instructor" vs "Class Teacher") and the same
    // visual theme key the report card would use for this school.
    const theme  = (typeof detectTheme === 'function') ? detectTheme(school?.school_type || null, classRow) : 'secondary';
    const vocab  = (typeof getInstitutionLabelsFor === 'function')
      ? getInstitutionLabelsFor(school?.school_type || 'o_level')
      : { institution:'Student', learner:'Student', class:'Class', subject:'Subject', period:'Term', session:'Academic Session', program:'Programme' };

    window._cert_school_type = window.normaliseSchoolType ? window.normaliseSchoolType(school?.school_type) : (school?.school_type || 'o_level');

    _data = { student, school, scale, term, subRows, avg, totalSubjects, passedSubjects, og, sessLabel, affective, className, theme, vocab };
    renderCert(_data);
  } catch(e) {
    showErr('Could not generate certificate', e.message || String(e));
  }
}

function renderCert(d) {
  const { student, school, subRows, avg, totalSubjects, passedSubjects, og, sessLabel, affective, className, theme, vocab } = d;
  const v = vocab || { institution:'School', learner:'Student', class:'Class', subject:'Subject', period:'Term', session:'Academic Session', program:'Programme' };
  const certNo = `CERT-${new Date().getFullYear()}-${student.id?.slice(0, 6).toUpperCase() || '000000'}`;
  const today = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  const logoH = school?.logo_url ? `<img src="${school.logo_url}" alt="logo">` : `<div class="c-logo-fb">CREST</div>`;
  const logoHP = school?.logo_url ? `<img src="${school.logo_url}" alt="logo">` : `<div class="p-logo-fb">CREST</div>`;
  const parts = [school?.address, school?.lga, school?.state].filter(Boolean).join(', ');
  const meta = school?.phone ? `${parts} | Tel: ${school.phone}` : parts;

  // ── Institution-aware wording ──────────────────────────────────────────
  // Same visual design for every institution type — only the words change,
  // driven by vocab (from getInstitutionLabelsFor) and theme (from detectTheme).
  // theme: nursery | primary | secondary | vocational | tertiary
  const isVocational = theme === 'vocational';
  const isTertiary   = theme === 'tertiary';

  // What the relationship line under the name says
  const relationLabel = isTertiary
    ? 'Matric / Reg. No'
    : isVocational
      ? 'Trainee ID'
      : 'Admission No';
  const relationValue = student.admission_no || student.roll_no || student.matric_no || '—';
  const guardianLine = (isTertiary || isVocational)
    ? '' // tertiary/vocational certs usually omit parent/guardian — not relevant for adult learners

async function pickerLoadStudents() {
  const classId = document.getElementById('pickerClass')?.value;
  const termId  = document.getElementById('pickerTerm')?.value;
  const sel     = document.getElementById('pickerStudent');
  if (!classId || !termId || !sel) return;
  sel.innerHTML = '<option>Loading…</option>';
  const enr = await pageQuery('Enrollment by term', db.from('enrollments').select('student_id').eq('class_id',classId).eq('term_id',termId));
  if (!enr?.length) {
    const enr2 = await pageQuery('Enrollment (fallback)', db.from('enrollments').select('student_id').eq('class_id',classId));
    if (!enr2?.length) { sel.innerHTML='<option>No one enrolled</option>'; return; }
    const ids = enr2.map(e=>e.student_id);
    const studs = await pageQuery('Students (fallback)', db.from('students').select('id,full_name,admission_no').in('id',ids).order('full_name'));
    sel.innerHTML = (studs||[]).map(s=>`<option value="${s.id}">${s.full_name}${s.admission_no?' ('+s.admission_no+')':''}</option>`).join('');
    return;
  }
  const ids = enr.map(e=>e.student_id);
  const studs = await pageQuery('Students', db.from('students').select('id,full_name,admission_no').in('id',ids).order('full_name'));
  sel.innerHTML = (studs||[]).map(s=>`<option value="${s.id}">${s.full_name}${s.admission_no?' ('+s.admission_no+')':''}</option>`).join('');
}
function pickerGo(pageType) {
  const studentId = document.getElementById('pickerStudent')?.value;
  const termId    = document.getElementById('pickerTerm')?.value;
  if (!studentId || !termId) { alert('Please select a student and term.'); return; }
  const target = pageType === 'certificate' ? 'certificate.html' : 'testimonial.html';
  location.href = `${target}?student_id=${encodeURIComponent(studentId)}&term_id=${encodeURIComponent(termId)}`;
}

window.addEventListener('DOMContentLoaded', () => {
  if (!STUDENT_ID || !TERM_ID) {
    document.getElementById('modalBg').style.display = 'none';
    document.getElementById('ctrlBar').style.display = 'flex';
    showStudentPicker('certificate');
  }
});
</script>
