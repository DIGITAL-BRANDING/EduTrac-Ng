<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Testimonial Scholar | Academic Registry</title>
  <!-- Premium Typography: Cormorant Garamond + Manrope + Cinzel for elegance -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Educational, refined palette: deep navy, parchment, burgundy accents */
    :root {
      --navy-deep: #0a1c3a;
      --parchment: #faf6ed;
      --parchment-dark: #ede5d3;
      --burgundy: #7a2e3a;
      --gold-muted: #b8944c;
      --slate: #2c3e4e;
      --border-light: #dcd0b0;
      --shadow-sm: 0 12px 28px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
    }

    body {
      background: linear-gradient(145deg, #d4cdb4 0%, #c2b68e 100%);
      font-family: 'Manrope', sans-serif;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }
    
    /* subtle herringbone pattern overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" opacity="0.08"><path fill="none" d="M0 0h24v24H0z"/><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="%233b2f2a" stroke-width="1.2"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    /* MAIN CONTROL PANEL – elegant card */
    .control-panel {
      max-width: 960px;
      width: 100%;
      background: var(--parchment);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      position: relative;
      z-index: 2;
      margin-bottom: 3rem;
      border: 1px solid rgba(186, 148, 76, 0.3);
      backdrop-filter: blur(0px);
    }

    .panel-header {
      background: var(--navy-deep);
      padding: 1.6rem 2.2rem;
      border-bottom: 4px solid var(--gold-muted);
    }

    .panel-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--parchment);
      margin: 0;
      line-height: 1.2;
    }

    .panel-header p {
      font-family: 'Manrope', sans-serif;
      font-size: 0.85rem;
      color: rgba(250, 246, 237, 0.75);
      margin-top: 0.5rem;
      letter-spacing: 0.3px;
    }

    .panel-body {
      padding: 2rem 2.2rem;
    }

    /* section grid - clean professional tabs */
    .section-nav {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 1.5px solid var(--border-light);
      padding-bottom: 1rem;
    }

    .section-tab {
      background: transparent;
      border: none;
      padding: 0.7rem 1.6rem;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      color: var(--slate);
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 40px;
    }

    .section-tab.active {
      background: var(--navy-deep);
      color: var(--parchment);
      box-shadow: 0 4px 10px rgba(10, 28, 58, 0.2);
    }

    .section-tab:hover:not(.active) {
      background: var(--parchment-dark);
      color: var(--burgundy);
    }

    /* filter row */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
    }

    .field-group {
      flex: 1;
      min-width: 180px;
    }

    .field-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--burgundy);
      margin-bottom: 0.5rem;
    }

    select, input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: white;
      border: 1.5px solid var(--border-light);
      border-radius: 14px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.9rem;
      transition: all 0.2s;
      color: var(--navy-deep);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--gold-muted);
      box-shadow: 0 0 0 3px rgba(184, 148, 76, 0.2);
    }

    /* radio cards - professional */
    .selection-mode {
      background: var(--parchment-dark);
      border-radius: 20px;
      padding: 1.2rem 1.8rem;
      margin: 1.2rem 0 1.5rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      border: 1px solid var(--border-light);
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--navy-deep);
    }

    .mode-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--burgundy);
    }

    /* dynamic containers */
    .dynamic-container {
      margin: 1rem 0 1.2rem;
      transition: all 0.2s;
    }

    /* color customization row */
    .customize-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 1rem 0;
      margin-top: 0.5rem;
      border-top: 1px dashed var(--border-light);
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: white;
      padding: 0.4rem 1rem 0.4rem 0.8rem;
      border-radius: 40px;
      border: 1px solid var(--border-light);
    }

    .color-picker span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--slate);
    }

    input[type="color"] {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
      padding: 0;
    }

    /* action buttons */
    .action-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.9rem 1.8rem;
      border-radius: 40px;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-size: 0.8rem;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--navy-deep);
      color: var(--navy-deep);
    }

    .btn-outline:hover {
      background: var(--navy-deep);
      color: white;
    }

    .btn-primary {
      background: var(--burgundy);
      color: white;
      box-shadow: 0 4px 12px rgba(122, 46, 58, 0.3);
    }

    .btn-primary:hover {
      background: #5f2430;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--gold-muted);
      color: var(--navy-deep);
    }

    /* TESTIMONIAL DISPLAY AREA - A4 ready, centered, artistic */
    .testimonial-stage {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      background: rgba(42, 38, 32, 0.2);
      border-radius: 32px;
      padding: 2rem 1rem;
      position: relative;
      z-index: 2;
    }

    /* The actual testimonial certificate - elegant classic */
    .testimonial-certificate {
      max-width: 1000px;
      width: 100%;
      background: var(--parchment);
      border-radius: 20px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      transition: all 0.2s;
      border: 1px solid rgba(186, 148, 76, 0.5);
      position: relative;
    }
    
    /* creative inner background pattern (educational vintage) */
    .testimonial-certificate::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.04"><path fill="none" d="M70 30 L130 30 L150 70 L130 110 L70 110 L50 70 Z" stroke="%237a2e3a" stroke-width="2"/><circle cx="100" cy="70" r="18" stroke="%23b8944c" stroke-width="1.5" fill="none"/><path d="M85 85 L115 85 M100 75 L100 95" stroke="%230a1c3a" stroke-width="1.2"/></svg>');
      background-repeat: repeat;
      background-size: 42px;
      pointer-events: none;
      opacity: 0.2;
      border-radius: 20px;
    }

    .certificate-inner {
      padding: 2.5rem 2.8rem;
      position: relative;
      z-index: 2;
    }

    /* header emblem */
    .cert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--gold-muted);
      padding-bottom: 1rem;
      margin-bottom: 1.2rem;
    }

    .crest {
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, var(--navy-deep), #152c4e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      font-weight: 700;
      color: var(--gold-muted);
      text-align: center;
      line-height: 1.3;
      border: 2px solid var(--gold-muted);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .institution h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--navy-deep);
      letter-spacing: -0.3px;
    }

    .institution .motto {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--burgundy);
    }

    .testimonial-head {
      text-align: center;
      margin: 1rem 0 1rem;
    }

    .testimonial-head h3 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--burgundy);
    }

    .divider-line {
      width: 90px;
      height: 2px;
      background: var(--gold-muted);
      margin: 0.5rem auto;
    }

    /* grid info */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 1.8rem;
      margin: 1.8rem 0;
    }

    .info-item {
      font-family: 'Manrope', sans-serif;
      font-size: 0.85rem;
      border-bottom: 1px dashed #e2d8c0;
      padding-bottom: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .info-label {
      font-weight: 700;
      color: var(--navy-deep);
      letter-spacing: 0.3px;
    }

    .info-value {
      color: #3a2c24;
      font-weight: 500;
    }

    .recommendation {
      background: rgba(184, 148, 76, 0.08);
      padding: 1rem 1.5rem;
      border-left: 5px solid var(--burgundy);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
      margin: 1.2rem 0;
      border-radius: 0 16px 16px 0;
    }

    .signature-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .signature-block {
      text-align: center;
      min-width: 150px;
    }

    .signature-line {
      width: 160px;
      border-top: 1.8px solid var(--navy-deep);
      margin: 0.5rem auto;
    }

    .official-stamp {
      border: 2.5px double var(--burgundy);
      padding: 0.7rem 1.2rem;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--burgundy);
      transform: rotate(-3deg);
      background: rgba(255,255,240,0.5);
    }

    .ref-footer {
      text-align: right;
      font-size: 0.7rem;
      font-family: monospace;
      margin-top: 1.2rem;
      color: #6e5c4b;
      border-top: 1px solid var(--border-light);
      padding-top: 0.8rem;
    }

    /* print */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .control-panel, .action-buttons, .customize-row, .section-nav, .filter-row, .selection-mode, .dynamic-container {
        display: none !important;
      }
      .testimonial-stage {
        background: white;
        padding: 0;
      }
      .testimonial-certificate {
        box-shadow: none;
        border: 1px solid #ccc;
      }
      @page {
        size: A4;
        margin: 1.6cm;
      }
    }

    .placeholder-message {
      text-align: center;
      padding: 3rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: var(--navy-deep);
      background: var(--parchment);
      border-radius: 24px;
    }
  </style>
</head>
<body>

<div class="control-panel">
  <div class="panel-header">
    <h1>Testimonial Scholar · Academic Registry</h1>
    <p>Official character reference & completion testimonial | Session based issuance</p>
  </div>
  <div class="panel-body">
    <!-- Four sections -->
    <div class="section-nav">
      <button class="section-tab" data-section="nursery">Nursery Section</button>
      <button class="section-tab" data-section="primary">Primary Section</button>
      <button class="section-tab" data-section="junior">Junior Section (JSS)</button>
      <button class="section-tab active" data-section="senior">Senior Section (SSS)</button>
    </div>

    <div class="filter-row">
      <div class="field-group">
        <label>Select Class</label>
        <select id="classSelect"><option>— Choose section first —</option></select>
      </div>
      <div class="field-group">
        <label>Academic Session</label>
        <select id="sessionSelect">
          <option>2023/2024</option>
          <option>2024/2025</option>
          <option selected>2025/2026</option>
          <option>2026/2027</option>
        </select>
      </div>
    </div>

    <div class="selection-mode">
      <label class="mode-option">
        <input type="radio" name="genMode" value="all" checked> Entire Class Batch
      </label>
      <label class="mode-option">
        <input type="radio" name="genMode" value="single"> Select Individual Student
      </label>
      <label class="mode-option">
        <input type="radio" name="genMode" value="admission"> Admission Number
      </label>
    </div>

    <div id="studentSelectContainer" class="dynamic-container" style="display: none;">
      <div class="field-group">
        <label>Student Full Name</label>
        <select id="studentSelectDropdown"><option>— Load class roster —</option></select>
      </div>
    </div>

    <div id="admissionContainer" class="dynamic-container" style="display: none;">
      <div class="field-group">
        <label>Admission Number</label>
        <input type="text" id="admissionNumberInput" placeholder="e.g., ALH/25/JS/001088">
      </div>
    </div>

    <div class="customize-row">
      <div class="color-picker">
        <span>Primary Color</span>
        <input type="color" id="primaryColor" value="#7a2e3a">
      </div>
      <div class="color-picker">
        <span>Accent Color</span>
        <input type="color" id="accentColor" value="#b8944c">
      </div>
      <div style="font-size: 0.7rem; color:#5f4c3b;">Customize school theme</div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-outline" id="loadRosterBtn">Load Class Roster</button>
      <button class="btn btn-primary" id="generateBtn">Generate Testimonial</button>
      <button class="btn btn-secondary" id="printPdfBtn">Print / Save PDF</button>
    </div>
  </div>
</div>

<div class="testimonial-stage" id="testimonialStage">
  <div class="placeholder-message">Select section, class and load roster. Generate official testimonial (session based).</div>
</div>

<script>
  // ---------------- ACADEMIC DATABASE with extended profiles ----------------
  const SCHOOL_DATA = {
    nursery: { classes: [{ id: "nur1", name: "NURSERY 1", students: ["Amina Yusuf", "Zainab Idris", "Ibrahim Musa", "Safiya Bello"] }, { id: "nur2", name: "NURSERY 2", students: ["Fatima Kano", "Hassan Lawal", "Rukayya Sani"] }] },
    primary: { classes: [{ id: "basic3", name: "BASIC 3", students: ["Precious John", "Esther Obi", "David Okafor", "Miracle Eze"] }, { id: "basic5", name: "BASIC 5", students: ["Chiamaka Nwachukwu", "Emmanuel Okafor", "Favour Nduka"] }, { id: "basic6", name: "BASIC 6", students: ["Daniel Nnamdi", "Praise Okafor", "Joshua Adekunle"] }] },
    junior: { classes: [{ id: "jss1a", name: "JSS 1A", students: ["RABIATUSANI", "Michael Eze", "Blessing Okonkwo", "Chinedu Obi"] }, { id: "jss2b", name: "JSS 2B", students: ["Samuel Adeyemi", "Victoria James", "Emeka Okafor"] }, { id: "jss3c", name: "JSS 3C", students: ["Patience Bassey", "Joseph Udo", "Mercy Effiong"] }] },
    senior: { classes: [{ id: "sss1sci", name: "SSS 1 SCIENCE", students: ["Grace Emmanuel", "Peter Oyewole", "Daniel Idowu"] }, { id: "sss2art", name: "SSS 2 ART", students: ["Mariam Bello", "Chinedu Obi", "Omotola Hassan"] }, { id: "sss3com", name: "SSS 3 COMMERCE", students: ["Taiwo Hassan", "Kehinde Akin", "Oluwaseun Adeola", "Ruth Samuel"] }] }
  };

  const STUDENT_DETAILS = {
    "RABIATUSANI": { admission: "ALH/25/JS/001088", dob: "25 April 2012", father: "Alhaji Musa Aliyu", conduct: "Exemplary", hobby: "Debate & Literature", post: "Senior Class Prefect", avg: 98.2, grade: "A1" },
    "Michael Eze": { admission: "MIC/JS/002301", dob: "15 May 2011", father: "Chief Emmanuel Eze", conduct: "Very Good", hobby: "Football", post: "Sports Prefect", avg: 78.4, grade: "B2" },
    "Blessing Okonkwo": { admission: "BLE/JS/004512", dob: "2 Feb 2012", father: "Mr. Peter Okonkwo", conduct: "Good", hobby: "Drawing & Arts", post: "", avg: 85.6, grade: "B+" },
    "Grace Emmanuel": { admission: "GRA/SSS/1023", dob: "12 Sep 2006", father: "Chief Emmanuel Udo", conduct: "Outstanding", hobby: "Public Speaking", post: "Head Girl", avg: 96.5, grade: "A1" },
    "Samuel Adeyemi": { admission: "SAM/JS/006734", dob: "30 Aug 2010", father: "Pastor Adeyemi", conduct: "Excellent", hobby: "Chess", post: "Assistant Head Boy", avg: 94.2, grade: "A1" },
    "Amina Yusuf": { admission: "AMN/NUR/023", dob: "10 Jan 2018", father: "Alhaji Yusuf", conduct: "Polite & Diligent", hobby: "Recitation", post: "Class Monitor", avg: 91.0, grade: "A" },
    "Precious John": { admission: "PRE/PRI/101", dob: "14 Aug 2015", father: "Mr. John Okafor", conduct: "Satisfactory", hobby: "Mathematics", post: "", avg: 68.5, grade: "C+" },
    "Joshua Adekunle": { admission: "JSH/PRI/889", dob: "5 Jul 2014", father: "Elder Adekunle", conduct: "Good", hobby: "Science Club", post: "Library Prefect", avg: 82.0, grade: "B+" },
    "Taiwo Hassan": { admission: "TAI/SSS/4452", dob: "12 Oct 2007", father: "Mr. Hassan Bello", conduct: "Very Good", hobby: "Technology", post: "ICT Prefect", avg: 88.4, grade: "A" },
    "Victoria James": { admission: "VIC/JS/3412", dob: "21 Mar 2011", father: "Mr. James Okon", conduct: "Commendable", hobby: "Singing", post: "Culture Prefect", avg: 81.2, grade: "B+" }
  };

  function getStudentProfile(name) {
    return STUDENT_DETAILS[name] || { admission: `SCH/${Math.floor(1000+Math.random()*9000)}`, dob: "1 Jan 2015", father: "Mr. Guardian", conduct: "Good Standing", hobby: "Creative Writing", post: "—", avg: 76.4, grade: "B" };
  }

  let currentSection = "senior";
  let currentClassObj = null;
  let currentStudentsList = [];

  // DOM refs
  const classSelect = document.getElementById('classSelect');
  const studentSelectDropdown = document.getElementById('studentSelectDropdown');
  const studentSelectContainer = document.getElementById('studentSelectContainer');
  const admissionContainer = document.getElementById('admissionContainer');
  const loadRosterBtn = document.getElementById('loadRosterBtn');
  const generateBtn = document.getElementById('generateBtn');
  const printBtn = document.getElementById('printPdfBtn');
  const stage = document.getElementById('testimonialStage');
  const primaryColorPicker = document.getElementById('primaryColor');
  const accentColorPicker = document.getElementById('accentColor');

  function populateClasses() {
    const classes = SCHOOL_DATA[currentSection]?.classes || [];
    classSelect.innerHTML = '<option value="">— Select Class —</option>';
    classes.forEach(cls => {
      const opt = document.createElement('option');
      opt.value = cls.id;
      opt.textContent = cls.name;
      classSelect.appendChild(opt);
    });
    studentSelectDropdown.innerHTML = '<option>— Load class first —</option>';
  }

  function loadClassDetails() {
    const classId = classSelect.value;
    if (!classId) { alert("Please select a class before loading roster."); return false; }
    const section = SCHOOL_DATA[currentSection];
    const found = section.classes.find(c => c.id === classId);
    if (!found) return false;
    currentClassObj = found;
    currentStudentsList = [...found.students];
    studentSelectDropdown.innerHTML = '<option value="">— Select student —</option>';
    currentStudentsList.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      studentSelectDropdown.appendChild(opt);
    });
    alert(`Roster loaded: ${currentStudentsList.length} students in ${currentClassObj.name}`);
    return true;
  }

  function toggleModeFields() {
    const mode = document.querySelector('input[name="genMode"]:checked').value;
    studentSelectContainer.style.display = mode === 'single' ? 'block' : 'none';
    admissionContainer.style.display = mode === 'admission' ? 'block' : 'none';
  }

  function findStudentByAdmission(admNo) {
    const search = admNo.trim().toLowerCase();
    for (const [name, details] of Object.entries(STUDENT_DETAILS)) {
      if (details.admission && details.admission.toLowerCase().includes(search)) return { name, details };
    }
    if (currentStudentsList) {
      const foundName = currentStudentsList.find(n => getStudentProfile(n).admission.toLowerCase().includes(search));
      if (foundName) return { name: foundName, details: getStudentProfile(foundName) };
    }
    return null;
  }

  // RENDER TESTIMONIAL (session based, no term)
  function renderTestimonial(studentName, className, sessionLabel) {
    const profile = getStudentProfile(studentName);
    const primary = primaryColorPicker.value;
    const accent = accentColorPicker.value;
    const schoolName = "DEMO SCIENCE & TECHNICAL ACADEMY";
    const address = "Nasarawai Kano, Nasarawa State";
    const todayDate = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const refCode = `TST/${sessionLabel.replace('/', '-')}/${profile.admission.slice(-6)}`;
    return `
      <div class="testimonial-certificate" style="border-top: 5px solid ${primary};">
        <div class="certificate-inner">
          <div class="cert-header">
            <div class="crest" style="background: ${primary}; border-color: ${accent};">ACADEMIC<br>SEAL</div>
            <div class="institution">
              <h2 style="color: ${primary};">${schoolName}</h2>
              <div class="motto">“Enriching Souls, Guiding Minds”</div>
              <div style="font-size: 0.7rem;">${address} | Established 1998</div>
            </div>
          </div>
          <div class="testimonial-head">
            <h3 style="color: ${primary};">TESTIMONIAL OF MERIT</h3>
            <div class="divider-line" style="background: ${accent};"></div>
            <p style="font-family: 'Cormorant Garamond'; font-size: 0.9rem;">This certifies the academic & character standing</p>
          </div>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Student Name:</span><span class="info-value">${studentName}</span></div>
            <div class="info-item"><span class="info-label">Admission No:</span><span class="info-value">${profile.admission}</span></div>
            <div class="info-item"><span class="info-label">Date of Birth:</span><span class="info-value">${profile.dob}</span></div>
            <div class="info-item"><span class="info-label">Father / Guardian:</span><span class="info-value">${profile.father}</span></div>
            <div class="info-item"><span class="info-label">Conduct:</span><span class="info-value">${profile.conduct}</span></div>
            <div class="info-item"><span class="info-label">Post Held:</span><span class="info-value">${profile.post || '—'}</span></div>
            <div class="info-item"><span class="info-label">Academic Avg:</span><span class="info-value">${profile.avg}% (Grade ${profile.grade})</span></div>
            <div class="info-item"><span class="info-label">Hobby / Interest:</span><span class="info-value">${profile.hobby}</span></div>
            <div class="info-item"><span class="info-label">Class & Session:</span><span class="info-value">${className} · ${sessionLabel}</span></div>
            <div class="info-item"><span class="info-label">Period of Study:</span><span class="info-value">${sessionLabel.split('/')[0]} – ${sessionLabel.split('/')[1]}</span></div>
          </div>
          <div class="recommendation" style="border-left-color: ${primary};">
            <strong>Official Remark by the Headmaster:</strong> I strongly recommend ${studentName} to any institution of higher learning or place of service. Throughout the ${sessionLabel} session, the student displayed diligence, integrity, and intellectual curiosity. The school wishes continued excellence.
          </div>
          <div class="signature-area">
            <div class="signature-block">
              <div class="signature-line"></div>
              <span style="font-size: 0.75rem;">Headmaster's Signature</span>
              <div style="font-size: 0.65rem;">Date: ${todayDate}</div>
            </div>
            <div class="official-stamp" style="border-color: ${primary}; color: ${primary};">OFFICIAL SCHOOL STAMP</div>
            <div class="signature-block">
              <div class="signature-line"></div>
              <span style="font-size: 0.75rem;">Student's Signature</span>
            </div>
          </div>
          <div class="ref-footer">Reference: ${refCode} · Issued on ${todayDate} · Academic Registry</div>
        </div>
      </div>
    `;
  }

  function generateBatch() {
    if (!currentClassObj || !currentStudentsList.length) {
      alert("Load class roster first (use 'Load Class Roster')");
      return false;
    }
    const session = document.getElementById('sessionSelect').value;
    let batchHtml = '';
    currentStudentsList.forEach((student, idx) => {
      batchHtml += renderTestimonial(student, currentClassObj.name, session);
      if (idx !== currentStudentsList.length - 1) batchHtml += '<div style="page-break-after: always; break-before: page; margin: 20px 0;"></div>';
    });
    stage.innerHTML = batchHtml;
    return true;
  }

  async function generateSingle() {
    const mode = document.querySelector('input[name="genMode"]:checked').value;
    const session = document.getElementById('sessionSelect').value;
    if (mode === 'single') {
      const selected = studentSelectDropdown.value;
      if (!selected || selected.includes('Load class')) { alert("Select a student from dropdown after loading class"); return false; }
      const className = currentClassObj ? currentClassObj.name : "Selected Class";
      stage.innerHTML = renderTestimonial(selected, className, session);
      return true;
    } 
    else if (mode === 'admission') {
      const admVal = document.getElementById('admissionNumberInput').value.trim();
      if (!admVal) { alert("Enter admission number"); return false; }
      const found = findStudentByAdmission(admVal);
      if (!found) { alert("No student found with this admission number."); return false; }
      const className = currentClassObj ? currentClassObj.name : "—";
      stage.innerHTML = renderTestimonial(found.name, className, session);
      return true;
    }
    return false;
  }

  function handleGenerate() {
    const mode = document.querySelector('input[name="genMode"]:checked').value;
    if (mode === 'all') generateBatch();
    else generateSingle();
    stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function printTestimonial() {
    const content = stage.innerHTML;
    if (!content || content.includes("placeholder-message")) { alert("Generate testimonial first"); return; }
    const win = window.open('', '_blank');
    const styles = Array.from(document.querySelectorAll('style')).map(s => s.innerHTML).join('');
    win.document.write(`<!DOCTYPE html><html><head><title>Testimonial Document</title><meta charset="UTF-8"><style>${styles} body { background: white; padding: 1.5rem; } .control-panel, .action-buttons, .customize-row, .selection-mode, .filter-row, .section-nav, .dynamic-container { display: none; } .testimonial-stage { background: none; padding: 0; } @page { size: A4; margin: 1.5cm; }</style></head><body>${content}</body></html>`);
    win.document.close();
    win.print();
  }

  // event listeners
  document.querySelectorAll('.section-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentSection = tab.getAttribute('data-section');
      populateClasses();
      currentClassObj = null;
      stage.innerHTML = '<div class="placeholder-message">Select class and load roster to generate testimonial.</div>';
    });
  });

  loadRosterBtn.addEventListener('click', loadClassDetails);
  generateBtn.addEventListener('click', handleGenerate);
  printBtn.addEventListener('click', printTestimonial);
  document.querySelectorAll('input[name="genMode"]').forEach(radio => radio.addEventListener('change', toggleModeFields));

  populateClasses();
  toggleModeFields();
</script>
</body>
</html>
