<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · EduTrack NG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#0a6e3f;--primary-dark:#085c34;--primary-light:#e6f4ee;
      --danger:#dc2626;--danger-light:#fee2e2;
      --border:#e5e7eb;--ink:#111827;--ink-2:#374151;--ink-3:#6b7280;--ink-4:#9ca3af;
      --surface:#fff;--surface-3:#f3f4f6;
      --radius:10px;--radius-sm:8px;--radius-lg:16px;
      --shadow-lg:0 10px 40px rgba(0,0,0,.12);
      --font:'Plus Jakarta Sans',system-ui,sans-serif;
    }
    body{font-family:var(--font);background:var(--surface-3);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:var(--surface);border-radius:var(--radius-lg);padding:36px 32px;
      width:100%;max-width:420px;box-shadow:var(--shadow-lg);text-align:center;}
    .icon{width:64px;height:64px;background:var(--primary-light);border-radius:50%;
      display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;}
    h1{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:6px;}
    .sub{font-size:13px;color:var(--ink-3);margin-bottom:24px;line-height:1.5;}
    .form-group{margin-bottom:16px;text-align:left;}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
    .input-wrap{position:relative;}
    .form-control{width:100%;padding:10px 40px 10px 12px;border:1.5px solid var(--border);
      border-radius:var(--radius-sm);font-size:14px;color:var(--ink);
      font-family:var(--font);outline:none;transition:border-color .15s;}
    .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0a6e3f18;}
    .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--ink-3);}
    .strength-bar{height:4px;border-radius:2px;margin-top:6px;
      background:var(--surface-3);overflow:hidden;transition:.3s;}
    .strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
    .strength-label{font-size:11px;color:var(--ink-3);margin-top:4px;}
    .btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;
      border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;
      font-family:var(--font);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:hover:not(:disabled){background:var(--primary-dark);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .error-box{background:var(--danger-light);border:1px solid #fca5a5;color:#991b1b;
      padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none;text-align:left;}
    .success-box{background:#dcfce7;border:1px solid #86efac;color:#166534;
      padding:16px;border-radius:var(--radius-sm);display:none;text-align:center;}
    .success-box h3{font-size:16px;font-weight:700;margin-bottom:6px;}
    .success-box p{font-size:13px;margin-bottom:12px;}
    .back-link{display:block;margin-top:16px;font-size:13px;color:var(--ink-3);text-decoration:none;}
    .back-link:hover{color:var(--primary);}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
    .btn.loading .spinner{display:block;}
    .btn.loading .btn-text{display:none;}
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🔑</div>
  <h1>Set New Password</h1>
  <p class="sub">Choose a strong password for your EduTrack NG account.</p>

  <div class="error-box" id="errorBox"></div>

  <!-- Form -->
  <div id="resetForm">
    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="input-wrap">
        <input class="form-control" type="password" id="newPw"
          placeholder="Min 8 characters" autocomplete="new-password"
          oninput="checkStrength()">
        <button class="pw-toggle" type="button" onclick="togglePw('newPw', this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <div class="input-wrap">
        <input class="form-control" type="password" id="confirmPw"
          placeholder="Repeat password" autocomplete="new-password">
        <button class="pw-toggle" type="button" onclick="togglePw('confirmPw', this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn" id="saveBtn" onclick="savePassword()">
      <span class="btn-text">Set New Password</span>
      <div class="spinner"></div>
    </button>
  </div>

  <!-- Success state -->
  <div class="success-box" id="successBox">
    <h3>✅ Password Updated!</h3>
    <p>Your password has been changed successfully.</p>
    <button class="btn" onclick="window.location.href='/login.html'" style="max-width:200px;margin:0 auto;">
      Go to Login
    </button>
  </div>

  <a class="back-link" href="/login.html">← Back to Login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase.js"></script>
<script>
// Supabase handles the token from the URL hash automatically on page load
// We just need to call updateUser when the form is submitted

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type  = inp.type === 'password' ? 'text' : 'password';
  btn.style.opacity = inp.type === 'text' ? '0.4' : '1';
}

function checkStrength() {
  const pw   = document.getElementById('newPw').value;
  const fill = document.getElementById('strengthFill');
  const lbl  = document.getElementById('strengthLabel');
  let score  = 0;
  if (pw.length >= 8)   score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    { pct:'10%', color:'#dc2626', label:'' },
    { pct:'30%', color:'#dc2626', label:'Weak' },
    { pct:'55%', color:'#f59e0b', label:'Fair' },
    { pct:'80%', color:'#22c55e', label:'Good' },
    { pct:'100%',color:'#16a34a', label:'Strong' },
  ];
  const lvl = levels[score];
  fill.style.width    = pw.length ? lvl.pct : '0';
  fill.style.background = lvl.color;
  lbl.textContent     = pw.length ? lvl.label : '';
}

async function savePassword() {
  const pw      = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  const btn     = document.getElementById('saveBtn');
  const errBox  = document.getElementById('errorBox');

  errBox.style.display = 'none';

  if (!pw || pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
  if (pw !== confirm)        { showError('Passwords do not match.'); return; }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) throw error;

    // Mark must_change_password as false
    const { data: { user } } = await db.auth.getUser();
    if (user) await db.from('users').update({ must_change_password: false }).eq('id', user.id);

    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  } catch(e) {
    showError(e.message || 'Failed to update password. The reset link may have expired.');
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent = msg;
  b.style.display = 'block';
}
</script>
<script src="/js/assistant.js"></script>
<script src="assets/js/theme-switcher.js"></script>
</body>
</html>
