<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Students · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .stu-photo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
    .stu-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .stu-cell{display:flex;align-items:center;gap:10px;}
    .filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
    .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;}
    .stat-val{font-size:1.6rem;font-weight:900;line-height:1;}
    .stat-lbl{font-size:.7rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
    .badge-active{background:#dcfce7;color:#15803d;padding:2px 9px;border-radius:100px;font-size:.7rem;font-weight:700;white-space:nowrap;}
    .badge-inactive{background:#fee2e2;color:#dc2626;padding:2px 9px;border-radius:100px;font-size:.7rem;font-weight:700;white-space:nowrap;}
    .enrollment-tag{display:inline-block;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:100px;font-size:.72rem;font-weight:600;white-space:nowrap;}
    .action-btns{display:flex;gap:4px;justify-content:flex-end;}
    .pin-display{font-family:var(--mono);font-size:12px;letter-spacing:3px;background:var(--surface-3);padding:3px 8px;border-radius:4px;}
    .dt th{padding:9px 14px;text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--border);}
    .dt td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .dt tr:last-child td{border-bottom:none;}
    .dt tbody tr:hover td{background:var(--surface-2);}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Add/Edit Student Modal -->
<div class="modal" id="studentModal">
  <div class="modal__box" style="max-width:700px;">
    <div class="modal__header">
      <h2 class="modal__title" id="stuModalTitle">Add Student</h2>
      <button class="modal__close" onclick="closeModal('studentModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="stuId">
      <div class="form-grid">
        <div class="form-group col-full">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" id="stuName" class="form-control" placeholder="e.g. Amaka Okafor">
        </div>
        <div class="form-group">
          <label class="form-label">Admission Number <span class="required">*</span></label>
          <input type="text" id="stuAdmNo" class="form-control" placeholder="ADM2024001" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
          <label class="form-label">Date of Birth</label>
          <input type="date" id="stuDob" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select id="stuGender" class="form-control"><option value="">— Select —</option><option value="male">Male</option><option value="female">Female</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Blood Group</label>
          <select id="stuBlood" class="form-control"><option value="">—</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Phone (parent/guardian)</label>
          <input type="tel" id="stuPhone" class="form-control" placeholder="08012345678">
        </div>
        <div class="form-group">
          <label class="form-label">Parent/Guardian Name</label>
          <input type="text" id="stuParent" class="form-control" placeholder="Optional">
        </div>
        <div class="form-group">
          <label class="form-label">Parent Email</label>
          <input type="email" id="stuParentEmail" class="form-control" placeholder="Optional">
        </div>
        <div class="form-group col-full">
          <label class="form-label">Home Address</label>
          <input type="text" id="stuAddress" class="form-control" placeholder="Optional">
        </div>
        <div class="form-group">
          <label class="form-label">Enroll in Class</label>
          <select id="stuClass" class="form-control"><option value="">— No Enrollment —</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Term</label>
          <select id="stuTerm" class="form-control"><option value="">— Select Term —</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Portal PIN</label>
          <input type="text" id="stuPin" class="form-control" placeholder="4–8 digits" maxlength="8">
          <div class="form-hint">Leave blank to use default (1234)</div>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="stuStatus" class="form-control"><option value="true">Active</option><option value="false">Inactive</option></select>
        </div>
      </div>
      <div id="stuFormErr" class="form-error" style="display:none;margin-top:10px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('studentModal')">Cancel</button>
      <button class="btn btn--primary" id="saveStuBtn" onclick="saveStudent()">Save Student</button>
    </div>
  </div>
</div>

<!-- View Student Modal -->
<div class="modal" id="viewStuModal">
  <div class="modal__box" style="max-width:520px;">
    <div class="modal__header">
      <h2 class="modal__title">Student Profile</h2>
      <button class="modal__close" onclick="closeModal('viewStuModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body" id="viewStuBody">Loading…</div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('viewStuModal')">Close</button>
      <button class="btn btn--primary" id="viewStuEditBtn">Edit</button>
    </div>
  </div>
</div>

<!-- Reset PIN Modal -->
<div class="modal" id="pinModal">
  <div class="modal__box" style="max-width:360px;">
    <div class="modal__header">
      <h2 class="modal__title">Reset PIN</h2>
      <button class="modal__close" onclick="closeModal('pinModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <p style="margin-bottom:14px;">New PIN for <strong id="pinStuName"></strong>:</p>
      <input type="hidden" id="pinStuId">
      <input type="text" id="newPin" class="form-control" placeholder="Enter 4–8 digit PIN" maxlength="8" style="font-size:1.2rem;letter-spacing:5px;text-align:center;font-family:var(--mono);">
      <div id="pinErr" class="form-error" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('pinModal')">Cancel</button>
      <button class="btn btn--primary" onclick="savePIN()">Update PIN</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, allStudents = [], filtered = [], classes = [], terms = [], currentTerm;

(async () => {
  currentUser = await initAdminLayout('students', 'Students');
  if (!currentUser) return;
  const sid = currentUser.school_id;

  const [{ data: cls }, { data: trm }] = await Promise.all([
    db.from('classes').select('id,name').eq('school_id', sid).order('name'),
    db.from('terms').select('id,name,is_current,academic_year').eq('school_id', sid).order('created_at', { ascending: false }),
  ]);
  classes = cls || [];
  terms = trm || [];
  currentTerm = terms.find(t => t.is_current) || terms[0] || null;

  document.getElementById('stuClass').innerHTML = '<option value="">— No Enrollment —</option>' +
    classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('stuTerm').innerHTML = '<option value="">— Select Term —</option>' +
    terms.map(t => `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>${t.name}${t.academic_year ? ' · ' + t.academic_year : ''}</option>`).join('');

  const body = document.getElementById('pageBody');
  body.innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;">
      <div><h1 style="font-size:1.45rem;font-weight:800;margin:0;">Students</h1><p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Manage all students enrolled in your school</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn--secondary btn--sm" onclick="exportCSV()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export CSV</button>
        <button class="btn btn--primary btn--sm" onclick="openAddStudent()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Student</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" id="stTotal">—</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-val" id="stMale" style="color:#2563eb;">—</div><div class="stat-lbl">Male</div></div>
      <div class="stat-box"><div class="stat-val" id="stFemale" style="color:#9333ea;">—</div><div class="stat-lbl">Female</div></div>
      <div class="stat-box"><div class="stat-val" id="stEnrolled" style="color:#16a34a;">—</div><div class="stat-lbl">Enrolled</div></div>
    </div>
    <div class="filter-row">
      <div style="position:relative;flex:1;min-width:180px;max-width:300px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" class="form-control" id="stuSearch" placeholder="Search name or adm. no…" style="padding-left:32px;" oninput="filterStudents()">
      </div>
      <select class="form-control" id="stuClassFilter" onchange="filterStudents()" style="max-width:190px;"><option value="">All Classes</option>${classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      <select class="form-control" id="stuGenderFilter" onchange="filterStudents()" style="max-width:130px;"><option value="">All Genders</option><option value="male">Male</option><option value="female">Female</option></select>
      <select class="form-control" id="stuStatusFilter" onchange="filterStudents()" style="max-width:130px;"><option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
    </div>
    <div class="card" style="padding:0;overflow:hidden;"><div id="stuTableWrap"></div></div>
  `;
  loadStudents();
})();

async function loadStudents() {
  showLoader('#stuTableWrap', 'Loading students…');
  const { data, error } = await db.from('students')
    .select('id,full_name,admission_no,gender,date_of_birth,parent_phone,parent_name,parent_email,is_active,pin,created_at,enrollments(class_id,term_id,classes(name))')
    .eq('school_id', currentUser.school_id)
    .order('full_name');
  if (error) { showError('#stuTableWrap', 'Failed to load students: ' + error.message); return; }
  allStudents = (data || []).map(s => ({ ...s, currentClass: getCurrentClass(s.enrollments) }));
  const total = allStudents.length;
  const male = allStudents.filter(s => (s.gender||'').toLowerCase()==='male').length;
  const female = allStudents.filter(s => (s.gender||'').toLowerCase()==='female').length;
  const enrolled = allStudents.filter(s => s.currentClass).length;
  ['stTotal','stMale','stFemale','stEnrolled'].forEach((id,i) => {
    const el = document.getElementById(id);
    if (el) el.textContent = [total,male,female,enrolled][i];
  });
  filterStudents();
}

function getCurrentClass(enrollments) {
  if (!enrollments || !enrollments.length) return null;
  if (currentTerm) {
    const e = enrollments.find(en => en.term_id === currentTerm.id);
    if (e) return e.classes?.name || null;
  }
  return enrollments[enrollments.length - 1]?.classes?.name || null;
}

function filterStudents() {
  const q = (document.getElementById('stuSearch')?.value || '').toLowerCase();
  const cls = document.getElementById('stuClassFilter')?.value || '';
  const gender = document.getElementById('stuGenderFilter')?.value || '';
  const status = document.getElementById('stuStatusFilter')?.value || '';
  filtered = allStudents.filter(s => {
    if (q && !s.full_name.toLowerCase().includes(q) && !(s.admission_no||'').toLowerCase().includes(q)) return false;
    if (cls && !(s.enrollments||[]).some(e => e.class_id === cls)) return false;
    if (gender && (s.gender||'').toLowerCase() !== gender) return false;
    if (status === 'active' && s.is_active === false) return false;
    if (status === 'inactive' && s.is_active !== false) return false;
    return true;
  });
  renderTable();
}

function renderTable() {
  const wrap = document.getElementById('stuTableWrap');
  if (!filtered.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:48px 16px;color:var(--ink-3);"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3;display:block;margin:0 auto 12px;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><p style="font-weight:600;">No students found</p><p style="font-size:.8rem;margin-top:4px;"><button onclick="openAddStudent()" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:.8rem;font-weight:600;text-decoration:underline;padding:0;">Add a student</button></p></div>`;
    return;
  }
  wrap.innerHTML = `
    <div style="overflow-x:auto;">
      <table class="dt" style="width:100%;border-collapse:collapse;">
        <thead><tr><th>#</th><th>Student</th><th>Adm. No.</th><th>Class</th><th>Gender</th><th>Status</th><th style="text-align:right;">Actions</th></tr></thead>
        <tbody>
          ${filtered.map((s,i) => `
            <tr>
              <td style="color:var(--ink-3);font-size:.78rem;">${i+1}</td>
              <td>
                <div class="stu-cell">
                  ${s.photo_url ? `<img src="${s.photo_url}" class="stu-photo" onerror="this.outerHTML='<div class=\\'stu-avatar\\'>${s.full_name.charAt(0)}</div>'">` : `<div class="stu-avatar">${(s.full_name||'?').charAt(0).toUpperCase()}</div>`}
                  <div><div style="font-weight:600;font-size:.875rem;">${s.full_name}</div>${s.parent_name?`<div style="font-size:.72rem;color:var(--ink-3);">${s.parent_name}</div>`:''}</div>
                </div>
              </td>
              <td><code style="font-size:.78rem;background:var(--surface-3);padding:2px 6px;border-radius:4px;">${s.admission_no||'—'}</code></td>
              <td>${s.currentClass?`<span class="enrollment-tag">${s.currentClass}</span>`:'<span style="color:var(--ink-4);font-size:.78rem;">Not enrolled</span>'}</td>
              <td style="font-size:.82rem;">${capitalize(s.gender)||'—'}</td>
              <td>${s.is_active!==false?'<span class="badge-active">Active</span>':'<span class="badge-inactive">Inactive</span>'}</td>
              <td>
                <div class="action-btns">
                  <button class="btn btn--ghost btn--sm" title="View profile" onclick="viewStudent('${s.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                  <button class="btn btn--ghost btn--sm" title="Edit" onclick="editStudent('${s.id}')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
                  <button class="btn btn--ghost btn--sm" title="Reset PIN" onclick="openResetPin('${s.id}','${(s.full_name||'').replace(/'/g,"\\'")}')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
                  <button class="btn btn--ghost btn--sm" title="Delete" style="color:var(--danger);" onclick="deleteStudent('${s.id}','${(s.full_name||'').replace(/'/g,"\\'")}')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div style="padding:10px 16px;font-size:.78rem;color:var(--ink-3);border-top:1px solid var(--border);">Showing ${filtered.length} of ${allStudents.length} students</div>`;
}

function openAddStudent() {
  document.getElementById('stuModalTitle').textContent = 'Add Student';
  document.getElementById('stuId').value = '';
  ['stuName','stuAdmNo','stuPhone','stuAddress','stuParent','stuParentEmail','stuPin'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('stuDob').value = '';
  document.getElementById('stuGender').value = '';
  document.getElementById('stuBlood').value = '';
  document.getElementById('stuClass').value = '';
  document.getElementById('stuTerm').value = currentTerm?.id || '';
  document.getElementById('stuStatus').value = 'true';
  document.getElementById('stuFormErr').style.display = 'none';
  openModal('studentModal');
}

function editStudent(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  document.getElementById('stuModalTitle').textContent = 'Edit Student';
  document.getElementById('stuId').value = s.id;
  document.getElementById('stuName').value = s.full_name || '';
  document.getElementById('stuAdmNo').value = s.admission_no || '';
  document.getElementById('stuDob').value = s.date_of_birth || '';
  document.getElementById('stuGender').value = (s.gender||'').toLowerCase();
  document.getElementById('stuBlood').value = '';
  document.getElementById('stuPhone').value = s.parent_phone || '';
  document.getElementById('stuAddress').value = '';
  document.getElementById('stuParent').value = s.parent_name || '';
  document.getElementById('stuParentEmail').value = s.parent_email || '';
  document.getElementById('stuStatus').value = s.is_active !== false ? 'true' : 'false';
  document.getElementById('stuPin').value = '';
  const curEnroll = s.enrollments?.find(e => currentTerm && e.term_id === currentTerm.id);
  document.getElementById('stuClass').value = curEnroll?.class_id || '';
  document.getElementById('stuTerm').value = currentTerm?.id || '';
  document.getElementById('stuFormErr').style.display = 'none';
  openModal('studentModal');
}

async function saveStudent() {
  const btn = document.getElementById('saveStuBtn');
  const errEl = document.getElementById('stuFormErr');
  errEl.style.display = 'none';
  const name = document.getElementById('stuName').value.trim();
  const admNo = document.getElementById('stuAdmNo').value.trim().toUpperCase();
  if (!name) { errEl.textContent = 'Full name is required.'; errEl.style.display = 'block'; return; }
  if (!admNo) { errEl.textContent = 'Admission number is required.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = {
    school_id: currentUser.school_id,
    full_name: name, admission_no: admNo,
    date_of_birth: document.getElementById('stuDob').value || null,
    gender: document.getElementById('stuGender').value || null,
    parent_phone: document.getElementById('stuPhone').value.trim() || null,
    parent_name: document.getElementById('stuParent').value.trim() || null,
    parent_email: document.getElementById('stuParentEmail').value.trim() || null,
    is_active: document.getElementById('stuStatus').value === 'true',
  };
  const pinVal = document.getElementById('stuPin').value.trim();
  if (pinVal) payload.pin = pinVal;
  const stuId = document.getElementById('stuId').value;
  try {
    let savedId = stuId;
    if (stuId) {
      const { error } = await db.from('students').update(payload).eq('id', stuId);
      if (error) throw error;
    } else {
      if (!payload.pin) payload.pin = '1234';
      const { data, error } = await db.from('students').insert(payload).select('id').single();
      if (error) throw error;
      savedId = data.id;
    }
    const classId = document.getElementById('stuClass').value;
    const termId = document.getElementById('stuTerm').value;
    if (classId && termId && savedId) {
      const { data: existing } = await db.from('enrollments').select('id').eq('student_id', savedId).eq('term_id', termId).maybeSingle();
      if (!existing) {
        await db.from('enrollments').insert({ student_id: savedId, class_id: classId, term_id: termId, school_id: currentUser.school_id });
      } else {
        await db.from('enrollments').update({ class_id: classId }).eq('id', existing.id);
      }
    }
    closeModal('studentModal');
    toast(stuId ? 'Student updated.' : 'Student added successfully.', 'success');
    await loadStudents();
  } catch (err) {
    errEl.textContent = err.message || 'Failed to save student.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Save Student';
  }
}

function viewStudent(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  const dob = s.date_of_birth ? new Date(s.date_of_birth).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  document.getElementById('viewStuBody').innerHTML = `
    <div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;">
      ${s.photo_url ? `<img src="${s.photo_url}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--border);">` : `<div style="width:70px;height:70px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;">${(s.full_name||'?').charAt(0)}</div>`}
      <div><div style="font-size:1.1rem;font-weight:800;">${s.full_name}</div><div style="color:var(--ink-3);font-size:.85rem;margin-top:2px;">${s.admission_no||'—'}</div><div style="margin-top:8px;">${s.is_active!==false?'<span class="badge-active">Active</span>':'<span class="badge-inactive">Inactive</span>'}</div></div>
    </div>
    <table style="width:100%;font-size:.845rem;border-collapse:collapse;">
      ${[['Class',s.currentClass?`<span class="enrollment-tag">${s.currentClass}</span>`:'Not enrolled'],['Gender',capitalize(s.gender)||'—'],['Date of Birth',dob],['Parent Phone',s.parent_phone||'—'],['Parent',s.parent_name||'—'],['Parent Email',s.parent_email||'—'],['PIN',`<span class="pin-display">${s.pin||'—'}</span>`],['Added',new Date(s.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})]].map(([k,v])=>`<tr style="border-bottom:1px solid var(--border);"><td style="padding:8px 0;color:var(--ink-3);font-weight:600;width:130px;">${k}</td><td style="padding:8px 0;">${v}</td></tr>`).join('')}
    </table>`;
  document.getElementById('viewStuEditBtn').onclick = () => { closeModal('viewStuModal'); editStudent(id); };
  openModal('viewStuModal');
}

function openResetPin(id, name) {
  document.getElementById('pinStuId').value = id;
  document.getElementById('pinStuName').textContent = name;
  document.getElementById('newPin').value = '';
  document.getElementById('pinErr').style.display = 'none';
  openModal('pinModal');
}

async function savePIN() {
  const id = document.getElementById('pinStuId').value;
  const pin = document.getElementById('newPin').value.trim();
  const errEl = document.getElementById('pinErr');
  if (!pin || pin.length < 4) { errEl.textContent = 'PIN must be at least 4 digits.'; errEl.style.display = 'block'; return; }
  const { error } = await db.from('students').update({ pin }).eq('id', id);
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('pinModal'); toast('PIN updated.', 'success'); await loadStudents();
}

async function deleteStudent(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const { error } = await db.from('students').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Student deleted.', 'success'); await loadStudents();
}

function exportCSV() {
  const headers = ['Full Name','Admission No','Gender','Date of Birth','Class','Parent','Phone','Status'];
  const rows = filtered.map(s => [s.full_name,s.admission_no,s.gender,s.date_of_birth,s.currentClass||'',s.parent_name||'',s.parent_phone||'',s.is_active!==false?'Active':'Inactive']);
  const csv = [headers,...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `students-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function capitalize(str) { if(!str)return''; return str.charAt(0).toUpperCase()+str.slice(1).toLowerCase(); }
</script>
