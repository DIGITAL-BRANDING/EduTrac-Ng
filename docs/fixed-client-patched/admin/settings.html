<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Settings · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .settings-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;}
    .settings-nav{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:sticky;top:80px;}
    .settings-nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:.875rem;font-weight:500;cursor:pointer;color:var(--ink-2);border-left:3px solid transparent;transition:all .14s;}
    .settings-nav-item:hover{background:var(--surface-2);color:var(--ink);}
    .settings-nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:700;border-left-color:var(--primary);}
    .settings-panel{display:none;}
    .settings-panel.active{display:block;}
    .settings-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px;}
    .settings-section h3{font-size:1rem;font-weight:700;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .term-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.845rem;}
    .term-row:last-child{border-bottom:none;}
    @media(max-width:768px){.settings-layout{grid-template-columns:1fr;} .settings-nav{position:static;display:flex;overflow-x:auto;border-radius:10px;} .settings-nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;} .settings-nav-item.active{border-left:none;border-bottom-color:var(--primary);}}
  </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, school, terms = [];

(async () => {
  currentUser = await initAdminLayout('settings', 'Settings');
  if (!currentUser) return;
  const sid = currentUser.school_id;

  const [{ data: sch }, { data: trm }] = await Promise.all([
    db.from('schools').select('*').eq('id', sid).single(),
    db.from('terms').select('*').eq('school_id', sid).order('created_at', { ascending: false }),
  ]);
  school = sch; terms = trm || [];

  document.getElementById('pageBody').innerHTML = `
    <div style="margin-bottom:22px;">
      <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Settings</h1>
      <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Manage your school profile and academic calendar</p>
    </div>
    <div class="settings-layout">
      <nav class="settings-nav">
        <div class="settings-nav-item active" onclick="showPanel('school',this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          School Profile
        </div>
        <div class="settings-nav-item" onclick="showPanel('terms',this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Academic Terms
        </div>
        <div class="settings-nav-item" onclick="showPanel('account',this)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
          My Account
        </div>
      </nav>
      <div>
        <!-- School Profile Panel -->
        <div class="settings-panel active" id="panel-school">
          <div class="settings-section">
            <h3>School Information</h3>
            <div class="form-grid">
              <div class="form-group col-full">
                <label class="form-label">School Name <span class="required">*</span></label>
                <input type="text" id="schName" class="form-control" value="${esc(school?.name||'')}">
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="schEmail" class="form-control" value="${esc(school?.email||'')}">
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" id="schPhone" class="form-control" value="${esc(school?.phone||'')}">
              </div>
              <div class="form-group">
                <label class="form-label">State</label>
                <input type="text" id="schState" class="form-control" value="${esc(school?.state||'')}">
              </div>
              <div class="form-group">
                <label class="form-label">LGA</label>
                <input type="text" id="schLga" class="form-control" value="${esc(school?.lga||'')}">
              </div>
              <div class="form-group col-full">
                <label class="form-label">Address</label>
                <input type="text" id="schAddress" class="form-control" value="${esc(school?.address||'')}">
              </div>
              <div class="form-group col-full">
                <label class="form-label">Logo URL</label>
                <input type="url" id="schLogo" class="form-control" value="${esc(school?.logo_url||'')}" placeholder="https://…">
                <div class="form-hint">Paste a public URL to your school logo image.</div>
              </div>
            </div>
            <div id="schErr" class="form-error" style="display:none;margin-bottom:10px;"></div>
            <button class="btn btn--primary" id="saveSchBtn" onclick="saveSchool()">Save Changes</button>
          </div>
        </div>

        <!-- Terms Panel -->
        <div class="settings-panel" id="panel-terms">
          <div class="settings-section">
            <h3>Academic Terms</h3>
            <div style="margin-bottom:16px;">
              <button class="btn btn--secondary btn--sm" onclick="openAddTerm()">+ Add Term</button>
            </div>
            <div id="termsList">Loading…</div>
          </div>
        </div>

        <!-- Account Panel -->
        <div class="settings-panel" id="panel-account">
          <div class="settings-section">
            <h3>Change Password</h3>
            <div class="form-grid">
              <div class="form-group col-full">
                <label class="form-label">New Password <span class="required">*</span></label>
                <input type="password" id="newPwd" class="form-control" placeholder="Min 8 characters">
              </div>
              <div class="form-group col-full">
                <label class="form-label">Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPwd" class="form-control" placeholder="Repeat password">
              </div>
            </div>
            <div id="pwdErr" class="form-error" style="display:none;margin-bottom:10px;"></div>
            <button class="btn btn--primary" onclick="changePassword()">Update Password</button>
          </div>
          <div class="settings-section">
            <h3>Update Profile</h3>
            <div class="form-grid">
              <div class="form-group col-full">
                <label class="form-label">Full Name</label>
                <input type="text" id="adminName" class="form-control" value="${esc(currentUser.full_name||'')}">
              </div>
              <div class="form-group col-full">
                <label class="form-label">Phone</label>
                <input type="tel" id="adminPhone" class="form-control" value="${esc(currentUser.phone||'')}">
              </div>
            </div>
            <button class="btn btn--primary" onclick="saveProfile()">Save Profile</button>
          </div>
        </div>
      </div>
    </div>
  `;

  renderTerms();
})();

// Add Term Modal (inline)
function openAddTerm() {
  const existing = document.getElementById('addTermForm');
  if (existing) { existing.remove(); return; }
  const div = document.createElement('div');
  div.id = 'addTermForm';
  div.style.cssText = 'background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;';
  div.innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Term Name *</label><input type="text" id="newTermName" class="form-control" placeholder="e.g. First Term"></div>
      <div class="form-group"><label class="form-label">Academic Year</label><input type="text" id="newTermYear" class="form-control" placeholder="e.g. 2024/2025"></div>
      <div class="form-group"><label class="form-label">Start Date</label><input type="date" id="newTermStart" class="form-control"></div>
      <div class="form-group"><label class="form-label">End Date</label><input type="date" id="newTermEnd" class="form-control"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn--primary btn--sm" onclick="saveTerm()">Save Term</button>
      <button class="btn btn--secondary btn--sm" onclick="document.getElementById('addTermForm').remove()">Cancel</button>
    </div>
    <div id="termFormErr" class="form-error" style="display:none;margin-top:8px;"></div>
  `;
  document.getElementById('termsList').prepend(div);
}

async function saveTerm() {
  const name = document.getElementById('newTermName').value.trim();
  const errEl = document.getElementById('termFormErr');
  if (!name) { errEl.textContent = 'Term name required.'; errEl.style.display = 'block'; return; }
  const payload = {
    school_id: currentUser.school_id, name,
    academic_year: document.getElementById('newTermYear').value.trim() || null,
    start_date: document.getElementById('newTermStart').value || null,
    end_date: document.getElementById('newTermEnd').value || null,
    is_current: false,
  };
  const { error } = await db.from('terms').insert(payload);
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  document.getElementById('addTermForm')?.remove();
  const { data } = await db.from('terms').select('*').eq('school_id', currentUser.school_id).order('created_at', { ascending: false });
  terms = data || [];
  toast('Term added.', 'success');
  renderTerms();
}

async function setCurrentTerm(id) {
  await db.from('terms').update({ is_current: false }).eq('school_id', currentUser.school_id);
  const { error } = await db.from('terms').update({ is_current: true }).eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  terms = terms.map(t => ({ ...t, is_current: t.id === id }));
  toast('Current term updated.', 'success');
  renderTerms();
}

async function deleteTerm(id, name) {
  if (!confirm(`Delete term "${name}"? All attendance and enrollment records for this term will be affected.`)) return;
  const { error } = await db.from('terms').delete().eq('id', id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  terms = terms.filter(t => t.id !== id);
  toast('Term deleted.', 'success');
  renderTerms();
}

function renderTerms() {
  const el = document.getElementById('termsList');
  if (!el) return;
  if (!terms.length) { el.innerHTML = '<p style="color:var(--ink-3);font-size:.875rem;">No terms set up yet. Click "+ Add Term" to create one.</p>'; return; }
  el.innerHTML = terms.map(t => `
    <div class="term-row">
      <div>
        <div style="font-weight:600;">${t.name}</div>
        <div style="font-size:.75rem;color:var(--ink-3);">${t.academic_year||''}${t.start_date?' · '+t.start_date+' → '+(t.end_date||'…'):''}</div>
      </div>
      ${t.is_current ? '<span style="background:#dcfce7;color:#166534;padding:3px 10px;border-radius:100px;font-size:.7rem;font-weight:700;">Current</span>' : '<button class="btn btn--ghost btn--sm" onclick="setCurrentTerm(\''+t.id+'\')">Set Current</button>'}
      <button class="btn btn--ghost btn--sm" onclick="deleteTerm('${t.id}','${(t.name||'').replace(/'/g,"\\'")}')"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`).join('');
}

function showPanel(id, btn) {
  document.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.settings-nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id)?.classList.add('active');
  btn.classList.add('active');
}

async function saveSchool() {
  const btn = document.getElementById('saveSchBtn');
  const errEl = document.getElementById('schErr');
  const name = document.getElementById('schName').value.trim();
  if (!name) { errEl.textContent = 'School name required.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await db.from('schools').update({
    name, email: document.getElementById('schEmail').value.trim() || null,
    phone: document.getElementById('schPhone').value.trim() || null,
    state: document.getElementById('schState').value.trim() || null,
    lga: document.getElementById('schLga').value.trim() || null,
    address: document.getElementById('schAddress').value.trim() || null,
    logo_url: document.getElementById('schLogo').value.trim() || null,
  }).eq('id', currentUser.school_id);
  btn.disabled = false; btn.textContent = 'Save Changes';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  toast('School profile updated.', 'success');
}

async function changePassword() {
  const pwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const errEl = document.getElementById('pwdErr');
  if (!pwd || pwd.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
  if (pwd !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
  const { error } = await db.auth.updateUser({ password: pwd });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
  toast('Password updated.', 'success');
}

async function saveProfile() {
  const name = document.getElementById('adminName').value.trim();
  if (!name) { toast('Name required.', 'error'); return; }
  const { error } = await db.from('users').update({ full_name: name, phone: document.getElementById('adminPhone').value.trim() || null }).eq('id', currentUser.id);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Profile updated.', 'success');
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../js/ai-assistant.js" defer></script>
</body>
</html>
