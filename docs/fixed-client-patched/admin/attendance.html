<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Attendance · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px;}
    .att-class-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .18s;}
    .att-class-card:hover{box-shadow:var(--shadow);}
    .att-class-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .att-class-name{font-weight:700;font-size:.95rem;}
    .att-class-body{padding:14px 16px;}
    .att-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
    .att-row:last-child{border-bottom:none;}
    .att-name{flex:1;font-size:.845rem;font-weight:500;}
    .att-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .12s;background:var(--surface-2);}
    .att-btn.P{background:#dcfce7;border-color:#86efac;color:#166534;}
    .att-btn.A{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
    .att-btn.L{background:#fef9c3;border-color:#fde047;color:#854d0e;}
    .att-btn.E{background:#dbeafe;border-color:#93c5fd;color:#1e40af;}
    .stat-chip{padding:3px 10px;border-radius:100px;font-size:.68rem;font-weight:700;}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
    .view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .view-toggle button{padding:7px 14px;border:none;background:transparent;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--ink-3);}
    .view-toggle button.active{background:var(--primary);color:white;}
  </style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, classes = [], students = [], todayDate, currentTerm, attendanceMap = {}, viewMode = 'take';

(async () => {
  currentUser = await initAdminLayout('attendance', 'Attendance');
  if (!currentUser) return;
  const sid = currentUser.school_id;
  todayDate = new Date().toISOString().slice(0, 10);

  const [{ data: cls }, { data: trm }] = await Promise.all([
    db.from('classes').select('id,name').eq('school_id', sid).order('name'),
    db.from('terms').select('*').eq('school_id', sid).eq('is_current', true).maybeSingle(),
  ]);
  classes = cls || [];
  currentTerm = trm;

  const body = document.getElementById('pageBody');
  body.innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.45rem;font-weight:800;margin:0;">Attendance</h1>
        <p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">${currentTerm ? currentTerm.name : 'No active term'}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="date" id="attDate" class="form-control" value="${todayDate}" onchange="loadAttendance()" style="max-width:160px;">
        <div class="view-toggle">
          <button class="active" onclick="switchView('take',this)">Take Attendance</button>
          <button onclick="switchView('report',this)">View Report</button>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <select class="form-control" id="classFilterAtt" onchange="loadAttendance()" style="max-width:200px;">
        <option value="">All Classes</option>
        ${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
      <div id="attSummary" style="display:flex;gap:8px;align-items:center;"></div>
    </div>

    <div id="attContent">
      <div style="text-align:center;padding:48px;color:var(--ink-3);">
        <p>Loading attendance data…</p>
      </div>
    </div>
  `;
  loadAttendance();
})();

async function loadAttendance() {
  const sid = currentUser.school_id;
  const date = document.getElementById('attDate')?.value || todayDate;
  const classId = document.getElementById('classFilterAtt')?.value || '';
  showLoader('#attContent', 'Loading…');

  // Get enrolled students
  let q = db.from('enrollments')
    .select('student_id,class_id,classes(name),students(id,full_name,admission_no)')
    .eq('school_id', sid);
  if (currentTerm) q = q.eq('term_id', currentTerm.id);
  if (classId) q = q.eq('class_id', classId);
  const { data: enrollments, error } = await q;
  if (error) { showError('#attContent', error.message); return; }

  // Get existing attendance for the date
  let aq = db.from('attendance').select('*').eq('school_id', sid).eq('date', date);
  if (classId) aq = aq.eq('class_id', classId);
  const { data: existing } = await aq;
  attendanceMap = {};
  (existing || []).forEach(a => { attendanceMap[`${a.student_id}-${a.class_id}`] = a; });

  // Group by class
  const byClass = {};
  (enrollments || []).forEach(e => {
    if (!e.students) return;
    const cid = e.class_id;
    if (!byClass[cid]) byClass[cid] = { id: cid, name: e.classes?.name || cid, students: [] };
    byClass[cid].students.push(e.students);
  });

  const classGroups = Object.values(byClass);
  const totalStudents = classGroups.reduce((s, c) => s + c.students.length, 0);
  const totalPresent = Object.values(attendanceMap).filter(a => a.status === 'P' || a.status === 'L').length;

  const summEl = document.getElementById('attSummary');
  if (summEl) {
    summEl.innerHTML = `
      <span class="stat-chip" style="background:#dcfce7;color:#166534;">${totalPresent} Present</span>
      <span class="stat-chip" style="background:#fee2e2;color:#991b1b;">${Object.values(attendanceMap).filter(a=>a.status==='A').length} Absent</span>
      <span class="stat-chip" style="background:var(--surface-3);color:var(--ink-3);">${totalStudents} Total</span>
    `;
  }

  if (!classGroups.length) {
    showEmpty('#attContent', 'No students enrolled. Set up classes and enroll students first.');
    return;
  }

  document.getElementById('attContent').innerHTML = `
    <div style="margin-bottom:12px;display:flex;justify-content:flex-end;">
      <button class="btn btn--primary btn--sm" onclick="saveAllAttendance('${date}')">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Attendance
      </button>
    </div>
    <div class="att-grid">
      ${classGroups.map(cls => `
        <div class="att-class-card" id="cls-${cls.id}">
          <div class="att-class-head">
            <span class="att-class-name">${cls.name}</span>
            <span style="font-size:.75rem;color:var(--ink-3);">${cls.students.length} students</span>
          </div>
          <div class="att-class-body">
            <div style="display:flex;gap:6px;margin-bottom:10px;">
              <button class="btn btn--secondary btn--sm" onclick="markAll('${cls.id}','P')">All Present</button>
              <button class="btn btn--ghost btn--sm" onclick="markAll('${cls.id}','A')">All Absent</button>
            </div>
            ${cls.students.sort((a,b)=>a.full_name.localeCompare(b.full_name)).map(s => {
              const key = `${s.id}-${cls.id}`;
              const curStatus = attendanceMap[key]?.status || '';
              return `
                <div class="att-row" id="row-${s.id}-${cls.id}">
                  <div class="att-name">${s.full_name}<br><small style="color:var(--ink-3);font-family:var(--mono);font-size:.68rem;">${s.admission_no||''}</small></div>
                  ${['P','A','L','E'].map(st => `<button class="att-btn ${curStatus===st?st:''}" title="${{P:'Present',A:'Absent',L:'Late',E:'Excused'}[st]}" onclick="markStatus('${s.id}','${cls.id}','${st}',this)">${st}</button>`).join('')}
                </div>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>
  `;
}

function markStatus(studentId, classId, status, btn) {
  const key = `${studentId}-${classId}`;
  attendanceMap[key] = { ...attendanceMap[key], student_id: studentId, class_id: classId, status };
  const row = document.getElementById(`row-${studentId}-${classId}`);
  if (row) row.querySelectorAll('.att-btn').forEach(b => {
    b.className = 'att-btn' + (b.textContent.trim() === status ? ' ' + status : '');
  });
}

function markAll(classId, status) {
  const cls = document.querySelector(`#cls-${classId}`);
  if (!cls) return;
  cls.querySelectorAll('.att-row').forEach(row => {
    const id = row.id.replace(`row-`, '').replace(`-${classId}`, '');
    row.querySelectorAll('.att-btn').forEach(b => {
      b.className = 'att-btn' + (b.textContent.trim() === status ? ' ' + status : '');
    });
    attendanceMap[`${id}-${classId}`] = { student_id: id, class_id: classId, status };
  });
}

async function saveAllAttendance(date) {
  const sid = currentUser.school_id;
  const records = Object.values(attendanceMap).map(a => ({
    school_id: sid, date, student_id: a.student_id,
    class_id: a.class_id, status: a.status,
  }));
  if (!records.length) { toast('No attendance data to save.', 'warning'); return; }
  const { error } = await db.from('attendance').upsert(records, { onConflict: 'school_id,date,student_id,class_id' });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast(`Attendance saved for ${records.length} students.`, 'success');
}

function switchView(mode, btn) {
  viewMode = mode;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadAttendance();
}
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../js/ai-assistant.js" defer></script>
</body>
</html>
