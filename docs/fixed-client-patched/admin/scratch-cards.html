<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-96.png" type="image/png">
  <meta name="theme-color" content="#0a6e3f">
  <title>Scratch Cards · EduTrack NG</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px;}
    .scratch-card{background:linear-gradient(135deg,#0a6e3f,#065530);color:white;border-radius:12px;padding:16px;position:relative;overflow:hidden;}
    .scratch-card::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06);}
    .sc-serial{font-family:var(--mono);font-size:.7rem;letter-spacing:2px;opacity:.7;margin-bottom:6px;}
    .sc-pin{font-family:var(--mono);font-size:1.3rem;font-weight:800;letter-spacing:5px;margin-bottom:8px;}
    .sc-status{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.68rem;font-weight:700;background:rgba(255,255,255,.15);}
    .sc-status.used{background:rgba(255,99,99,.3);}
    .sc-meta{font-size:.7rem;opacity:.65;margin-top:6px;}
    .stats-sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;}
    .stat-sm{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;text-align:center;}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Generate Cards Modal -->
<div class="modal" id="genModal">
  <div class="modal__box" style="max-width:400px;">
    <div class="modal__header">
      <h2 class="modal__title">Generate Scratch Cards</h2>
      <button class="modal__close" onclick="closeModal('genModal')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="form-group">
        <label class="form-label">Number of Cards <span class="required">*</span></label>
        <input type="number" id="genCount" class="form-control" value="10" min="1" max="200" placeholder="e.g. 50">
        <div class="form-hint">Max 200 cards per batch</div>
      </div>
      <div class="form-group">
        <label class="form-label">PIN Length</label>
        <select id="genPinLen" class="form-control"><option value="8">8 digits</option><option value="10">10 digits</option><option value="12">12 digits</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Purpose / Label</label>
        <input type="text" id="genPurpose" class="form-control" placeholder="e.g. Result Checker 2024/2025">
      </div>
      <div id="genErr" class="form-error" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('genModal')">Cancel</button>
      <button class="btn btn--primary" id="genBtn" onclick="generateCards()">Generate</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentUser, allCards = [], filtered = [];

(async () => {
  currentUser = await initAdminLayout('scratch-cards', 'Scratch Cards');
  if (!currentUser) return;

  document.getElementById('pageBody').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;">
      <div><h1 style="font-size:1.45rem;font-weight:800;margin:0;">Scratch Cards</h1><p style="color:var(--ink-3);font-size:.875rem;margin:4px 0 0;">Generate and manage result-checker scratch cards</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn--secondary btn--sm" onclick="exportCards()">Export CSV</button>
        <button class="btn btn--secondary btn--sm" onclick="printCards()">Print Cards</button>
        <button class="btn btn--primary btn--sm" onclick="openModal('genModal')">+ Generate Cards</button>
      </div>
    </div>
    <div class="stats-sm">
      <div class="stat-sm"><div style="font-size:1.5rem;font-weight:900;" id="stTotal">—</div><div style="font-size:.7rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;margin-top:3px;">Total</div></div>
      <div class="stat-sm"><div style="font-size:1.5rem;font-weight:900;color:#16a34a;" id="stUnused">—</div><div style="font-size:.7rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;margin-top:3px;">Available</div></div>
      <div class="stat-sm"><div style="font-size:1.5rem;font-weight:900;color:#dc2626;" id="stUsed">—</div><div style="font-size:.7rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;margin-top:3px;">Used</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <select class="form-control" id="cardStatusFilter" onchange="filterCards()" style="max-width:140px;"><option value="">All Status</option><option value="unused">Available</option><option value="used">Used</option></select>
      <div style="position:relative;flex:1;max-width:280px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" class="form-control" id="cardSearch" placeholder="Search serial or PIN…" style="padding-left:32px;" oninput="filterCards()">
      </div>
    </div>
    <div id="cardsContent"><div style="text-align:center;padding:32px;color:var(--ink-3);">Loading…</div></div>
  `;
  loadCards();
})();

async function loadCards() {
  const { data, error } = await db.from('scratch_cards')
    .select('*')
    .eq('school_id', currentUser.school_id)
    .order('created_at', { ascending: false });
  if (error) { showError('#cardsContent', error.message); return; }
  allCards = data || [];
  const total = allCards.length, used = allCards.filter(c=>c.is_used).length;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stUnused').textContent = total - used;
  document.getElementById('stUsed').textContent = used;
  filterCards();
}

function filterCards() {
  const status = document.getElementById('cardStatusFilter').value;
  const q = (document.getElementById('cardSearch').value||'').toLowerCase();
  filtered = allCards.filter(c => {
    if (status === 'used' && !c.is_used) return false;
    if (status === 'unused' && c.is_used) return false;
    if (q && !(c.serial_no||'').toLowerCase().includes(q) && !(c.pin||'').includes(q)) return false;
    return true;
  });
  renderCards();
}

function renderCards() {
  const wrap = document.getElementById('cardsContent');
  if (!filtered.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:48px;color:var(--ink-3);">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3;display:block;margin:0 auto 12px;"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
      <p style="font-weight:600;">No cards found</p>
      ${allCards.length === 0 ? `<button onclick="openModal('genModal')" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:.8rem;font-weight:600;text-decoration:underline;padding:0;">Generate your first batch</button>` : ''}
    </div>`;
    return;
  }
  wrap.innerHTML = `<div class="card-grid">${filtered.slice(0,100).map(c=>`
    <div class="scratch-card">
      <div class="sc-serial">${c.serial_no||'—'}</div>
      <div class="sc-pin">${c.pin||'—'}</div>
      <span class="sc-status ${c.is_used?'used':''}">${c.is_used?'Used':'Available'}</span>
      ${c.purpose?`<div class="sc-meta">${c.purpose}</div>`:''}
      ${c.used_at?`<div class="sc-meta">Used: ${new Date(c.used_at).toLocaleDateString('en-GB')}</div>`:''}
    </div>`).join('')}</div>
    ${filtered.length > 100 ? `<p style="text-align:center;color:var(--ink-3);font-size:.845rem;margin-top:12px;">Showing 100 of ${filtered.length}. Export CSV for full list.</p>` : ''}`;
}

async function generateCards() {
  const btn = document.getElementById('genBtn');
  const errEl = document.getElementById('genErr');
  const count = parseInt(document.getElementById('genCount').value);
  if (!count || count < 1 || count > 200) { errEl.textContent = 'Enter a count between 1 and 200.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Generating…';
  const pinLen = parseInt(document.getElementById('genPinLen').value);
  const purpose = document.getElementById('genPurpose').value.trim();
  const now = Date.now();
  const cards = Array.from({ length: count }, (_, i) => ({
    school_id: currentUser.school_id,
    serial_no: `SC${String(now).slice(-6)}${String(i+1).padStart(4,'0')}`,
    pin: Array.from({ length: pinLen }, () => Math.floor(Math.random()*10)).join(''),
    is_used: false,
    purpose: purpose || null,
  }));
  const { error } = await db.from('scratch_cards').insert(cards);
  btn.disabled = false; btn.textContent = 'Generate';
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  closeModal('genModal'); toast(`${count} cards generated.`, 'success'); loadCards();
}

function exportCards() {
  const rows = filtered.map(c => [c.serial_no, c.pin, c.is_used?'Used':'Available', c.purpose||'', c.used_at||'']);
  const csv = [['Serial No','PIN','Status','Purpose','Used At'],...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `scratch-cards-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function printCards() { window.print(); }
</script>
<script src="/js/pwa-v2.1.js"></script>
<script src="../js/ai-assistant.js" defer></script>
</body>
</html>
